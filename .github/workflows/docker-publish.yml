name: Docker Publish (GHCR)

# Builds and pushes the 2 ReqogniLoom images (backend, frontend) to GitHub
# Container Registry on version tags. Celery/celery-beat reuse the backend
# image with a different `command:` override (see docker-compose.yml) — there
# is no separate Celery image, since celery/celery-beat/migrate all import
# the same Django app code as the web process; splitting it out would only
# duplicate the build/dependency layers without any runtime isolation gain.
#
# Tagging: every push of a `vX.Y.Z` tag publishes that exact version tag
# (always) and additionally moves the `latest` tag to it (skipped for
# pre-release tags like `v1.1.0-rc1`), so operators can pin a version or
# track `latest`.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - image: backend
            context: ./backend
            target: ''
          - image: frontend
            context: ./frontend
            target: production

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/reqogniloom-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=manual-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Resolve build metadata (backend version stamp)
        id: build_meta
        run: |
          echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "git_commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push (backend — stamps version/commit/build-time)
        if: matrix.image == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.build_meta.outputs.app_version }}
            GIT_COMMIT_SHA=${{ steps.build_meta.outputs.git_commit_sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Build and push (frontend)
        if: matrix.image == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
