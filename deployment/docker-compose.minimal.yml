# ReqogniLoom — Minimal 6-Service Deployment via GHCR Pre-Built Images
#
# Reduced variant of docker-compose.ghcr.yml for small/single-instance setups.
# Folds the one-shot `migrate` step into `backend`'s startup command and the
# `celery-beat` scheduler into `celery` (embedded beat via `-B`). Keeps
# `postgres-backup` since losing backups is not an acceptable trade-off.
#
# Tradeoffs vs. the full 8-service file (docker-compose.ghcr.yml):
# • backend runs migrations on every start, in-process. Safe for a single
#   backend replica; racy if you ever scale `backend` to >1 replica — use
#   the full file's dedicated `migrate` service instead in that case.
# • celery with embedded beat (`-B`) must stay at exactly one replica — two
#   beat schedulers double-fire periodic tasks. Use the full file's
#   dedicated `celery-beat` service if you need to scale Celery workers.
#
# ┌─ QUICK START ─────────────────────────────────────────────────────┐
# │ 1. cp deployment/.env.example deployment/.env                     │
# │ 2. Fill in all CHANGE-ME values in deployment/.env                │
# │ 3. Set GHCR_OWNER and IMAGE_TAG (see below)                       │
# │ 4. docker compose -f deployment/docker-compose.minimal.yml        │
# │      --env-file deployment/.env pull                              │
# │ 5. docker compose -f deployment/docker-compose.minimal.yml        │
# │      --env-file deployment/.env up -d                             │
# └─────────────────────────────────────────────────────────────────┘
#
# IMAGE TAGGING:
#   GHCR_OWNER   — GitHub org/user that owns the images (default: popoboxxo)
#   IMAGE_TAG    — pin a version (e.g. 1.2.0) or track `latest` (default: latest)
# Pin IMAGE_TAG in production; `latest` is convenient for homelab/test use
# but moves underneath you on every release.
#
# SECURITY NOTES:
# • NEVER commit deployment/.env with real secrets (already in .gitignore)
# • Always use HTTPS reverse proxy in production (nginx, Traefik, Caddy, ...)
# • Keep DEBUG=False in production
# • Use strong POSTGRES_PASSWORD / SECRET_KEY (32+ random chars)
# • Do not publish ports 5432 (postgres) / 6379 (redis) beyond the docker network

services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL — ARCH-L1-010 PersistenceLayer
  # ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-reqogniloom}
      POSTGRES_USER: ${DB_USER:-reqogniloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reqogniloom}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # PostgreSQL Backup — REQ-102 (INF-21) backup strategy
  # ─────────────────────────────────────────────────────────
  # Requires backend/scripts/backup_postgres.sh from a repo checkout mounted
  # read-only. If you deploy without a repo checkout, drop this service and
  # back up via an external tool instead.
  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-reqogniloom}
      POSTGRES_USER: ${DB_USER:-reqogniloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
    volumes:
      - postgres_backup_data:/backups
      - ${REPO_ROOT:-..}/backend/scripts/backup_postgres.sh:/usr/local/bin/backup_postgres.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /bin/sh /usr/local/bin/backup_postgres.sh || echo "[backup] run failed";
          sleep "${BACKUP_INTERVAL:-86400}";
        done
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────
  # Redis — ARCH-L1-016 ResilienceOrchestrator (Celery broker)
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "${REDIS_PASSWORD}" ]; then
          exec redis-server --maxmemory 256mb --maxmemory-policy volatile-lru --appendonly yes
        else
          exec redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy volatile-lru --appendonly yes
        fi
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # Django Backend — All backend ARCH-L1 systems
  # ─────────────────────────────────────────────────────────
  # Migration + self-init (REQ-188) folded into the backend's own startup: it
  # runs `manage.py migrate` (which triggers the post_migrate self-init
  # receiver — base tenant, admin user, default workflows, create-only on
  # password) before launching gunicorn. Single replica only — see the
  # tradeoffs note at the top of this file.
  backend:
    image: ghcr.io/${GHCR_OWNER:-popoboxxo}/reqogniloom-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_NAME: ${DB_NAME:-reqogniloom}
      # Two DB roles share this one container invocation (see `command:`
      # below): `python manage.py migrate` needs the Postgres superuser (RLS,
      # REQ-L2-PL-010, does not restrict superusers, but the least-privilege
      # app role lacks the DDL privileges migrations need — see
      # persistence/migrations/0048_app_role.py), while the long-running
      # gunicorn process must run as the least-privilege app role so RLS
      # tenant-isolation actually applies to request traffic. The ambient
      # DB_USER/DB_PASSWORD below stay pinned to the superuser (used by the
      # `migrate` sub-step); `command:` then overrides them to
      # DB_APP_USER/DB_APP_PASSWORD inline, just for the exec'd gunicorn
      # process, so the two sub-steps authenticate with different roles even
      # though they're one container/one `environment:` block.
      DB_USER: ${DB_USER:-reqogniloom}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      # Least-privilege app role (persistence/migrations/0048_app_role.py),
      # consumed only by the inline override in `command:` below — see the
      # comment on DB_USER above.
      DB_APP_USER: ${DB_APP_USER:-reqogniloom_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      # LLM Provider — ARCH-L1-009 LlmAdapter (ADR-02)
      # Set LLM_PROVIDER=anthropic|openai|ollama to enable AI features.
      # Graceful degradation if not set (REQ-L1-032).
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SYSTEM_ADMIN_USERNAME: ${SYSTEM_ADMIN_USERNAME:-admin}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:-admin@demo.local}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:-}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-1}
    volumes:
      - backend_dr_backups:/app/backups
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `migrate` runs first with the ambient (superuser) DB_USER/DB_PASSWORD
    # above; gunicorn then gets DB_USER/DB_PASSWORD overridden inline to the
    # least-privilege DB_APP_USER/DB_APP_PASSWORD so runtime traffic is
    # subject to RLS tenant-isolation. See the DB_USER comment above.
    command: >
      sh -c "python manage.py migrate &&
             DB_USER=\"$$DB_APP_USER\" DB_PASSWORD=\"$$DB_APP_PASSWORD\" gunicorn reqogniloom.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 4"

  # ─────────────────────────────────────────────────────────
  # Celery Worker + Beat Scheduler — ARCH-L1-016 ResilienceOrchestrator, REQ-030
  # ─────────────────────────────────────────────────────────
  # REQ-077: single worker consumes all queues. Beat is embedded via `-B` —
  # exactly one replica of this service, ever (two beats double-fire
  # periodic tasks). Scale to a dedicated celery + celery-beat pair (see
  # docker-compose.ghcr.yml) if you need >1 worker replica.
  celery:
    image: ghcr.io/${GHCR_OWNER:-popoboxxo}/reqogniloom-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-reqogniloom}
      # Least-privilege app role (persistence/migrations/0048_app_role.py), not
      # the superuser — RLS tenant-isolation must actually apply to task traffic.
      DB_USER: ${DB_APP_USER:-reqogniloom_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "celery -A reqogniloom inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: >
      sh -c "celery -A reqogniloom worker -B --loglevel=info -Q default,llm,events --scheduler django_celery_beat.schedulers:DatabaseScheduler"

  # ─────────────────────────────────────────────────────────
  # React Frontend — ARCH-L1-001 ReactFrontend
  # ─────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/${GHCR_OWNER:-popoboxxo}/reqogniloom-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # NOTE: VITE_API_BASE_URL / VITE_ALLOWED_HOSTS are baked into the image at
    # build time (Vite). They cannot be changed at runtime for a pre-built
    # image — if your deployment needs a different API URL, build your own
    # frontend image from source (see the root docker-compose.yml) instead of
    # pulling ghcr.io/.../reqogniloom-frontend.
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_backup_data:  # REQ-102: retained pg_dump backups
  backend_dr_backups:    # REQ-L1-046: admin_ops DR backup JSON files (/app/backups)
