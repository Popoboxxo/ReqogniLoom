name: Playwright E2E Tests

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: reqflow
          POSTGRES_USER: reqflow
          POSTGRES_PASSWORD: reqflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Django migrations
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          AUTH_JWT_SECRET: ci-test-auth-jwt-secret
          FIELD_ENCRYPTION_KEY: 'KzOBYC05wXl_7i1FedEC0dPI8E61uRMmXwhSVd40fis='
          DJANGO_ENV: test
          DEBUG: 'True'
          DB_NAME: reqflow
          DB_USER: reqflow
          DB_PASSWORD: reqflow
          DB_HOST: localhost
          DB_PORT: '5432'
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          ALLOWED_HOSTS: localhost,127.0.0.1
          DEFAULT_TENANT_ID: '1'
          LLM_PROVIDER: mock
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo

      - name: Start Django backend
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          AUTH_JWT_SECRET: ci-test-auth-jwt-secret
          FIELD_ENCRYPTION_KEY: 'KzOBYC05wXl_7i1FedEC0dPI8E61uRMmXwhSVd40fis='
          DJANGO_ENV: test
          DEBUG: 'True'
          DB_NAME: reqflow
          DB_USER: reqflow
          DB_PASSWORD: reqflow
          DB_HOST: localhost
          DB_PORT: '5432'
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          ALLOWED_HOSTS: localhost,127.0.0.1
          DEFAULT_TENANT_ID: '1'
          LLM_PROVIDER: mock
          VITE_API_BASE_URL: http://localhost:8000
        run: python manage.py runserver 0.0.0.0:8000 &

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Start Vite frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run dev &

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for services
        run: |
          echo "Waiting for backend..."
          timeout 30 bash -c 'until curl -sf http://localhost:8000/api/v1/schema/ > /dev/null; do sleep 2; done'
          echo "Waiting for frontend..."
          timeout 30 bash -c 'until curl -sf http://localhost:5173/ > /dev/null; do sleep 2; done'

      - name: Verify prod Docker build (smoke test)
        # Build the frontend production Docker image to ensure no build-time regressions
        run: docker build -f frontend/Dockerfile --target production frontend --no-cache -t reqflow-frontend:latest

      - name: Run Playwright E2E tests
        working-directory: e2e
        env:
          FRONTEND_URL: http://localhost:5173
          BACKEND_URL: http://localhost:8000
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report/
          retention-days: 7
