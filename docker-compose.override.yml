# Docker Compose Override for Development
#
# Usage: Place this file in the project root. `docker compose up` will automatically
# merge this with docker-compose.yml, providing dev conveniences without modifying
# the production base configuration.
#
# For production deployment, delete or rename this file so only docker-compose.yml is used.

services:
  postgres:
    # Development: lower resource limits OK
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reqogniloom}  # Weak password OK for dev

  backend:
    # Development: Use dev server and hot-reload
    environment:
      # DJANGO_ENV=development lets the settings hardening honour DEBUG=True here;
      # in production (no override) DJANGO_ENV defaults to "production" and DEBUG
      # is forced False regardless of the .env value (REQ-115 hardening).
      DJANGO_ENV: ${DJANGO_ENV:-development}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    volumes:
      # Hot-reload: mount source code
      - ./backend:/app
      # Read-only: docs/se/ (SE requirements register) for the
      # migrate_se_docs management command (ReqFlow self-migration).
      - ./docs:/app/docs:ro
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  migrate:
    # Development: run current source so the REQ-188 post_migrate self-init
    # applies without a rebuild (matches the backend/celery hot-reload mounts).
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-development}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    volumes:
      - ./backend:/app

  celery:
    # Development: verbose logging
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-development}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    volumes:
      # Hot-reload: mount source code
      - ./backend:/app
    command: >
      sh -c "celery -A reqogniloom worker --loglevel=debug"

  frontend:
    # Development: Use dev server with Vite hot module replacement
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      # Hot-reload: mount source code
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
