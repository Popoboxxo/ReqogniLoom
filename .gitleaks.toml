# Gitleaks config for the DEFAULT-rule scan gate (SECTRACK-03, S0.1/R1).
#
# This file is used ONLY by the default-rule scans in .github/workflows/ci.yml:
#   * the fourth blocking step (full git history AND working tree, no
#     `--enable-rule`), and
#   * the default-rule part of the canary step.
# It declares the default ruleset (`useDefault = true`) plus narrow, reviewed
# global [[allowlists]] so known fixtures do not drown that gate.
#
# The three original, dedicated scans (reqlo-api-key over tree + history and
# env-secret-assignment over the PR diff) do NOT use this file any more. They
# use .gitleaks-dedicated.toml, which sets `useDefault = false` and has NO
# global allowlists. Reason (review finding R1): gitleaks applies global
# allowlists to EVERY rule, including custom ones. Sharing this file let the
# default-rule exemptions (docs/, tests/, .env.example, the SEC-001 commits,
# ...) suppress the two custom rules too — a reqlo_<40 alnum> token in an
# allowlisted path was silently NOT reported. The dedicated config keeps those
# gates strict in any path; the allowlists below affect only this file's
# default-rule gate.
#
# The two custom rule definitions are kept here as documentation of the shapes
# and so the default-rule canary can assert their RuleIDs; the authoritative
# definitions for the dedicated scans live in .gitleaks-dedicated.toml. Keep
# the two files' regexes/keywords/stopwords in sync.
#
# Pinned scanner: gitleaks 8.30.1. gitleaks 8.30.1 only knows the `git` and
# `dir` subcommands; the older `detect`/`protect` commands no longer exist.
# See .pre-commit-config.yaml (two local hooks, rev v8.30.1) and the CI
# backstop step in .github/workflows/ci.yml (release archive pinned by sha256).
#
# The `env-secret-assignment` rule runs over the PR diff so historical test
# values and the repository's own placeholder docs do not turn it red. Scope:
# literal assignments of a secret-shaped env var to a value of 12+ non-
# whitespace characters. Known placeholder shapes (`<strong-password>`,
# `my_secure_password`, `<generate-with-python-…>`) are EXACT stopwords (W0-08)
# plus path exemptions for fixtures/`.example` files; a real assignment in the
# same file still matches. Never disable the rule or widen its path allowlist
# to a whole directory.
#
# Because the default detectors also fire on intentional fixtures (e.g.
# `VALID_API_KEY = "..."`, `DB_PASSWORD=...` in docs/tests, git-SHA-shaped false
# positives, and the documented 44-character README example), those KNOWN,
# reviewed hits are exempted by the narrow [[allowlists]] entries at the bottom
# of this file — each with a reason. The canary step proves the default
# detectors remain live in CI. Local full-history evidence:
# docs/audit/2026-11-17-s01-gitleaks-evidence.md.
#
# The incident rule is boundary-anchored to EXACTLY 40 alphanumeric characters
# after the `reqlo_` prefix:
#   * live incident key  -> reqlo_<40 alnum>  => MATCH
#   * README example      -> reqlo_<44 alnum>  => no match (no \b after char 40)
#   * test fixtures       -> reqlo_<...><40>   => no match (underscores/short)
# The earlier claim that "the history was rewritten and is secret-free" was
# FALSE: SEC-001 rotation + history rewrite are still USER-BLOCKED (see the
# temporary entry #5 at the bottom). The reqlo rule itself has no path
# allowlist in the dedicated config, so a live token in ANY path is reported
# there; these global allowlists never reach that config.
title = "ReqogniLoom gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "reqlo-api-key"
description = "ReqogniLoom API key (reqlo_ prefix + 40 alphanumeric characters)"
regex = '''reqlo_[A-Za-z0-9]{40}\b'''
keywords = ["reqlo_"]

# Plan D / D2.6 (QR-S03): literal env-secret assignment, e.g.
#   SECRET_KEY=<32 bytes of real material>
#   HONCHO_API_KEY=...
#   DB_PASSWORD=...
#   BLUEPENCIL_AUTH_SECRET=... / GITHUB_TOKEN=... (W0-03)
# Runs as a blocking step over the PR diff only (see the header).
#
# The variable-name alternatives are NON-capturing; the value is the only
# capture group and is named `secret`, so gitleaks reports the assignment
# VALUE (not the variable name). That is what makes the placeholder
# stopwords below effective: they are compared against the secret.
#
# Matching shape (W0-09): optional indentation, optional `export `, then the
# assignment. Only spaces/tabs are accepted as indentation: `\s` also matches
# newlines, so it could bridge to a following line instead of matching the
# line the anchor started on.
[[rules]]
id = "env-secret-assignment"
description = "Literal assignment of a secret-shaped environment variable to a non-placeholder value"
regex = '''(?m)^[ \t]*(?:export[ \t]+)?(?:SECRET_KEY|AUTH_JWT_SECRET|FIELD_ENCRYPTION_KEY|[A-Z_]*API_KEY|[A-Z_]*PASSWORD|[A-Z_]*_SECRET|[A-Z_]*_TOKEN)=(?P<secret>\S{12,})'''
# Keywords gate which fragments the regex is evaluated against. `SECRET` and
# `TOKEN` cover the W0-03 suffix classes (`*_SECRET`, `*_TOKEN`) and the
# `*_KEY` variants that contain them.
keywords = ["SECRET", "TOKEN", "API_KEY", "PASSWORD", "FIELD_ENCRYPTION_KEY"]

  # Fixtures and docs legitimately contain assignment-shaped sample values.
  # `CHANGE-ME…` is the documented placeholder of .env.example and the
  # `…-IN-PRODUCTION…` suffix it uses.
  [rules.allowlist]
  paths = [
    '''\.example$''',
    '''(^|/)tests?/''',
    '''(^|/)test_[^/]*\.py$''',
    '''^e2e/''',
  ]
  # W0-08: exact README placeholders (README.md:274,1403,1406,1418-1420).
  # These are literal, non-secret values tracked in the repository, so they
  # must not be exempted per PR (the pressure that widens the rule over time)
  # but matched by exact substring. A real value does not contain them.
  stopwords = [
    "CHANGE-ME",
    "change-me",
    "<strong-password>",
    "<neues-passwort>",
    "my_secure_password",
    "<generate-with-python-secrets>",
    "<generate-with-python-cryptography-fernet>",
  ]

# ─────────────────────────────────────────────────────────────────────────────
# Global allowlists for the FOURTH blocking gate (OPS-003 / SEC-006).
#
# These exist ONLY so the default-rule scan (full history + working tree) does
# not drown in reviewed false positives. Each entry is narrow, carries a
# reason, and was derived from an actual gitleaks 8.30.1 scan of this checkout.
# Rules are never disabled and no live-secret shape is exempted: a real
# AWS/GitHub/PEM/API key anywhere outside these reviewed fixtures still fails
# the gate, and the canary step re-proves the default detectors at CI time.
# Keep this list minimal; a new exemption needs a concrete, documented reason.
# ─────────────────────────────────────────────────────────────────────────────

# 1. SEC-001 documentation example: `reqlo_` + 44 alphanumerics. It is a
#    format-invalid sample (the live rule matches EXACTLY 40), proven to return
#    HTTP 401 in the incident audit. Allowlisted by exact value, never by a
#    `reqlo_[A-Za-z0-9]+` wildcard.
[[allowlists]]
description = "SEC-001 README doc example (reqlo_ + 44 alnum, format-invalid, live-checked 401)"
regexes = ['''reqlo_Ab12Cd34Ef56Gh78Ij90Kl12Mn34Op56Qr78St90Uv12''']

# 2. Test fixtures: fake credentials (VALID_API_KEY, _PASSWORD, raw_key, ...)
#    are intentional in unit/E2E tests and test settings. Mirrors the
#    env-secret-assignment rule-level path allowlist above.
[[allowlists]]
description = "Test fixtures and test settings hold intentional fake credentials"
paths = [
  '''(^|/)tests?/''',
  '''(^|/)test_[^/]*\.py$''',
  '''(^|/)settings_test\.py$''',
]

# 3. Documentation and generated artifacts: example values and git-SHA-shaped
#    strings (the sourcegraph rule flags 40-hex commit ids) are documentation,
#    not credentials.
[[allowlists]]
description = "Docs and generated artifacts contain examples / 40-hex commit ids, not live secrets"
paths = [
  '''\.md$''',
  '''^repomix-output\.xml$''',
  '''^\.meta-config/generated-file-hashes\.json$''',
]

# 4. Build/deploy placeholders: these files use shell/Compose variable
#    interpolation (${VAR}, $VAR) or documented local-dev defaults, not
#    embedded production credentials.
[[allowlists]]
description = "Build/deploy files use runtime interpolation or documented local-dev placeholders"
paths = [
  '''^backend/Dockerfile$''',
  '''^backend/llm_adapter/providers\.py$''',
  '''^backend/(auth_tenancy|persistence)/migrations/''',
  '''^backend/scripts/backup_postgres\.sh$''',
  '''^deploy/''',
  '''^scripts/restore\.sh$''',
  '''^\.github/workflows/''',
]

# 5. TEMPORARY — SEC-001 historical committed `.env`. HARD REMOVAL DATE:
#    2026-12-01. Owner: devops-engineer (the rotation + history rewrite itself
#    is USER-BLOCKED: owner approval + maintenance window required).
#    Issue / evidence: SEC-001 in
#    docs/audit/gates/2026-11-16/mvp-gates.md#s01--secret-incident--security-baseline
#    and docs/audit/2026-11-16-deep-dive-findings.md.
#    CI enforces the deadline: the "SEC-001 temp allowlist expiry guard" step
#    in .github/workflows/ci.yml fails the gate from 2026-12-01 onward while
#    this entry is still present, so it cannot stay forever. Remove BOTH this
#    entry and that step once rotation + rewrite have landed.
#
#    Reconciled commit set (the gate report's `git log --all -S '7d7091'` plus
#    the gitleaks 8.30.1 full-history scan of this checkout):
#      * 798650dfad0c11c40285596d2b591d3faee75686 — introduced the committed
#        `.env` (1 gitleaks finding on `.env`).
#      * a8cee99e1545e5a4df3b727f6a760a5417ed1daa — modified it
#        (2 gitleaks findings on `.env`; full SECRET_KEY/DB_PASSWORD at :11/:20).
#      * bad447fdb9ca366bb6cbec5c78730acfc0e79553 — untracked/removed `.env`
#        (the gate report's removal commit; gitleaks 8.30.1 reports 0 findings
#        on it today, retained so the whole incident chain is documented).
#    The audit-doc commits cedb62f8 / 08550995 contain only truncated prefixes
#    in Markdown; they are covered by the `\.md$` path allowlist in entry #3
#    above and deliberately NOT listed here.
#
#    Narrowing: gitleaks ORs allowlist conditions, so `commits` alone suppresses
#    every file in those commits. `paths` documents the only relevant file and
#    `targetRules` restricts this entry to the two rules that actually fire on
#    those lines (env-secret-assignment and generic-api-key — gitleaks dedupes
#    same-line hits, so both must be listed to keep the gate green). Together
#    they prevent this incidental suppression from reaching other rules or
#    files. This entry has NO effect on the dedicated scans: they use
#    .gitleaks-dedicated.toml, which has no global allowlists at all.
[[allowlists]]
description = "TEMP SEC-001 committed .env - owner: devops-engineer - issue: SEC-001 in docs/audit/gates/2026-11-16/mvp-gates.md - remove-by: 2026-12-01"
commits = [
  "798650dfad0c11c40285596d2b591d3faee75686",
  "a8cee99e1545e5a4df3b727f6a760a5417ed1daa",
  "bad447fdb9ca366bb6cbec5c78730acfc0e79553",
]
paths = ['''^\.env$''']
targetRules = ["env-secret-assignment", "generic-api-key"]

