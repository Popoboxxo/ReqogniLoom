      expected_en: "`initialize` (202 + event) → `tools/list` returns **223 tools**; the Antigravity panel shows `reqogniloom` connected."
      tool_result: "223 tools"
    prereq_de:
      - "Antigravity-Installation."
      - "**Host-CPU mit `pclmulqdq`** — sonst bricht das Binary mit exit 132 ab („compiled with pclmul enabled\", nicht software-lösbar)."
      - "`reqlo_…`-Key."
    prereq_en:
      - "Antigravity installation."
      - "**Host CPU with `pclmulqdq`** — otherwise the binary aborts with exit 132 (\"compiled with pclmul enabled\", not software-fixable)."
      - "A `reqlo_…` key."
    provider_de:
      - "Kein ReqogniLoom-spezifischer Teil; Antigravity ist eine Preview-Plattform."
    provider_en:
      - "No ReqogniLoom-specific part; Antigravity is a preview platform."
    pitfalls_de:
      - "CPU-Feature fehlt → `exit 132` / `pclmul` (in GitHub-hosted CI nicht abbildbar)."
      - "Antigravity ist Preview mit dokumentierten Sicherheitsfindungen → **read-only-Key** verwenden."
      - "Wie OpenCode: **keine** Tool-Beschränkung je Skill."
    pitfalls_en:
      - "Missing CPU feature → `exit 132` / `pclmul` (not reproducible on GitHub-hosted CI)."
      - "Antigravity is preview with documented security findings → use a **read-only key**."
      - "Like OpenCode: **no** per-skill tool restriction."
    roles_de:
      - "Read-only-Rolle ist hier besonders empfohlen."
    roles_en:
      - "A read-only role is especially recommended here."
    update_de:
      - "Paket/Store-Update neu ziehen; Stufe-2-Ziel: Veröffentlichung im MCP-Store statt Datei-Merge."
    update_en:
      - "Re-pull the package/store update; Stage-2 goal: publish in the MCP store instead of merging files."

  - id: hermes
    name: Hermes
    tested_version: "current stack"
    target_level: L3
    status: supported
    transport: stdio
    url_path: ""
    auth_header: "X-API-Key"
    config_artifact: integrations/hermes-plugin/reqogniloom/hermes-plugin.json
    skills_dir: "~/.hermes/skills"
    install_de:
      - lang: bash
        text: |
          # Ein Befehl: MCP-Server + Agent-Skill (-> ~/.hermes/skills/reqogniloom).
          # --url ist Pflicht-Argument, wird von Hermes (stdio) aber ignoriert:
          scripts/clients/install.sh --client hermes \
            --url "https://<host>" --key-env REQOGNILOOM_API_KEY
          hermes mcp test reqogniloom         # -> ✓ Connected, 223 Tools
    install_en:
      - lang: bash
        text: |
          # One command: MCP server + agent skill (-> ~/.hermes/skills/reqogniloom).
          # --url is a required argument but ignored by Hermes (stdio):
          scripts/clients/install.sh --client hermes \
            --url "https://<host>" --key-env REQOGNILOOM_API_KEY
          hermes mcp test reqogniloom         # -> ✓ Connected, 223 tools
    fallback_de:
      - lang: bash
        text: |
          # Desktop-Plugin (Electron) zusätzlich:
          # integrations/hermes-plugin/reqogniloom  (siehe README dort)
          # Agent-Skill (TUI/Web/CLI) – additiv:
          hermes skills install https://raw.githubusercontent.com/Popoboxxo/ReqogniLoom/main/integrations/hermes-skill/reqogniloom/SKILL.md
    fallback_en:
      - lang: bash
        text: |
          # Desktop plugin (Electron) additionally:
          # integrations/hermes-plugin/reqogniloom  (see its README)
          # Agent skill (TUI/Web/CLI) – additive:
          hermes skills install https://raw.githubusercontent.com/Popoboxxo/ReqogniLoom/main/integrations/hermes-skill/reqogniloom/SKILL.md
    verify:
      command: "hermes mcp test reqogniloom"
      expected_de: "`✓ Connected` (QA: 2232 ms, 223 Tools); echte Calls: `requirement_query` → 49, `architecture_query` → 1."
      expected_en: "`✓ Connected` (QA: 2232 ms, 223 tools); real calls: `requirement_query` → 49, `architecture_query` → 1."
      tool_result: "223 tools; requirement_query = 49"
    prereq_de:
      - "Hermes-Installation; MCP-Bridge (`reqogniloom-mcp-bridge`)."
      - "Key in `~/.hermes/.env`."
    prereq_en:
      - "Hermes installation; MCP bridge (`reqogniloom-mcp-bridge`)."
      - "Key in `~/.hermes/.env`."
    provider_de:
      - "Unabhängig von ReqogniLoom — Hermes nutzt seine eigene LLM-Config."
    provider_en:
      - "Independent of ReqogniLoom — Hermes uses its own LLM config."
    pitfalls_de:
      - "Zwei getrennte Integrationspfade (Desktop-Plugin vs. Agent-/Skill-Connector) — klar trennen."
      - "`Cancel` im Plugin ruft seit #1152 `interview.abandon` auf, damit Sessions nicht als `in_progress` liegen bleiben."
    pitfalls_en:
      - "Two separate integration paths (desktop plugin vs. agent/skill connector) — keep them apart."
      - "The plugin's `Cancel` calls `interview.abandon` as of #1152 so sessions do not linger as `in_progress`."
    roles_de:
      - "Key-Scope steuert die Rechte; read-only für reine Lesezwecke."
    roles_en:
      - "Key scope governs permissions; read-only for pure read use."
    update_de:
      - "Repo-Pull bzw. Store-Update; Stufe-2-Ziel: Katalogeintrag → `hermes mcp install reqogniloom`."
    update_en:
      - "Repo pull or store update; Stage-2 goal: catalog entry → `hermes mcp install reqogniloom`."
