# ReqFlow Docker Compose Orchestration
# ADR-08: Self-Hosted via Docker Compose — Production-Ready Configuration
#
# ┌─ SETUP ─────────────────────────────────────────────────────────┐
# │ 1. Copy .env.example to .env and fill in all CHANGE-ME values   │
# │ 2. Generate SECRET_KEY: python3 -c "import secrets;              │
# │    print(secrets.token_hex(50))"                                │
# │ 3. Set ALLOWED_HOSTS to your actual server hostname(s)          │
# │ 4. docker-compose build && docker-compose up -d                 │
# │ 5. docker-compose exec backend python manage.py migrate         │
# └─────────────────────────────────────────────────────────────────┘
#
# DEVELOPMENT OVERRIDE:
# For development with hot-reload, docker-compose.override.yml
# is automatically merged by Docker Compose. To use it, ensure the
# file exists in the project root (it does, by default).
# For production, delete docker-compose.override.yml.
#
# SECURITY NOTES:
# • NEVER commit .env with real secrets (already in .gitignore)
# • Always use HTTPS reverse proxy in production (nginx, Traefik, etc.)
# • Keep DEBUG=False in production
# • Use strong POSTGRES_PASSWORD (32+ random chars)
# • Restrict network access to ports 5432 (postgres) and 6379 (redis)
#
# SECRET MANAGEMENT (REQ-062):
# All services load configuration from .env via env_file directives.
# Sensitive values: SECRET_KEY, DB_PASSWORD, REDIS_PASSWORD, LLM_API_KEY.
# Environment variables override defaults throughout — zero secrets in compose file.

services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL — ARCH-L1-010 PersistenceLayer
  # ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-reqogniloom}
      POSTGRES_USER: ${DB_USER:-reqogniloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # NOTE: If you change DB_PASSWORD after initial setup, the existing postgres volume
      # will retain the old password. Remove the postgres_data volume or re-initialize:
      #   docker-compose down -v  # WARNING: deletes all postgres data
      #   docker-compose up -d
      - postgres_data:/var/lib/postgresql/data
      # Superuser bootstrap: installs the pgvector `vector` extension into
      # template1 AND ${DB_NAME} so the least-privilege runtime role
      # (DB_APP_USER, NOSUPERUSER — REQ-L2-PL-010) never has to run
      # `CREATE EXTENSION` itself. Every database cloned from template1
      # afterwards — including Django's ephemeral `test_*` databases created by
      # `pytest --create-db` — inherits the extension automatically.
      # Only executed on a completely EMPTY data directory; for an existing
      # volume run ./scripts/enable_pgvector.sh once instead.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reqogniloom}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # PostgreSQL Backup — REQ-102 (INF-21) backup strategy
  # ─────────────────────────────────────────────────────────
  # Sidecar that runs backend/scripts/backup_postgres.sh on a fixed interval
  # (BACKUP_INTERVAL seconds, default 24h). Each run writes a timestamped,
  # gzip-compressed pg_dump to the postgres_backup_data volume and prunes all
  # but the newest BACKUP_RETENTION (default 7) dumps. Restore with:
  #   gunzip -c reqogniloom_<ts>.sql.gz | psql -h postgres -U $DB_USER -d $DB_NAME
  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-reqogniloom}
      POSTGRES_USER: ${DB_USER:-reqogniloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
    volumes:
      - postgres_backup_data:/backups
      - ./backend/scripts/backup_postgres.sh:/usr/local/bin/backup_postgres.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /bin/sh /usr/local/bin/backup_postgres.sh || echo "[backup] run failed";
          sleep "${BACKUP_INTERVAL:-86400}";
        done
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────
  # Redis — ARCH-L1-016 ResilienceOrchestrator (Celery broker)
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "${REDIS_PASSWORD}" ]; then
          exec redis-server --maxmemory 256mb --maxmemory-policy volatile-lru --appendonly yes
        else
          exec redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy volatile-lru --appendonly yes
        fi
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # Django Backend — All backend ARCH-L1 systems
  # ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Stamps the deployed version/commit/build time into the image (GET
      # /api/v1/version/).
      #
      # For production CI/CD: the GitHub workflow (.github/workflows/docker-publish.yml)
      # overrides these args with real values from git + VERSION file.
      #
      # For local development: use the ./backend/scripts/build.sh helper:
      #   ./backend/scripts/build.sh [TAG]
      #
      # This script automatically extracts APP_VERSION (from ./VERSION),
      # GIT_COMMIT_SHA (from git rev-parse HEAD), and BUILD_TIME (current UTC).
      # It ensures single source of truth: env-vars set at build time match
      # the OCI image labels, eliminating drift (Issue #266).
      #
      # Manual override (not recommended):
      #   APP_VERSION=$(cat VERSION) GIT_COMMIT_SHA=$(git rev-parse HEAD) \
      #   BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) docker-compose build backend
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_NAME: ${DB_NAME:-reqogniloom}
      # Least-privilege app role (persistence/migrations/0048_app_role.py), not
      # the superuser — RLS tenant-isolation must actually apply to backend traffic.
      DB_USER: ${DB_APP_USER:-reqogniloom_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      # LLM Provider — ARCH-L1-009 LlmAdapter (ADR-02)
      # Set LLM_PROVIDER=anthropic|openai|ollama to enable AI features.
      # Graceful degradation if not set (REQ-L1-032).
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_LONG_RUNNING_TIMEOUT: ${LLM_LONG_RUNNING_TIMEOUT:-180}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-1}
    volumes:
      # REQ-L1-046: persist admin_ops DR backups (written to /app/backups) on a
      # named volume so they survive restarts/rebuilds and are writable by the
      # non-root app user (the image seeds ownership; see backend/Dockerfile).
      - backend_dr_backups:/app/backups
    ports:
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────────────────
  # Database Migration + Self-Init Service (REQ-188)
  # ─────────────────────────────────────────────────────────
  # Runs migrations before the backend serves traffic. The application layer
  # self-initialises a fresh deployment via a post_migrate receiver
  # (application.self_init, REQ-188): on an empty database this migrate run
  # provisions the base tenant, workspace, admin user/role AND the default
  # workflow/permission definitions — replacing both the former dedicated
  # `bootstrap` service and the manual `provision_workflow_definitions` command.
  # Single one-shot process → the self-init fires exactly once, no cross-worker
  # race (backend/celery never migrate). Idempotent and create-only on the admin
  # password: an admin who changed their password via UI/API is never reset;
  # SYSTEM_ADMIN_PASSWORD is required only when the admin does not exist yet
  # (mirrors createsuperuser --noinput). See backend/application/self_init.py.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-reqogniloom}
      DB_USER: ${DB_USER:-reqogniloom}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      # Read by persistence/migrations/0048_app_role.py to (re-)create the
      # least-privilege runtime role that backend/celery/celery-beat use.
      DB_APP_USER: ${DB_APP_USER:-reqogniloom_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Admin account provisioned by the post_migrate self-init on first start.
      # Username/email have safe defaults; SYSTEM_ADMIN_PASSWORD is required only
      # when the admin does not exist yet (mirrors createsuperuser --noinput).
      SYSTEM_ADMIN_USERNAME: ${SYSTEM_ADMIN_USERNAME:-admin}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:-admin@demo.local}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: python manage.py migrate

  # ─────────────────────────────────────────────────────────
  # Celery Worker — ARCH-L1-016 ResilienceOrchestrator
  # Handles async tasks: LLM calls, Webhooks, GitHub integration
  # ─────────────────────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-reqogniloom}
      # Least-privilege app role (persistence/migrations/0048_app_role.py), not
      # the superuser — RLS tenant-isolation must actually apply to task traffic.
      DB_USER: ${DB_APP_USER:-reqogniloom_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_LONG_RUNNING_TIMEOUT: ${LLM_LONG_RUNNING_TIMEOUT:-180}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "celery -A reqogniloom inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # TODO(ARCH-L1-016): Replace app name once Celery is configured in reqogniloom project
    # REQ-077: single worker consumes all queues. Split into dedicated workers
    # (e.g. a high-concurrency -Q llm worker) when workloads need to scale apart.
    command: >
      sh -c "celery -A reqogniloom worker --loglevel=info -Q default,llm,events"

  # ─────────────────────────────────────────────────────────
  # Celery Beat Scheduler — Periodic Tasks (REQ-030)
  # ─────────────────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-reqogniloom}
      # Least-privilege app role (persistence/migrations/0048_app_role.py), not
      # the superuser — RLS tenant-isolation must actually apply to task traffic.
      DB_USER: ${DB_APP_USER:-reqogniloom_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_LONG_RUNNING_TIMEOUT: ${LLM_LONG_RUNNING_TIMEOUT:-180}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # celery-beat has no worker to `inspect ping`, so this checks the beat
      # process itself is still running (#171 — makes a restart-loop like
      # "module reqogniloom was not found" visible via `docker ps`/health status
      # instead of failing silently).
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "celery -A reqogniloom beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"

  # ─────────────────────────────────────────────────────────
  # React Frontend — ARCH-L1-001 ReactFrontend
  # ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # For production: use 'production' target with nginx
      # For development: use 'development' target with 'docker-compose.override.yml'
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-localhost,127.0.0.1}
    restart: unless-stopped
    ports:
      - "80:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_backup_data:  # REQ-102: retained pg_dump backups
  backend_dr_backups:    # REQ-L1-046: admin_ops DR backup JSON files (/app/backups)
