<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Static fallback for pre-JS paint; overridden at runtime from APP_NAME (see src/index.tsx). -->
    <title>ReqogniLoom</title>

    <!-- Installable PWA (plan M1, REQ-213). Colours are copies of
         --color-nav-bg (dark) and --color-surface (light, tokens.css:930);
         pwa-manifest.test.ts keeps them honest against the token file. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
    <meta name="theme-color" content="#1a1f2e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
