# ReqFlow Docker Compose Orchestration
# ADR-08: Self-Hosted via Docker Compose — Production-Ready Configuration
#
# ┌─ SETUP ─────────────────────────────────────────────────────────┐
# │ 1. Copy .env.example to .env and fill in all CHANGE-ME values   │
# │ 2. Generate SECRET_KEY: python3 -c "import secrets;              │
# │    print(secrets.token_hex(50))"                                │
# │ 3. Set ALLOWED_HOSTS to your actual server hostname(s)          │
# │ 4. docker compose up -d                                         │
# │ 5. Migration + admin self-init run automatically (see `migrate`)│
# └─────────────────────────────────────────────────────────────────┘
#
# This is the FULL stack: postgres, postgres-backup, redis, backend, migrate,
# celery, celery-beat, frontend — everything a production deployment needs,
# always on. Want fewer moving parts (no async workers, no backup sidecar) for
# a quick try-out or a small install? Use docker-compose.minimal.yml instead:
#   docker compose -f docker-compose.minimal.yml up -d
#
# OPTIONAL: Honcho memory backend (MEMORY_BACKEND=honcho)
# The honcho-postgres/honcho-redis/honcho-migrate/honcho services below are
# gated behind the `honcho` Compose profile — defined in this same file so
# there is one file to read, but they cost nothing (no image pulled, no
# container started) unless you opt in:
#   docker compose --profile honcho up -d
#
# DEVELOPMENT OVERRIDE:
# For development with hot-reload, docker-compose.override.yml
# is automatically merged by Docker Compose. To use it, ensure the
# file exists in the project root (it does, by default).
# For production, delete docker-compose.override.yml.
# The dev overlay replaces (not extends) the frontend `ports:` list from this
# file using the `!override` merge tag, so Docker Compose >= 2.24.4 is required
# (compose-go PR #552, first shipped in Compose v2.24.4). Older Compose — and
# any legacy v1 `docker-compose` — fails to parse the overlay; invoke such tools
# with an explicit `-f docker-compose.yml` so this file is used on its own.
#
# SECURITY NOTES:
# • NEVER commit .env with real secrets (already in .gitignore)
# • Always use HTTPS reverse proxy in production (nginx, Traefik, etc.)
# • Keep DEBUG=False in production
# • Use strong POSTGRES_PASSWORD (32+ random chars)
# • Restrict network access to ports 5432 (postgres) and 6379 (redis)
#
# SECRET MANAGEMENT (REQ-062):
# All services load configuration from .env via env_file directives.
# Sensitive values: SECRET_KEY, DB_PASSWORD, REDIS_PASSWORD, LLM_API_KEY.
# Environment variables override defaults throughout — zero secrets in compose file.
#
# IMAGE VERSION: both backend and frontend images are released together under
# one REQOGNILOOM_VERSION tag (set in .env to pin/upgrade). Was previously
# hardcoded per service (5x) and drifted out of sync with the actual release —
# one variable is the fix, not just a one-off value correction.
#
# COMPOSE CONVENTIONS used throughout this file:
# • `${VAR:-default}` is standard Compose/shell parameter expansion, not
#   project-specific magic: "use VAR from .env/environment if set, else
#   default". Vars with NO default (e.g. `${DB_PASSWORD}`) are that way on
#   purpose — secrets get no fallback, so a missing value stays visibly
#   empty instead of silently working with a guessable default.
# • Named volumes (bottom of this file) hold PERSISTENT DATA that must
#   survive container rebuilds (`postgres_data`, backups). No repo-file
#   bind-mounts are needed anymore: `postgres`/`postgres-backup` run stock
#   `pgvector/pgvector:pg16` with self-contained `command:` blocks, and the
#   pgvector extension is created by the app's own migration (see the
#   `postgres` service comment below) — a consumer only needs this compose
#   file + `.env`, no repo checkout.
# • `logging: {driver: json-file, options: {max-size, max-file}}` repeats
#   per service because Docker's default json-file driver does NOT rotate
#   logs on its own — an unbounded log file can fill the host disk. This
#   caps each container at 3 × 10MB. Pure hygiene, not a functional setting.

x-honcho-env: &honcho-env
  DB_CONNECTION_URI: postgresql+psycopg://honcho:${HONCHO_DB_PASSWORD:-honcho-dev-password}@honcho-postgres:5432/honcho
  REDIS_URL: redis://honcho-redis:6379
  # Dev-only. Flip to true + set an API key before using this beyond a
  # single-developer local stack (see HONCHO_API_KEY in .env.example).
  AUTH_USE_AUTH: "false"
  SENTRY_ENABLED: "false"
  # Pin Honcho's own reasoning LLM for EVERY engine module that calls one
  # (deriver, peer card, summary, dream, dialectic — all server-side; see
  # memory/honcho_backend.py's module docstring and .env.example's
  # "Pinning Honcho's own reasoning LLM" section for why this can't be
  # done from the client SDK) to this project's own opencode_go provider,
  # reusing the SAME key already configured for ReqogniLoom's own
  # LLM_PROVIDER=opencode_go -- one opencode_go account covers both.
  # `mimo-v2.5` is the verified model id on the `/zen/go/v1` endpoint
  # (NOT `mimo-v2.5-free`, which only exists on the non-Go `/zen/v1`
  # endpoint). Comment this whole block out to let Honcho fall back to
  # its own default model config instead.
  #
  # WHY EVERY ACTIVE MODULE MUST BE PINNED: Honcho's built-in defaults for
  # these modules are `transport=openai, model=gpt-5.4-mini`
  # (ConfiguredModelSettings), but the ONLY key in this container is
  # LLM_OPENAI_API_KEY, and it holds an opencode_go key — not a real
  # OpenAI key. A module whose model config is left untouched therefore
  # falls back to a model+endpoint it cannot authenticate against and
  # fails server-side; the memory READ path keeps working, so the failure
  # is invisible from ReqogniLoom's UI (RFC #1002 finding F6). DERIVER,
  # DIALECTIC, SUMMARY and DREAM model configs are all pinned below for
  # exactly that reason.
  LLM_OPENAI_API_KEY: ${LLM_API_KEY}
  # #1050/#1051: the Zen-Go endpoint requires an `x-opencode-session` header on
  # every request and answers `400 MissingSessionID` without it. This is the ONE
  # variable that carries it — the same value the app itself sends (see the
  # `backend`/`celery` services), so there is a single place to change it.
  #
  # WHY THE NINE `…__EXTRA_HEADERS__x-opencode-session` VARIABLES FROM #1051 ARE
  # NOT IN THIS FILE, DESPITE THAT ISSUE LISTING THEM AS THE FIX: DOCKER
  # SILENTLY DROPS ANY ENVIRONMENT VARIABLE WHOSE NAME CONTAINS A DASH. Verified
  # here on ghcr.io/plastic-labs/honcho:latest with the exact variable names from
  # the issue, by all four delivery mechanisms, and counting what actually
  # arrived in the container:
  #
  #   docker run -e "FOO__x-opencode-session=v"   -> dropped
  #   docker run --env-file (dashed name)         -> dropped
  #   compose environment:  (dashed key)          -> shown by `config`, DROPPED
  #                                                 at container create
  #   compose env_file:     (dashed name)         -> dropped
  #   /bin/sh: export "A-B=1"                     -> "bad variable name"
  #
  # So writing those nine keys into `environment:` would have produced a compose
  # file that LOOKS correct (`docker compose config` even prints them) while
  # every Honcho LLM call still died with 400 — the exact silent-dead-config
  # class #1051 is about. `LLM_OPENCODE_SESSION` is set here instead, and the
  # `honcho`/`honcho-deriver` entrypoints below materialise the nine dashed
  # names at container start with Python's os.environ, which does accept them
  # (verified: all nine land in ModelConfig.overrides.provider_params and
  # survive resolve_model_config — the SDK kwarg `extra_headers`).
  #
  # Left empty: no header is set at all, so a deployment on a real OpenAI key
  # sends nothing rather than an empty header.
  #
  # UPSTREAM LIMITATION (cannot be fixed here): Honcho's own default headers are
  # hardcoded in src/llm/registry.py as `_DEFAULT_HEADERS_BY_BASE_URL`, whose
  # only entry is `https://openrouter.ai` (HTTP-Referer / X-Openrouter-Title).
  # There is no env var for it; `extra_headers` is the only supported route, and
  # per-request `extra_headers` wins on key collision with those defaults.
  LLM_OPENCODE_SESSION: ${LLM_OPENCODE_SESSION:-}
  # Upstream, DERIVER_ENABLED / PEER_CARD_ENABLED / SUMMARY_ENABLED /
  # DREAM_ENABLED all default to `true`. They are set explicitly anyway so
  # an operator can SEE which engine modules are active without reading
  # Honcho's source, and can flip any one off. Quoted like AUTH_USE_AUTH /
  # SENTRY_ENABLED above.
  DERIVER_ENABLED: "true"
  PEER_CARD_ENABLED: "true"
  DERIVER_MODEL_CONFIG__TRANSPORT: openai
  DERIVER_MODEL_CONFIG__MODEL: mimo-v2.5
  DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: https://opencode.ai/zen/go/v1
  DIALECTIC_LEVELS__low__MODEL_CONFIG__TRANSPORT: openai
  DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL: mimo-v2.5
  DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL: https://opencode.ai/zen/go/v1
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__TRANSPORT: openai
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL: mimo-v2.5
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL: https://opencode.ai/zen/go/v1
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__TRANSPORT: openai
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL: mimo-v2.5
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__OVERRIDES__BASE_URL: https://opencode.ai/zen/go/v1
  DIALECTIC_LEVELS__high__MODEL_CONFIG__TRANSPORT: openai
  DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL: mimo-v2.5
  DIALECTIC_LEVELS__high__MODEL_CONFIG__OVERRIDES__BASE_URL: https://opencode.ai/zen/go/v1
  DIALECTIC_LEVELS__max__MODEL_CONFIG__TRANSPORT: openai
  DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL: mimo-v2.5
  DIALECTIC_LEVELS__max__MODEL_CONFIG__OVERRIDES__BASE_URL: https://opencode.ai/zen/go/v1
  # SUMMARY (periodic short/long conversation summaries) and DREAM (the
  # offline deduction/induction peer-representation job) are the
  # #1002/F6 gap: the deriver/dialectic block above does NOT cover them,
  # so before this they silently fell back to the built-in
  # `transport=openai, model=gpt-5.4-mini` default — see the
  # "WHY EVERY ACTIVE MODULE MUST BE PINNED" note above. Both are pinned
  # to opencode_go exactly like DERIVER/DIALECTIC.
  SUMMARY_ENABLED: "true"
  SUMMARY_MODEL_CONFIG__TRANSPORT: openai
  SUMMARY_MODEL_CONFIG__MODEL: mimo-v2.5
  SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: https://opencode.ai/zen/go/v1
  DREAM_ENABLED: "true"
  DREAM_DEDUCTION_MODEL_CONFIG__TRANSPORT: openai
  DREAM_DEDUCTION_MODEL_CONFIG__MODEL: mimo-v2.5
  DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: https://opencode.ai/zen/go/v1
  DREAM_INDUCTION_MODEL_CONFIG__TRANSPORT: openai
  DREAM_INDUCTION_MODEL_CONFIG__MODEL: mimo-v2.5
  DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: https://opencode.ai/zen/go/v1
  # REQUIRED for any write (peer.conclusions.create/...) to succeed --
  # verified live: without this, Honcho's embedding client defaults to
  # real OpenAI and fails with `AuthenticationError: Incorrect API key`
  # the moment it tries to reuse LLM_OPENAI_API_KEY (an opencode_go key,
  # not an OpenAI one) for embeddings. opencode_go itself serves no
  # embedding models (see .env.example), so this can't reuse the same
  # provider as DERIVER/DIALECTIC above. Pick ONE:
  #
  #   (a) A real OpenAI key, if you have one -- set in .env:
  #         LLM_OPENAI_API_KEY=<a REAL OpenAI key -- separate from the
  #           opencode_go one above; Honcho does not distinguish the two
  #           by provider, only by this one env var>
  #         HONCHO_EMBEDDING_MODEL=text-embedding-3-small
  #         HONCHO_EMBEDDING_VECTOR_DIMENSIONS=1536   # OpenAI width
  #         HONCHO_EMBEDDING_BASE_URL=https://api.openai.com/v1
  #
  #   (b) A self-hosted Ollama with an embedding model (mirrors this
  #       project's OWN optional Ollama pattern in
  #       docker-compose.override.example.yml -- add that `ollama`
  #       service to this stack too, `docker exec ... ollama pull
  #       nomic-embed-text`, then set in .env):
  #         HONCHO_EMBEDDING_TRANSPORT=openai
  #         HONCHO_EMBEDDING_MODEL=nomic-embed-text
  #         HONCHO_EMBEDDING_VECTOR_DIMENSIONS=768   # see pitfall below
  #         HONCHO_EMBEDDING_BASE_URL=http://ollama:11434/v1
  #
  # Parameterized with defaults that mirror option (b): a host-run Ollama
  # serving nomic-embed-text, reached as host.docker.internal (extra_hosts
  # below makes that name resolve on Linux too; built-in on Docker Desktop).
  # Override the HONCHO_EMBEDDING_* vars in .env to point elsewhere -- e.g.
  # option (a)'s OpenAI, or an in-stack `ollama` service at
  # http://ollama:11434/v1 (see .env.example's Honcho section). A memory
  # WRITE still needs a reachable embedding endpoint; reads do not. The
  # `memory_backend` row of GET /api/v1/admin/health/ reports down when the
  # embedding endpoint is unreachable or unconfigured (#911).
  EMBEDDING_VECTOR_DIMENSIONS: ${HONCHO_EMBEDDING_VECTOR_DIMENSIONS:-768}
  EMBEDDING_MODEL_CONFIG__TRANSPORT: ${HONCHO_EMBEDDING_TRANSPORT:-openai}
  EMBEDDING_MODEL_CONFIG__MODEL: ${HONCHO_EMBEDDING_MODEL:-nomic-embed-text}
  EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
  # PITFALL, verified live against a real ollama.nomic-embed-text setup:
  # the pgvector column's dimension is baked into the schema at MIGRATE
  # time from `EMBEDDING_VECTOR_DIMENSIONS` (Honcho's own default 1536,
  # i.e. OpenAI's dimension) -- setting the var on the SERVER but migrating
  # (or having already migrated) with the default still crashes it at boot
  # with `documents.embedding dim (1536) does not match
  # EMBEDDING_VECTOR_DIMENSIONS (768)`. Any non-1536-dim model (which
  # nomic-embed-text is) needs `EMBEDDING_VECTOR_DIMENSIONS` set on BOTH
  # `honcho-migrate` above AND here BEFORE the very first migration runs
  # against a fresh `honcho_postgres_data` volume.
  #
  # This is no longer a "drop the volume and start over" situation:
  # `honcho-migrate` now runs Honcho's own supported
  # `scripts/configure_embeddings.py --yes` right after `alembic upgrade
  # head` (verified against ghcr.io/plastic-labs/honcho:latest), which
  # ALTERs an already-migrated schema to `EMBEDDING_VECTOR_DIMENSIONS`.
  # A later width change is therefore re-applied on the next
  # `honcho-migrate` run -- but pgvector cannot cast between widths, so
  # vectors already stored at the old width are DISCARDED by that ALTER
  # and must be regenerated. text-embedding-3-small in option (a)
  # sidesteps the whole topic (1536-dim, matches the untouched default).

services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL — ARCH-L1-010 PersistenceLayer
  # ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    deploy:
      resources:
        limits:
          memory: 384M
        # L2: Reserve soft memory hint for pgvector/HNSW indexing.
        # Memory reservation is a soft Compose/Swarm scheduling hint:
        # under host memory pressure, containers exceeding their reservation
        # may be evicted. This is NOT a hard limit — it does NOT prevent
        # an OOM-kill when the hard limit is breached. Reservation here gives
        # the scheduler guidance to co-locate services less aggressively
        # when host memory is tight, reducing contention on HNSW operations.
        reservations:
          memory: 256M
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-reqogniloom}
      POSTGRES_USER: ${DB_USER:-reqogniloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # NOTE: If you change DB_PASSWORD after initial setup, the existing postgres volume
      # will retain the old password. Remove the postgres_data volume or re-initialize:
      #   docker-compose down -v  # WARNING: deletes all postgres data
      #   docker-compose up -d
      - postgres_data:/var/lib/postgresql/data
      # No custom initdb script needed: `migrate` (below) always connects as
      # this cluster superuser (DB_USER, not the least-privilege DB_APP_USER —
      # REQ-L2-PL-010) and persistence/migrations/0024_requirement_embedding.py
      # already runs `CREATE EXTENSION IF NOT EXISTS vector` directly against
      # ${DB_NAME} on first migrate. Verified empirically (2026-09-01): a
      # superuser connection can create the extension on a freshly created
      # database with no template1 pre-seeding — the old
      # docker-entrypoint-initdb.d hook (pre-seeding template1 for pytest's
      # ephemeral test_* databases) was redundant, since
      # testing/docker-compose.test.yml's backend-test also always connects as
      # the superuser. Retrofitting an EXISTING volume created before migration
      # 0024 ran: ./scripts/enable_pgvector.sh.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reqogniloom}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # PostgreSQL Backup — REQ-102 (INF-21) backup strategy
  # ─────────────────────────────────────────────────────────
  # Sidecar that dumps the database on a fixed interval (BACKUP_INTERVAL
  # seconds, default 6h): a timestamped, gzip-compressed pg_dump into the
  # postgres_backup_data volume, pruning all but the newest BACKUP_RETENTION
  # (default 7) dumps. Restore with:
  #   gunzip -c reqogniloom_<ts>.sql.gz | psql -h postgres -U $DB_USER -d $DB_NAME
  # The dump/prune logic is inlined into `command:` below (previously a
  # bind-mounted backend/scripts/backup_postgres.sh) so this service needs no
  # repo file beyond this compose YAML — `$$` below is the required Compose
  # escape for a literal `$` the container's shell should expand, not Compose
  # itself at file-parse time. Shell self-check for this block:
  # deploy/verify-backup-command.sh (#1074).
  #
  # #1074 — a backup must never be able to REPORT success while being broken.
  # Three defects combined into one silent data-loss class; all three are fixed
  # here, and the post-deploy gate lives in docs/DEPLOY_RUNBOOK.md:
  #
  # 1. `pg_dump … | gzip > "$outfile"` reported SUCCESS for a failed dump. In a
  #    POSIX shell a pipeline's exit status is that of the LAST command, and
  #    `gzip` exits 0 even when `pg_dump` wrote nothing. `pipefail` does not
  #    exist in dash/sh, and this is exactly the "empty file, green deploy"
  #    the QA found: 389 bytes gzipped, 0 `COPY` blocks. Fix: `pg_dump` now
  #    writes a plain .sql file with `--file=` (no pipeline at all, so its own
  #    exit status is the status that is checked) and the dump is verified
  #    BEFORE it is published: gzip integrity (`gzip -t`) plus a CONTENT gate —
  #    a real dump of a migrated ReqogniLoom database always contains at least
  #    one `COPY <table> (… ) FROM stdin;` block, while a truncated/failed
  #    dump contains none. A size threshold alone is deliberately NOT used: a
  #    389-byte file and a 30 MB file are both "big enough" for any fixed
  #    floor, only the COPY count distinguishes them. `set -o pipefail` is kept
  #    under bash as a second line of defence, not as the primary check.
  # 2. The first dump fired in the same second the container started — on a
  #    just-migrated, still-empty database — and the next one was a full
  #    BACKUP_INTERVAL away. Fix, two independent layers: this service now
  #    `depends_on: migrate: service_completed_successfully`, so it cannot
  #    start before the schema exists at all, AND the first iteration is
  #    preceded by BACKUP_INITIAL_DELAY (default 300s) so a deploy window's
  #    first dump is never the empty one. Both are configurable, neither is a
  #    magic constant.
  # 3. A failed backup was a single "[backup] run failed" line in a log nobody
  #    reads, and the broken 389-byte file was LEFT IN PLACE, looking exactly
  #    like a good backup. Fix: a failed dump is deleted (the empty-file
  #    semantics are retired), logged on stderr with a FAILED prefix, recorded
  #    in the marker file /backups/.last_backup_status that the runbook gate
  #    reads, and after BACKUP_MAX_CONSECUTIVE_FAILURES the process exits
  #    non-zero — visible as a restarting container in `docker ps` instead of
  #    silent rot. BACKUP_ONCE=true runs exactly one dump and exits with the
  #    dump's own status; that is the operator-facing one-shot the runbook gate
  #    calls, so the gate gets a real non-zero exit code.
  postgres-backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-reqogniloom}
      POSTGRES_USER: ${DB_USER:-reqogniloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      # Set explicitly in .env (see .env.example) — do NOT rely on the Compose
      # default: 86400 meant "the first, and possibly only, backup of a fresh
      # deployment is 24h away from the deploy" (#1074).
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-21600}
      # Delay before the FIRST dump of a container start, in seconds. 0 disables.
      BACKUP_INITIAL_DELAY: ${BACKUP_INITIAL_DELAY:-300}
      # A dump must contain at least this many `COPY ` blocks to count as a
      # backup. 1 is the correct floor for any migrated ReqogniLoom database.
      BACKUP_MIN_COPY_BLOCKS: ${BACKUP_MIN_COPY_BLOCKS:-1}
      # Consecutive failures tolerated before the process exits non-zero.
      BACKUP_MAX_CONSECUTIVE_FAILURES: ${BACKUP_MAX_CONSECUTIVE_FAILURES:-3}
      # true = one dump, then exit with its status (the runbook gate).
      BACKUP_ONCE: ${BACKUP_ONCE:-false}
      # Off-host export (ADR-012, DATA-02). Dormant by default; the opt-in
      # overlay deploy/docker-compose.offhost.yml mounts a host/remote
      # filesystem at /offhost and flips ENABLED to true. Container path is
      # fixed; the host path lives only in the overlay.
      BACKUP_OFFHOST_ENABLED: ${BACKUP_OFFHOST_ENABLED:-false}
      BACKUP_OFFHOST_DIR: /offhost
    volumes:
      - postgres_backup_data:/backups
    # bash, not sh: the exit-code check needs `set -o pipefail`, which dash/
    # sh do not implement. Verified present in pgvector/pgvector:pg16.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -o pipefail

        BACKUP_DIR="$${BACKUP_DIR:-/backups}"
        BACKUP_INTERVAL="$${BACKUP_INTERVAL:-21600}"
        BACKUP_INITIAL_DELAY="$${BACKUP_INITIAL_DELAY:-300}"
        BACKUP_MIN_COPY_BLOCKS="$${BACKUP_MIN_COPY_BLOCKS:-1}"
        BACKUP_MAX_CONSECUTIVE_FAILURES="$${BACKUP_MAX_CONSECUTIVE_FAILURES:-3}"
        BACKUP_RETENTION="$${BACKUP_RETENTION:-7}"
        BACKUP_ONCE="$${BACKUP_ONCE:-false}"
        BACKUP_OFFHOST_ENABLED="$${BACKUP_OFFHOST_ENABLED:-false}"
        BACKUP_OFFHOST_DIR="$${BACKUP_OFFHOST_DIR:-/offhost}"
        # Dot-prefixed so the retention glob (reqogniloom_*.sql.gz) never
        # matches it. Written on EVERY attempt, success or failure: this is the
        # file docs/DEPLOY_RUNBOOK.md reads to decide whether the last backup
        # is trustworthy.
        STATUS_FILE="$${BACKUP_DIR}/.last_backup_status"

        export PGPASSWORD="$${POSTGRES_PASSWORD}"

        record_status() {
          printf '%s status=%s copy_blocks=%s file=%s\n' \
            "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$1" "$${2:-0}" "$${3:-none}" > "$${STATUS_FILE}";
        }

        # 0 = a verified, restorable backup exists. Non-zero = NO backup file is
        # left behind and the caller must treat this as a failed backup.
        run_once() {
          local timestamp outfile dumpfile copies
          timestamp=$$(date +%Y%m%d_%H%M%S)
          outfile="$${BACKUP_DIR}/reqogniloom_$${timestamp}.sql.gz"
          dumpfile="$${BACKUP_DIR}/reqogniloom_$${timestamp}.sql"

          echo "[backup] dumping $${POSTGRES_DB} from $${POSTGRES_HOST} to $${outfile}"

          # --file=, not a pipe: pg_dump's own exit status is then the status
          # this branch tests. With `| gzip` only gzip's status was visible
          # and it is 0 for an empty input — the #1074 root cause.
          if ! pg_dump --host="$${POSTGRES_HOST}" --username="$${POSTGRES_USER}" \
              --dbname="$${POSTGRES_DB}" --no-owner --no-privileges --file="$${dumpfile}"; then
            echo "[backup] FAILED: pg_dump exited non-zero — no backup file kept" >&2
            rm -f "$${dumpfile}" "$${outfile}"
            record_status failed 0 none
            return 1
          fi

          # CONTENT gate (#1074). pg_dump's plain-text format emits one
          # `COPY <table> (<cols>) FROM stdin;` header per table, whether or
          # not the table has rows, so a migrated database always has >= 1.
          # A dump that failed part-way (or ran against a database pg_dump
          # cannot read) has 0 — exactly the shape the QA measured.
          copies=$$(grep -c '^COPY ' "$${dumpfile}" || true)
          if [ "$${copies:-0}" -lt "$${BACKUP_MIN_COPY_BLOCKS}" ]; then
            echo "[backup] FAILED: dump has $${copies:-0} 'COPY ' block(s), need >= $${BACKUP_MIN_COPY_BLOCKS} — treating as an empty dump, no backup file kept" >&2
            echo "[backup] FAILED: first 5 lines of the rejected dump follow" >&2
            head -5 "$${dumpfile}" >&2 || true
            rm -f "$${dumpfile}" "$${outfile}"
            record_status failed "$${copies:-0}" none
            return 1
          fi

          if ! gzip -9 -c "$${dumpfile}" > "$${outfile}"; then
            echo "[backup] FAILED: gzip could not compress the dump — no backup file kept" >&2
            rm -f "$${dumpfile}" "$${outfile}"
            record_status failed "$${copies}" none
            return 1
          fi
          rm -f "$${dumpfile}"

          # Restore-verification gate, step 1 of 2: the published file must be
          # a readable gzip stream. (Step 2 — that the COMPRESSED file still
          # contains COPY blocks — is the operator gate in
          # docs/DEPLOY_RUNBOOK.md, because only it proves the bytes on the
          # volume are restorable.)
          if ! gzip -t "$${outfile}" 2>/dev/null; then
            echo "[backup] FAILED: $${outfile} is not a valid gzip stream — no backup file kept" >&2
            rm -f "$${outfile}"
            record_status failed "$${copies}" none
            return 1
          fi

          # Off-host export (ADR-012, DATA-02), opt-in via the offhost overlay.
          # The local dump is already verified and is deliberately NOT deleted
          # if this fails — the data is safe on-host. The failure is still
          # reported non-zero (and in the marker file), so an absent off-host
          # copy is never silent.
          if [ "$${BACKUP_OFFHOST_ENABLED}" = "true" ]; then
            if [ ! -d "$${BACKUP_OFFHOST_DIR}" ]; then
              echo "[backup] FAILED: BACKUP_OFFHOST_ENABLED=true but $${BACKUP_OFFHOST_DIR} is not mounted — local dump kept" >&2
              record_status offhost_failed "$${copies}" "$${outfile}"
              return 1
            fi
            if ! cp "$${outfile}" "$${BACKUP_OFFHOST_DIR}/"; then
              echo "[backup] FAILED: could not copy $${outfile} to off-host $${BACKUP_OFFHOST_DIR} — local dump kept" >&2
              record_status offhost_failed "$${copies}" "$${outfile}"
              return 1
            fi
            echo "[backup] exported $$(basename "$${outfile}") to off-host $${BACKUP_OFFHOST_DIR}"
          fi

          echo "[backup] wrote $$(du -h "$${outfile}" | cut -f1) to $${outfile} ($${copies} COPY blocks verified)"
          record_status ok "$${copies}" "$${outfile}"
          return 0
        }

        prune_old() {
          ls -1t "$${BACKUP_DIR}"/reqogniloom_*.sql.gz 2>/dev/null \
            | tail -n "+$$(( BACKUP_RETENTION + 1 ))" \
            | while read -r old; do echo "[backup] pruning old backup $${old}"; rm -f "$${old}"; done
        }

        if [ "$${BACKUP_ONCE}" = "true" ]; then
          # Operator-triggered one-shot: the exit code IS the backup status, so
          # the deploy gate can fail on it. No initial delay — the caller asked
          # for a dump now.
          if run_once; then exit 0; else exit 1; fi
        fi

        if [ "$${BACKUP_INITIAL_DELAY}" -gt 0 ]; then
          echo "[backup] waiting $${BACKUP_INITIAL_DELAY}s before the first dump so it cannot land on a freshly migrated, still-empty database (#1074)"
          sleep "$${BACKUP_INITIAL_DELAY}"
        fi

        failures=0
        while true; do
          if run_once; then
            prune_old
            failures=0
          else
            failures=$$(( failures + 1 ))
            echo "[backup] FAILED: $${failures} consecutive failure(s); last status in $${STATUS_FILE}" >&2
            if [ "$${failures}" -ge "$${BACKUP_MAX_CONSECUTIVE_FAILURES}" ]; then
              echo "[backup] FATAL: $${failures} consecutive failures — exiting non-zero instead of looping silently (restart policy will retry, `docker ps` will show the loop)" >&2
              exit 1
            fi
          fi
          sleep "$${BACKUP_INTERVAL}"
        done
    depends_on:
      postgres:
        condition: service_healthy
      # #1074: no dump before the schema exists. Without this the very first
      # dump of a fresh deployment ran against a just-migrated empty database.
      migrate:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────
  # Redis — ARCH-L1-016 ResilienceOrchestrator (Celery broker)
  # ─────────────────────────────────────────────────────────
  # P0 Fix (SYSTEMAUDIT_2026-08-27): Changed maxmemory-policy from volatile-lru
  # to noeviction to prevent silent loss of broker messages when Redis is full.
  # Volatile-lru would evict queue messages (no TTL), causing tasks to disappear
  # without error. Noeviction fails loudly on OOM, and cgroup limit is doubled
  # (256mb→512M) to give AOF-rewrite headroom and prevent OOM-crash during rewrites.
  redis:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    # AOF persistence is on (`--appendonly yes` below), which only means
    # anything if /data outlives the container: without this named volume the
    # appendonly file sits in the container layer and every
    # `up --force-recreate` / image upgrade silently drops the queue and cache.
    volumes:
      - redis_data:/data
    # SA-51: Export REDIS_PASSWORD as REDISCLI_AUTH for healthcheck.
    # This allows redis-cli to authenticate without exposing the password in
    # the process command line (which would be visible in `ps` output).
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    # Compose `command:` is a fixed list — it can't branch on whether
    # REDIS_PASSWORD is set. This shell wrapper is what makes the password
    # OPTIONAL (dev: none, prod: set it) from ONE file: `--requirepass ""`
    # (an empty string, not omitted) is not reliably "no password" across
    # Redis versions, so the empty case skips the flag entirely instead of
    # passing it empty.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "${REDIS_PASSWORD}" ]; then
          exec redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
        else
          exec redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
        fi
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # M6: SA-51 + verify redis-cli actually succeeds.
      # redis-cli ping outputs "PONG" on success, or "AUTH <error>" on auth failure
      # (both with exit code 0). Grep for PONG to fail the healthcheck on auth errors.
      # REDISCLI_AUTH env var (set above) prevents password leaking in `ps` output.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # Django Backend — All backend ARCH-L1 systems
  # ─────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/popoboxxo/reqogniloom-backend:${REQOGNILOOM_VERSION:-1.8.0-beta.17}
    deploy:
      resources:
        limits:
          memory: 512M
    # SA-49: Grace period for Gunicorn to finish in-flight requests before SIGKILL.
    # Gunicorn's --graceful-timeout (default 30s) waits for workers to finish;
    # this stop timeout must be >= graceful-timeout to allow full termination.
    stop_grace_period: 45s
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_NAME: ${DB_NAME:-reqogniloom}
      # Least-privilege app role (persistence/migrations/0048_app_role.py), not
      # the superuser — RLS tenant-isolation must actually apply to backend traffic.
      DB_USER: ${DB_APP_USER:-reqogniloom_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      # LLM Provider — ARCH-L1-009 LlmAdapter (ADR-02)
      # Set LLM_PROVIDER=anthropic|openai|ollama to enable AI features.
      # Graceful degradation if not set (REQ-L1-032).
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_LONG_RUNNING_TIMEOUT: ${LLM_LONG_RUNNING_TIMEOUT:-180}
      # #1050: REQUIRED for LLM_PROVIDER=opencode_go, and NOT optional. The
      # Zen-Go endpoint rejects every call without it
      # (`400 MissingSessionID: Request is missing x-opencode-session and
      # cannot be routed efficiently`), which makes EVERY AI feature fail
      # (validate_artifact, decompose_requirement, check_consistency,
      # derive_requirements, interviews, ai_review) while the log — not the
      # UI — is the only place it shows. Must be a STABLE per-deployment
      # session id: reuse the same value for every call so the endpoint can
      # route/cache the conversation; never rotate it per request.
      # `llm-preflight` below turns a missing value into a FAILED DEPLOY
      # instead of a silently dead LLM.
      LLM_OPENCODE_SESSION: ${LLM_OPENCODE_SESSION:-}
      # ID of the base tenant/workspace the `migrate` self-init provisions on
      # an empty DB (single-tenant default; real multi-tenant setups assign
      # per-request via auth, this is only the bootstrap fallback).
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-1}
      # Raw Honcho embedding vars read by the memory backend's health probe
      # (#911); only used when MEMORY_BACKEND=honcho. `honcho`/`honcho-migrate`
      # above consume the same values in EMBEDDING_MODEL_CONFIG__* form.
      HONCHO_EMBEDDING_BASE_URL: ${HONCHO_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      HONCHO_EMBEDDING_MODEL: ${HONCHO_EMBEDDING_MODEL:-nomic-embed-text}
    # Makes host.docker.internal resolve on Linux (built-in on Docker Desktop)
    # for the health probe's default base URL.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # REQ-L1-046: persist admin_ops DR backups (written to /app/backups) on a
      # named volume so they survive restarts/rebuilds and are writable by the
      # non-root app user (the image seeds ownership; see backend/Dockerfile).
      - backend_dr_backups:/app/backups
    # BACKEND_PORT overridable per .env — the 2026-08-31 production incident that
    # triggered this whole compose rework (docs/UMSETZUNGSPLAN_DOCKER-COMPOSE-2026-08-31.md)
    # was exactly this: two instances (QS/PROD) sharing a hardcoded host port.
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # #1050: a provider/session mismatch must fail the DEPLOY, not the first
      # user request. See the `llm-preflight` service below.
      llm-preflight:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────────────────
  # LLM Preflight — one-shot config gate (#1050)
  # ─────────────────────────────────────────────────────────
  # LLM_PROVIDER=opencode_go WITHOUT LLM_OPENCODE_SESSION is a deployment that
  # comes up green and is completely dead: every AI feature returns
  # `400 MissingSessionID` ("Request is missing x-opencode-session and cannot be
  # routed efficiently"), while `/health` stays 200 and the UI looks healthy.
  # The provider's own docstring calls the variable "optional" and
  # .env.example did not carry it, so the combination was one unset variable
  # away and produced nothing but a log line.
  #
  # This one-shot service closes that hole without touching application code:
  # it checks the two variables from the ENVIRONMENT ALONE (no database, no
  # network, no LLM call — it is a config assertion, not a smoke test) and
  # exits non-zero when the combination is unusable. backend/celery/
  # celery-beat declare
  # `depends_on: {llm-preflight, condition: service_completed_successfully}`,
  # so `up -d` refuses to start them and the operator gets a failed container
  # with an actionable message instead of a silently broken deployment.
  #
  # The check is deliberately CONDITIONAL: a deployment on mock/anthropic/
  # openai/ollama/azure needs no session id and must not be blocked by this
  # gate. Only the opencode_go combination is fatal.
  llm-preflight:
    image: ghcr.io/popoboxxo/reqogniloom-backend:${REQOGNILOOM_VERSION:-1.8.0-beta.17}
    # Same image tag as backend/celery, but it never pulls anything extra and
    # runs no Django code — only /bin/sh. Tiny limit because it is a shell.
    deploy:
      resources:
        limits:
          memory: 64M
    env_file: .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_OPENCODE_SESSION: ${LLM_OPENCODE_SESSION:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        provider="$${LLM_PROVIDER:-mock}"
        session="$${LLM_OPENCODE_SESSION:-}"
        if [ "$${provider}" = "opencode_go" ]; then
          if [ -z "$${session}" ]; then
            echo "[llm-preflight] FAILED: LLM_PROVIDER=opencode_go requires LLM_OPENCODE_SESSION (#1050)." >&2
            echo "[llm-preflight] FAILED: the Zen-Go endpoint answers every call with '400 MissingSessionID'" >&2
            echo "[llm-preflight] FAILED: when the header is absent, which kills every AI feature." >&2
            echo "[llm-preflight] ACTION: set LLM_OPENCODE_SESSION in .env to a STABLE per-deployment id" >&2
            echo "[llm-preflight] ACTION: (e.g. LLM_OPENCODE_SESSION=reqogniloom-<instance>), then re-run 'up -d'." >&2
            echo "[llm-preflight] ACTION: it is NOT read live - 'restart' will not pick it up, only 'up -d'." >&2
            exit 1
          fi
          # The placeholder from .env.example is non-empty, so a copy-paste
          # deployment would pass the check above and then ship the SAME session
          # id as every other installation that never edited the line. That is
          # exactly the "looks configured, is wrong" failure this gate exists to
          # stop, so an unedited placeholder is rejected too. Case-insensitive
          # via `tr`, so CHANGE-ME / Change-Me / change-me are all caught.
          lowered=$$(printf '%s' "$${session}" | tr '[:upper:]' '[:lower:]')
          case "$${lowered}" in
            *change-me*|*change_me*|*changeme*)
              echo "[llm-preflight] FAILED: LLM_OPENCODE_SESSION is still the .env.example placeholder" >&2
              echo "[llm-preflight] FAILED: ('$${session}'). That value is shared by every installation" >&2
              echo "[llm-preflight] FAILED: that copied the example file unchanged." >&2
              echo "[llm-preflight] ACTION: replace it with a stable id unique to this deployment," >&2
              echo "[llm-preflight] ACTION: e.g. LLM_OPENCODE_SESSION=reqogniloom-<host>, then re-run 'up -d'." >&2
              exit 1
              ;;
          esac
          echo "[llm-preflight] OK: LLM_PROVIDER=opencode_go with LLM_OPENCODE_SESSION=$${session}"
        else
          echo "[llm-preflight] OK: LLM_PROVIDER=$${provider} needs no session id (gate not applicable)"
        fi
    # One-shot by contract: `service_completed_successfully` is only valid for
    # a service that is not restarted.
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────
  # Database Migration + Self-Init Service (REQ-188)
  # ─────────────────────────────────────────────────────────
  # Runs migrations before the backend serves traffic. The application layer
  # self-initialises a fresh deployment via a post_migrate receiver
  # (application.self_init, REQ-188): on an empty database this migrate run
  # provisions the base tenant, workspace, admin user/role AND the default
  # workflow/permission definitions — replacing both the former dedicated
  # `bootstrap` service and the manual `provision_workflow_definitions` command.
  # Single one-shot process → the self-init fires exactly once, no cross-worker
  # race (backend/celery never migrate). Idempotent and create-only on the admin
  # password: an admin who changed their password via UI/API is never reset;
  # SYSTEM_ADMIN_PASSWORD is required only when the admin does not exist yet
  # (mirrors createsuperuser --noinput). See backend/application/self_init.py.
  migrate:
    image: ghcr.io/popoboxxo/reqogniloom-backend:${REQOGNILOOM_VERSION:-1.8.0-beta.17}
    deploy:
      resources:
        limits:
          memory: 512M
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-reqogniloom}
      DB_USER: ${DB_USER:-reqogniloom}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      # M1: Remove statement_timeout for migrations to allow unbounded index builds.
      # Index creation (fulltext_indexes, pgvector HNSW) on large production
      # databases may exceed the default 30s limit and must not be interrupted.
      # Development/staging defaults to 30s; only migrations bypass it.
      DB_STATEMENT_TIMEOUT_MS: "0"
      # Read by persistence/migrations/0048_app_role.py to (re-)create the
      # least-privilege runtime role that backend/celery/celery-beat use.
      DB_APP_USER: ${DB_APP_USER:-reqogniloom_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Admin account provisioned by the post_migrate self-init on first start.
      # Username/email have safe defaults; SYSTEM_ADMIN_PASSWORD is required only
      # when the admin does not exist yet (mirrors createsuperuser --noinput).
      SYSTEM_ADMIN_USERNAME: ${SYSTEM_ADMIN_USERNAME:-admin}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:-admin@demo.local}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: python manage.py migrate

  # ─────────────────────────────────────────────────────────
  # Celery Worker — ARCH-L1-016 ResilienceOrchestrator
  # Handles async tasks: LLM calls, Webhooks, GitHub integration
  # ─────────────────────────────────────────────────────────
  celery:
    image: ghcr.io/popoboxxo/reqogniloom-backend:${REQOGNILOOM_VERSION:-1.8.0-beta.17}
    deploy:
      resources:
        limits:
          memory: 384M
    # SA-49: Grace period for Celery to finish in-flight tasks.
    stop_grace_period: 60s
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-reqogniloom}
      # Least-privilege app role (persistence/migrations/0048_app_role.py), not
      # the superuser — RLS tenant-isolation must actually apply to task traffic.
      DB_USER: ${DB_APP_USER:-reqogniloom_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_LONG_RUNNING_TIMEOUT: ${LLM_LONG_RUNNING_TIMEOUT:-180}
      # #1050: see the `backend` service — REQUIRED for LLM_PROVIDER=opencode_go.
      LLM_OPENCODE_SESSION: ${LLM_OPENCODE_SESSION:-}
      # Raw Honcho embedding vars read by the memory backend's health probe
      # (#911); only used when MEMORY_BACKEND=honcho. `honcho`/`honcho-migrate`
      # above consume the same values in EMBEDDING_MODEL_CONFIG__* form.
      HONCHO_EMBEDDING_BASE_URL: ${HONCHO_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      HONCHO_EMBEDDING_MODEL: ${HONCHO_EMBEDDING_MODEL:-nomic-embed-text}
    # Makes host.docker.internal resolve on Linux (built-in on Docker Desktop)
    # for the health probe's default base URL.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "celery -A reqogniloom inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # #1050: same gate as `backend` — see the `llm-preflight` service.
      llm-preflight:
        condition: service_completed_successfully
    # TODO(ARCH-L1-016): Replace app name once Celery is configured in reqogniloom project
    # REQ-077: single worker consumes all queues, including `memory` (AI-memory
    # consolidation, ai-memory-and-search plan). Split into dedicated workers
    # (e.g. a high-concurrency -Q llm worker, or an isolated -Q memory worker so
    # consolidation cannot starve time-critical LLM calls under shared
    # --concurrency) when workloads need to scale apart -- see report for why
    # this v1 shares one worker/pool across queues instead.
    #
    # --concurrency is pinned instead of left at Celery's default (INFRA-03):
    # the default is `os.cpu_count()`, so the number of prefork children — and
    # with it the worker's total RSS — scales with the host, while the memory
    # limit above stays fixed. A host with enough cores therefore exceeds the
    # limit at boot and the worker is OOM-killed before it consumes a single
    # task. Pinning the pool size decouples the two.
    #
    # Measured on this 4-core host via `docker exec <celery> ps -o pid,rss,args -e`
    # plus `docker stats`, on two live 4-child workers running this very command:
    # 14-44 MiB RSS per child (parent 19-38 MiB), 46 MiB and 132 MiB cgroup total
    # respectively — the spread between two identically configured workers is
    # workload history, not configuration. 384M therefore holds 4 children with
    # room to spare. The per-child figures are what to multiply when raising
    # CELERY_CONCURRENCY; raise the memory limit with it, never alone.
    #
    # Keep this on a single line — in a folded block (`>`) a continuation line
    # that is indented deeper keeps its newline, and the flag would end up as a
    # separate shell command instead of a celery argument.
    command: >
      sh -c "celery -A reqogniloom worker --loglevel=info -Q default,llm,events,memory --concurrency=${CELERY_CONCURRENCY:-4}"

  # ─────────────────────────────────────────────────────────
  # Celery Beat Scheduler — Periodic Tasks (REQ-030)
  # ─────────────────────────────────────────────────────────
  celery-beat:
    image: ghcr.io/popoboxxo/reqogniloom-backend:${REQOGNILOOM_VERSION:-1.8.0-beta.17}
    deploy:
      resources:
        limits:
          memory: 256M
    # SA-49: Grace period for Celery Beat to shut down gracefully.
    stop_grace_period: 30s
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-reqogniloom}
      # Least-privilege app role (persistence/migrations/0048_app_role.py), not
      # the superuser — RLS tenant-isolation must actually apply to task traffic.
      DB_USER: ${DB_APP_USER:-reqogniloom_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_LONG_RUNNING_TIMEOUT: ${LLM_LONG_RUNNING_TIMEOUT:-180}
      # #1050: see the `backend` service — REQUIRED for LLM_PROVIDER=opencode_go.
      LLM_OPENCODE_SESSION: ${LLM_OPENCODE_SESSION:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # celery-beat has no worker to `inspect ping`, so this checks the beat
      # process itself is still running (#171 — makes a restart-loop like
      # "module reqogniloom was not found" visible via `docker ps`/health status
      # instead of failing silently).
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # #1050: same gate as `backend` — see the `llm-preflight` service.
      llm-preflight:
        condition: service_completed_successfully
    command: >
      sh -c "celery -A reqogniloom beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"

  # ─────────────────────────────────────────────────────────
  # React Frontend — ARCH-L1-001 ReactFrontend
  # ─────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/popoboxxo/reqogniloom-frontend:${REQOGNILOOM_VERSION:-1.8.0-beta.17}
    deploy:
      resources:
        limits:
          memory: 128M
    # SA-48: Run as non-root user (nginx-unprivileged or app-specific user).
    # The frontend image is built to run as non-root (UID 101 nginx user).
    # Removed the `user: root` override that bypassed security hardening.
    # /var/cache/nginx is provided by the image as app-owned — no tmpfs mount needed.
    restart: unless-stopped
    # Production mapping: host 5173 → nginx 8080 inside the prod image.
    # Any overlay that republishes this service MUST use `ports: !override` —
    # Compose appends port lists across files instead of replacing them. See the
    # INFRA-01 note in docker-compose.override.yml for the full mechanism.
    # FRONTEND_PORT overridable per .env — same port-collision-across-instances
    # rationale as BACKEND_PORT above.
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      backend:
        condition: service_healthy

  # ═════════════════════════════════════════════════════════
  # OPTIONAL: Honcho memory backend (MEMORY_BACKEND=honcho)
  # profiles: [honcho] — costs nothing (no pull, no start) unless you run
  # `docker compose --profile honcho up -d`. Kept in this file (not a
  # separate overlay) so there is exactly one full-stack file to read.
  #
  # Then point ReqogniLoom's backend/celery at it (add to .env, not committed):
  #   MEMORY_BACKEND=honcho
  #   HONCHO_BASE_URL=http://honcho:8000
  #
  # Verified end-to-end against a fresh volume (2026-08-27): postgres+redis
  # come up healthy, `honcho-migrate` applies Honcho's own alembic migrations
  # automatically (a fresh DB needs this -- the server itself refuses to boot
  # without it), `honcho` then starts and GET /health returns {"status":"ok"}.
  # A real memory WRITE additionally needs EMBEDDING_MODEL_CONFIG__* configured
  # below (opencode_go serves no embeddings) -- reads/health do not.
  #
  # Image: ghcr.io/plastic-labs/honcho (official, published by the
  # plastic-labs/honcho project — verified to exist and be ~190MB via its GHCR
  # manifest; the project's own repo has no docker-compose.yml referencing this
  # image, only a local `build:`-from-source dev compose, but its CI publish
  # pipeline does produce and push this tag). Pinned to `latest` deliberately,
  # not a specific vX.Y.Z tag: the honcho-ai 2.3.0 Python SDK this project's
  # memory/honcho_backend.py was verified against targets server API routes
  # (`/v3/workspaces/.../conclusions`) that postdate the newest vX.Y.Z tag
  # visible on GHCR at verification time (v2.0.3) — only `latest`/`staging`
  # are confirmed to carry that surface. Re-pin to an explicit tag once a v3.x
  # release tag exists on GHCR and has been smoke tested against this backend.
  # ═════════════════════════════════════════════════════════
  honcho-postgres:
    image: pgvector/pgvector:pg16
    profiles: ["honcho"]
    environment:
      POSTGRES_USER: honcho
      POSTGRES_PASSWORD: ${HONCHO_DB_PASSWORD:-honcho-dev-password}
      POSTGRES_DB: honcho
    volumes:
      - honcho_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honcho -d honcho"]
      interval: 5s
      timeout: 5s
      retries: 10

  honcho-redis:
    image: redis:7-alpine
    profiles: ["honcho"]
    volumes:
      - honcho_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies Honcho's own alembic migrations before the server
  # starts. Without this, a fresh honcho-postgres volume makes `honcho`
  # crash-loop on boot with `StartupValidationError: Required vector columns
  # missing ... Run alembic upgrade head first.` (verified against a real
  # fresh volume). Mirrors this project's own `migrate` service pattern.
  honcho-migrate:
    image: ghcr.io/plastic-labs/honcho:latest
    profiles: ["honcho"]
    depends_on:
      honcho-postgres:
        condition: service_healthy
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://honcho:${HONCHO_DB_PASSWORD:-honcho-dev-password}@honcho-postgres:5432/honcho
      # Embedding config is parameterized (HONCHO_EMBEDDING_*, see .env.example)
      # and MUST resolve to the SAME values here and on `honcho` BEFORE the first
      # migration against a fresh volume -- see the PITFALL note on the `honcho`
      # service's EMBEDDING_MODEL_CONFIG block. The default base URL points at a
      # host-run Ollama via host.docker.internal (extra_hosts below makes that
      # name resolve on Linux too; it is built-in on Docker Desktop).
      EMBEDDING_VECTOR_DIMENSIONS: ${HONCHO_EMBEDDING_VECTOR_DIMENSIONS:-768}
      EMBEDDING_MODEL_CONFIG__TRANSPORT: ${HONCHO_EMBEDDING_TRANSPORT:-openai}
      EMBEDDING_MODEL_CONFIG__MODEL: ${HONCHO_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # `alembic upgrade head` alone is NOT enough: Honcho's migrations create the
    # pgvector columns at the image's baked-in default width (1536), while the
    # embedding model configured above may emit a different one (the default
    # here is ollama/nomic-embed-text -> 768). Honcho's own bootstrap sequence
    # (script docstring) is:
    #   1. alembic upgrade head
    #   2. python scripts/configure_embeddings.py   <- ALTERs the columns
    #   3. start the API/deriver                    <- refuses to start on mismatch
    # Without step 2 the columns stay vector(1536) and every memory write with a
    # 768-dim vector is rejected server-side (issue #1018).
    #
    # `--yes` is mandatory here, NOT cosmetic: with no mode flag the script
    # prompts via `input()` for confirmation, and this is a one-shot container
    # with no stdin (`--dry-run` / `--yes` / `--report` are a mutually exclusive
    # group). Verified against ghcr.io/plastic-labs/honcho:latest:
    #   - WORKDIR /app, `python` on PATH (/app/.venv/bin/python)
    #   - scripts/configure_embeddings.py present
    #   - `python scripts/configure_embeddings.py --help` -> [--dry-run | --yes | --report]
    # A match is a no-op here: the script only ALTERs when the schema dim
    # differs from EMBEDDING_VECTOR_DIMENSIONS.
    command: sh -c "alembic upgrade head && python scripts/configure_embeddings.py --yes"

  # ---------------------------------------------------------------------
  # Shared Honcho engine environment (#1051, #1052)
  # ---------------------------------------------------------------------
  # Both Honcho processes read the SAME environment, defined once here as a
  # YAML anchor and referenced by the `honcho` API service and the
  # `honcho-deriver` queue worker below:
  #
  #   honcho:        environment: *honcho-env
  #   honcho-deriver: environment: *honcho-env
  #
  # That duplication used to be a real risk, because the two halves have to
  # agree: a model pin or a session header that exists on only one of them
  # is a silent half-configuration (the API answers reads while the worker
  # dies on every write). One definition, two consumers — there is no second
  # place to forget.
  #
  # It is a top-level `x-` extension field, which the Compose spec ignores
  # as configuration and which exists purely to be aliased. NOTE the content
  # is indented to 2 spaces here, one level less than a service-level
  # `environment:` block, purely because it is no longer nested in a service.
  honcho:
    image: ghcr.io/plastic-labs/honcho:latest
    profiles: ["honcho"]
    depends_on:
      honcho-postgres:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
      honcho-migrate:
        condition: service_completed_successfully
    # Bound to localhost only (mirrors the upstream project's own compose
    # template) -- this is a second, independent memory service with its
    # own auth story; do not expose it beyond the host without first
    # setting AUTH_USE_AUTH=true and a real API key below.
    ports:
      - "127.0.0.1:8010:8000"
    # The whole engine configuration (LLM pins, session headers, embedding
    # config) is the shared `x-honcho-env` anchor defined above; the deriver
    # service below references the exact same mapping.
    environment: *honcho-env
    # WHY AN ENTRYPOINT WRAPPER (#1051): the `x-opencode-session` header Honcho
    # needs is only reachable through environment variables whose names contain
    # a dash, and Docker drops every one of them (all four delivery mechanisms
    # tested — see the long note on LLM_OPENCODE_SESSION in `x-honcho-env`
    # above). The image's own entrypoint therefore has to be preceded by a step
    # that writes those nine names itself. Python's `os.environ` accepts them
    # (the shell's `export` does not: "bad variable name").
    #
    # THE `os.execv` IS INSIDE THE SAME PYTHON PROCESS AND THAT IS LOAD-BEARING:
    # writing the names in one process and exec'ing the app from a SHELL
    # afterwards silently loses all nine of them, because a finished Python
    # process leaves nothing behind in the environment the shell then inherits.
    # (That variant was tested and reported "derived 9 module(s)" while the
    # application saw zero — the log line lies, which is precisely the failure
    # mode this whole change exists to remove.) `exec python -` + `os.execv`
    # means one process throughout: the exported names, the log line, and the
    # unchanged image entrypoint, with the same PID and signal handling.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec /app/.venv/bin/python - <<'PY'
        import os

        # Derive Honcho's per-module `x-opencode-session` header env vars from
        # the one deployment-wide value. Keep in sync with the identical block in
        # the `honcho-deriver` service below.
        SUFFIX = "MODEL_CONFIG__OVERRIDES__PROVIDER_PARAMS__EXTRA_HEADERS__x-opencode-session"
        session = (os.environ.get("LLM_OPENCODE_SESSION") or "").strip()
        if session:
            modules = [
                "DERIVER_",
                "SUMMARY_",
                "DREAM_INDUCTION_",
                "DREAM_DEDUCTION_",
            ] + [
                "DIALECTIC_LEVELS__{}__".format(level)
                for level in ("minimal", "low", "medium", "high", "max")
            ]
            for module in modules:
                os.environ[module + SUFFIX] = session
            print(
                "[honcho] derived x-opencode-session for {} engine module(s) "
                "from LLM_OPENCODE_SESSION".format(len(modules)),
                flush=True,
            )
        else:
            print(
                "[honcho] LLM_OPENCODE_SESSION is empty — no x-opencode-session "
                "header will be sent. This is correct for a real OpenAI key and "
                "means EVERY server-side LLM call fails with 400 "
                "MissingSessionID when the pins above point at the Zen-Go "
                "endpoint (#1050/#1051).",
                flush=True,
            )
        # Hand over to the image's own entrypoint (migrations, then
        # `fastapi run src/main.py`) in THIS process, so the names above are
        # still set when Honcho reads its settings.
        os.execv("/app/docker/entrypoint.sh", ["/app/docker/entrypoint.sh"])
        PY
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────────────────
  # Honcho Deriver / queue worker — #1052
  # ─────────────────────────────────────────────────────────
  # CHOSEN OPTION: (a) run the upstream deriver, not (b) run without the
  # derived memory layers. Option (b) was only ever the fallback for "the
  # upstream worker command cannot be justified" — it is not justified away
  # here, because the command is verifiable from the image itself:
  #
  #   * src/deriver/__main__.py exists and is a real `__main__` guard:
  #       setup_logging(); asyncio.set_event_loop_policy(uvloop...);
  #       asyncio.run(run_deriver())   ->  the process IS `python -m src.deriver`
  #   * Honcho's own docker/entrypoint.sh only starts the API server
  #     (`fastapi run … src/main.py`) and never this module — which is exactly
  #     why the queue stayed at `processed = false` forever.
  #   * src/config.py: `DeriverSettings.SCHEDULER: Literal["api","deriver"] =
  #     "deriver"` — the DEFAULT is the separate process, so the API service
  #     above is not supposed to drain the queue. (Setting it to "api" only
  #     moves the *reconciler* scheduler in-process, it does NOT replace the
  #     deriver's queue manager.)
  #   * src/deriver/queue_manager.py imports DreamScheduler, so this one
  #     process covers the deriver, the summary job and the dream job.
  #   * `import src.deriver.__main__` was executed successfully inside
  #     ghcr.io/plastic-labs/honcho:latest, so the command is not invented.
  #
  # WHY IT MATTERS: without this service the `queue` table keeps unprocessed
  # `representation` work units forever and no `document_sources` rows are ever
  # written, so the derived memory layers (peer representation, peer card,
  # summary, dream) never materialise — while the model pins in `x-honcho-env`
  # sit there looking configured. Reads stay green, so from the UI the failure
  # is invisible. Option (b) would have been that silent dead config.
  #
  # NO HOST PORT: the deriver is a worker, not a service to reach. It opens a
  # Prometheus exporter on :9090 only when `METRICS_ENABLED` is set; leave it
  # off (the default) and nothing listens.
  honcho-deriver:
    image: ghcr.io/plastic-labs/honcho:latest
    profiles: ["honcho"]
    restart: unless-stopped
    depends_on:
      honcho-postgres:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
      honcho-migrate:
        condition: service_completed_successfully
    # Exactly the same environment as the `honcho` API — see `x-honcho-env` at
    # the top of this file. A pin or session header that exists on only one of
    # the two processes is a silent half-configuration, so there is one
    # definition and two consumers.
    environment: *honcho-env
    # `-m src.deriver` needs the package on the path, and the image's WORKDIR
    # is /app; pinned explicitly so the command does not depend on it.
    working_dir: /app
    # Same session-header shim as the `honcho` service (see its comment for why
    # Docker cannot carry the dashed variable names itself), but exec'ing the
    # deriver process instead of the image's API entrypoint. The `os.execv` must
    # stay inside this Python process — see the `honcho` service for why.
    # Keep the Python block identical to the one above.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec /app/.venv/bin/python - <<'PY'
        import os

        # Derive Honcho's per-module `x-opencode-session` header env vars from
        # the one deployment-wide value. Keep in sync with the identical block in
        # the `honcho` service above.
        SUFFIX = "MODEL_CONFIG__OVERRIDES__PROVIDER_PARAMS__EXTRA_HEADERS__x-opencode-session"
        session = (os.environ.get("LLM_OPENCODE_SESSION") or "").strip()
        if session:
            modules = [
                "DERIVER_",
                "SUMMARY_",
                "DREAM_INDUCTION_",
                "DREAM_DEDUCTION_",
            ] + [
                "DIALECTIC_LEVELS__{}__".format(level)
                for level in ("minimal", "low", "medium", "high", "max")
            ]
            for module in modules:
                os.environ[module + SUFFIX] = session
            print(
                "[honcho-deriver] derived x-opencode-session for {} engine "
                "module(s) from LLM_OPENCODE_SESSION".format(len(modules)),
                flush=True,
            )
        else:
            print(
                "[honcho-deriver] LLM_OPENCODE_SESSION is empty — no "
                "x-opencode-session header will be sent (#1050/#1051).",
                flush=True,
            )
        os.execv(
            "/app/.venv/bin/python",
            ["/app/.venv/bin/python", "-m", "src.deriver"],
        )
        PY
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Same rationale as the `celery-beat` healthcheck: this image ships no
    # `ps`/`pgrep`, so the check reads PID 1's own cmdline through /proc. Its
    # purpose is to make a crashed deriver visible in `docker ps` instead of
    # failing silently. The worker itself is PID 1 because the shim `exec`s it.
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'src.deriver' /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═════════════════════════════════════════════════════════
  # OPTIONAL: bluepencil review-notes sidecar (docs/bluepencil-integration.md, PR #972)
  # profiles: [bluepencil] — costs nothing (no pull, no start) unless you run
  # `make bluepencil` or `COMPOSE_PROFILES=bluepencil docker compose ... up -d`.
  #
  # DEBUG/QS ONLY — NOT A PRODUCTION STORE. This profile is a *debugging* aid
  # for the in-app annotation layer (see/measure it in the real app), not a
  # product feature; a future production path would use a DRF review_notes app.
  # The sidecar has NO user auth and NO tenant isolation: one JSON file holds the
  # review notes of EVERY workspace, with no RLS/TenantContext scoping. A
  # production store must enforce JWT/RBAC, CSRF, and tenant isolation server-side.
  # Do not treat this profile as a pilot; it is a way to see and measure the layer
  # in the real app. See docs/bluepencil-integration.md and deploy/bluepencil/README.md.
  #
  # Image: node:22-slim (the vendored server.js imports ONLY Node builtins, no
  # npm deps, so no build step and no package install are needed). The frontend
  # reaches it over the compose network as `bluepencil:8787` — no host port is
  # published, mirroring this file's convention that internal-only services stay
  # internal.
  # ═════════════════════════════════════════════════════════
  bluepencil:
    image: node:22-slim
    profiles: ["bluepencil"]
    restart: unless-stopped
    command: node /opt/bluepencil/server.js --store /data/notes.json --port 8787 --host 0.0.0.0 --base /bluepencil/api --environment ${BLUEPENCIL_ENVIRONMENT:-dev}
    volumes:
      # Read-only: the vendored sidecar binary is immutable from the container's
      # point of view. Relative path is repo-root-relative because every
      # invocation pins `--project-directory .` (see repo-root Makefile and
      # deploy/README.md), exactly like the override's `./backend:/app`.
      - ./deploy/bluepencil/server.js:/opt/bluepencil/server.js:ro
      # The single shared JSON store; survives container restarts/rebuilds.
      - bluepencil_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # node:22-slim has no curl/wget, so probe with the runtime itself — fetch is
    # built into Node 22. The URL carries the configured --base prefix.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/bluepencil/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:            # Queue + cache persistence (/data) — AOF is on, so it must survive recreate
  postgres_backup_data:  # REQ-102: retained pg_dump backups
  backend_dr_backups:    # REQ-L1-046: admin_ops DR backup JSON files (/app/backups)
  honcho_postgres_data:  # profile: honcho
  honcho_redis_data:     # profile: honcho
  bluepencil_data:       # profile: bluepencil (shared review-notes JSON store)
