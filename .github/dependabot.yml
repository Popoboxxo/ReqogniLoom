version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"

  # Docker manifests live in four places, and Dependabot scans exactly one
  # directory per `docker` entry — a single "/" entry matched nothing, so
  # neither tag bumps nor digest refreshes were ever proposed.
  #   /backend   -> Dockerfile (python:3.12-slim, builder + runtime)
  #   /frontend  -> Dockerfile (node:22.17.0-slim, nginx:1.27-alpine)
  #   /deploy    -> docker-compose*.yml (pgvector/pgvector, redis, node sidecar)
  #   /testing   -> docker-compose.test.yml (pgvector/pgvector, redis)
  # `/testing` is listed because the test stack is a standalone Compose project
  # (#1387) that pins the same multi-arch manifest lists as `/deploy`; without
  # an entry here its digests would silently rot relative to the deployed stack.
  # Digests are pinned as `image:TAG@sha256:<manifest-list>`; Dependabot's
  # docker ecosystem refreshes the digest while keeping the human-readable tag.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/testing"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
