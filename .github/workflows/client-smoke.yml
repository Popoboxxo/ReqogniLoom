# DRAFT — Stufe 2: E1–E4/E6 decided; E5 deferred; trigger stays OFF until W-wave
# activation (no publication active).
#
# Real-client smoke matrix against a local Compose instance. The unified smoke
# test is defined in docs/plans/2026-10-04-one-click-client-installation.md §4.3;
# install/verify come from scripts/clients/. The only trigger is
# `workflow_dispatch` — the nightly schedule from plan §5.3 stays off (E5
# deferred).
#
# NOTE (draft): CI provisions the OpenCode clients itself — `opencode-ai@1.18.35`
# (V1) and `@opencode/cli@2.2.5` (V2, bins `opencode` + `opencode2`) via Node 22.
# The other client CLIs (claude/codex/hermes) are still not provisioned by this
# skeleton; a dispatch for them fails cleanly at install.sh's `require_bin`
# guard. Add their per-client provisioning step when the workflow is activated
# (W1–W5).
#
# V2 restart quirk: OpenCode 2 runs a background service. `opencode mcp list`
# can report "No MCP servers configured" until that service has re-read the
# config written by install.sh; use `--standalone` or restart the service
# between install and verify. See docs/clients/opencode-v2-known-issues.md.
#
# NOTE: a cross-workflow `needs: ci` is not possible in GitHub Actions — a job
# may only depend on jobs in the SAME file, and `ci` lives in ci.yml. This
# workflow therefore ASSUMES CI is green (gate it via branch protection and the
# `release` environment before activation).
name: Client smoke (DRAFT)

on:
  workflow_dispatch:

concurrency:
  group: client-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke ${{ matrix.client }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The beta client must not block the release; the V1 legs stay blocking.
    # Flip opencode-v2 to blocking (continue-on-error: false) only after the
    # dispatch has run green at least twice in a row — until then the leg is
    # unproven (draft workflow, no CI run recorded) and the V2 background-
    # service restart quirk below is not yet handled automatically.
    continue-on-error: ${{ matrix.client == 'opencode-v2' }}
    strategy:
      # Each client reports its own result; a red leg must not abort the others.
      fail-fast: false
      matrix:
        client:
          - claude-code
          - codex
          - opencode
          # OpenCode V2 is a beta; this leg runs with continue-on-error on the
          # job so a red V2 leg does not block the release.
          - opencode-v2
          - kimi-code
          - hermes
          # ANTIGRAVITY IS DELIBERATELY EXCLUDED: its binary requires a host CPU
          # with `pclmulqdq` (exit 132 otherwise) and is therefore not
          # reproducible on GitHub-hosted runners — plan §5.3 / Anhang C.
          # Decision E5: self-hosted runner with such a CPU, or documented
          # manual acceptance. Re-add `antigravity` here only if E5 says so.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node (OpenCode CLI runtime)
        if: startsWith(matrix.client, 'opencode')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Provision OpenCode client binary
        if: startsWith(matrix.client, 'opencode')
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          set -euo pipefail
          # Pins mirror the #1702 spike exactly: V1 1.18.35, V2 2.2.5. Both
          # npm packages expose the `opencode` bin; `@opencode/cli` adds
          # `opencode2` (both point at the same binary).
          case "$CLIENT" in
            opencode) npm install --global "opencode-ai@1.18.35" ;;
            opencode-v2) npm install --global "@opencode/cli@2.2.5" ;;
          esac
          opencode --version

      - name: Materialise compose env file
        # deploy/docker-compose.yml declares `env_file: .env`; CI has no .env
        # (gitignored), so materialise it from the tracked example first.
        run: cp .env.example .env

      - name: Start postgres/redis/backend from the real compose files
        run: |
          set -euo pipefail
          docker compose \
            -f deploy/docker-compose.yml \
            -f testing/docker-compose.test.yml \
            up -d postgres redis backend

      - name: Wait for the backend health endpoint (host port 8001)
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS "http://localhost:8001/health/" >/dev/null 2>&1; then
              echo "backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: backend did not become healthy in time" >&2
          docker compose -f deploy/docker-compose.yml logs --tail=100 backend >&2 || true
          exit 1

      - name: Install client against the local instance
        env:
          CLIENT: ${{ matrix.client }}
          # Test key (QA workspace only) — referenced, never a literal. May not
          # exist yet in the draft state; that is intentional.
          REQOGNILOOM_API_KEY: ${{ secrets.QA_CLIENT_KEY }}
        run: |
          set -euo pipefail
          # `bash` prefix keeps this working even if the checkout lost the
          # script's executable bit (#1350); the mode itself is gated in
          # client-artifacts-check.yml.
          bash scripts/clients/install.sh \
            --client "$CLIENT" \
            --url "http://localhost:8001" \
            --key-env REQOGNILOOM_API_KEY \
            --yes

      - name: Verify client connection
        env:
          CLIENT: ${{ matrix.client }}
          REQOGNILOOM_API_KEY: ${{ secrets.QA_CLIENT_KEY }}
        run: |
          set -euo pipefail
          bash scripts/clients/verify.sh --client "$CLIENT"

      - name: Tear down the compose instance
        if: always()
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.yml -f testing/docker-compose.test.yml down -v || true
