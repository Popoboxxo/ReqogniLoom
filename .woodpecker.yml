when:
  - event: push
    branch: main

steps:
  # ─────────────────────────────────────────────────────────
  # Backend Image bauen und pushen
  # ─────────────────────────────────────────────────────────
  build-and-push-backend:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: codeberg.org
      repo: codeberg.org/dduchrow/reqflow-backend
      tags: latest
      platforms: linux/amd64
      dockerfile: backend/Dockerfile
      context: backend
      # Provenance/SBOM-Attestations deaktivieren: sonst pusht Buildx einen
      # OCI-Manifest-Index statt eines einfachen v2-Manifests, den ältere
      # Docker-Engines (z.B. auf Unraid) beim Pull nicht auflösen können
      # ("no matching manifest for linux/amd64 in the manifest list entries").
      provenance: false
      sbom: false
      # Die Logindaten für die Codeberg Container Registry
      username: dduchrow
      # Das Passwort (Token) muss als Secret in Woodpecker hinterlegt werden!
      password:
        from_secret: cb_registry_token

  # ─────────────────────────────────────────────────────────
  # Frontend Image bauen und pushen
  # ─────────────────────────────────────────────────────────
  build-and-push-frontend:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: codeberg.org
      repo: codeberg.org/dduchrow/reqflow-frontend
      tags: latest
      platforms: linux/amd64
      dockerfile: frontend/Dockerfile
      context: frontend
      # Provenance/SBOM-Attestations deaktivieren (siehe Backend-Step oben)
      provenance: false
      sbom: false
      # Für das Frontend benötigen wir Build-Argumente (falls vorhanden)
      # build_args:
      #   - VITE_API_BASE_URL=https://api.deine-domain.de
      username: dduchrow
      password:
        from_secret: cb_registry_token
