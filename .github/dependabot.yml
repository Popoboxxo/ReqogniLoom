version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"

  # Dependabot resolves every entry against the files that ecosystem's fetcher
  # knows, and the two Docker ecosystems are not interchangeable: `docker`
  # scans `Dockerfile` (v1), `docker-compose` scans `docker-compose*.yml` /
  # `compose.yml` (v2, v3). Listing the Compose manifests under `docker` looks
  # for a `Dockerfile` in that directory instead — `deploy/` and `testing/`
  # contain none, so those entries could never match and the Compose digests
  # were never refreshed. The ecosystems are therefore split by file type:
  #   Dockerfile        -> `docker`         : /backend, /frontend
  #   Compose manifests -> `docker-compose` : /deploy, /testing
  # Base images are pinned as `image:TAG@sha256:<manifest-list>`; both
  # ecosystems refresh the digest while keeping the human-readable tag, so the
  # pins cannot silently rot. `/testing` is listed because the test stack is a
  # standalone Compose project (#1387) that pins the same multi-arch manifest
  # lists as `/deploy`; without it those digests would drift from the deployed
  # stack.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker-compose"
    directories:
      - "/deploy"
      - "/testing"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
