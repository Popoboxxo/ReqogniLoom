# docker-compose.override.example.yml
#
# Documentation only -- this file is NOT read by Docker Compose (it must be
# named `docker-compose.override.yml` for that). Copy it and uncomment what
# you need.
#
# Neither service below is required by default -- ReqogniLoom's memory and
# embedding features work fully self-contained without either of these:
#   - Embeddings default to the in-process `sentence-transformers` provider
#     (384 dims, bundled in the backend/celery images, no external service).
#   - Memory defaults to the built-in pgvector-backed MemoryBackend (no
#     external service).
#
# Use this override only if you want to swap in an external Ollama embedding
# service or an external Honcho memory service instead of the defaults.

# services:
#   ollama:
#     image: ollama/ollama:latest
#     ports: ["11434:11434"]
#     volumes: ["ollama_data:/root/.ollama"]
#
#   backend:
#     environment:
#       EMBEDDING_PROVIDER: ollama
#       OLLAMA_BASE_URL: http://ollama:11434
#
#   # Honcho: cannot be added as a plain service block here. Its own
#   # docker-compose.yml.example (github.com/plastic-labs/honcho) `build:`s
#   # from ITS OWN repo checkout, and brings its own postgres+redis -- there
#   # is no published pre-built image to just `image:` reference. Self-hosting
#   # it means running it as a genuinely separate stack, in its own directory,
#   # then pointing this project at it:
#   #
#   #   git clone https://github.com/plastic-labs/honcho.git ../honcho
#   #   cd ../honcho
#   #   cp docker-compose.yml.example docker-compose.yml
#   #   cp .env.template .env   # set DB_CONNECTION_URI + one LLM_*_API_KEY
#   #   docker compose up -d    # binds 127.0.0.1:8000 by default
#   #
#   # Then, back in THIS repo:
#   # backend:
#   #   environment:
#   #     MEMORY_BACKEND: honcho
#   #     HONCHO_BASE_URL: http://host.docker.internal:8000
#   #     HONCHO_API_KEY: ${HONCHO_API_KEY}
#   #
#   # (Or any remote Honcho instance -- HONCHO_BASE_URL just needs to be
#   # reachable from the backend/celery containers.)

# volumes:
#   ollama_data:
