# Prompt-regression scenarios for the `bundle_compression` slot.
# Case files are owned by plan D (backend/application/prompt_testing/cases.py).
slot: bundle_compression
scenarios:
  - name: small-bundle-without-memory
    data:
      bundle_markdown: "## REQ-1\nTitle: Login\nStatus: approved\n"
      memory_context: ""
    assert:
      - {type: contains, value: "REQ-1"}
      - {type: contains, value: "Login"}
      - {type: not-contains, value: "payments are settled in EUR"}
  # Plan A T-A1-1 / ADR-024 AC-1: `bundle_compression` is a HARD_OFF slot, so
  # `resolve_and_render` blanks every memory variable even though this scenario
  # supplies a filled block. The block's text must not reach the prompt, and
  # nothing from the memory builder (`Workspace context:`) may leak in either.
  - name: hard-off-blanks-caller-supplied-memory
    data:
      bundle_markdown: "## REQ-1\nTitle: Login\nStatus: approved\n"
      memory_context: "Workspace context: payments are settled in EUR."
    assert:
      - {type: contains, value: "REQ-1"}
      - {type: contains, value: "Login"}
      - {type: not-contains, value: "Workspace context:"}
      - {type: not-contains, value: "payments are settled in EUR"}
      - {type: not-contains, value: "{memory_context}"}
  # Plan A T-A1-8, Prüfgegenstand (2): the caller omits `memory_context`
  # entirely. Since PR-A10 the slot is HARD_OFF, so the resolver blanks it
  # rather than auto-injecting; either way the rendered prompt must contain no
  # unresolved `{memory_*}` placeholder while the bundle and the slot's memory
  # section still render. Deliberately no assertion about `<memory>` boundaries
  # (PR-A14) -- those do not exist on this branch.
  - name: small-bundle-memory-slot-auto-resolved
    data:
      bundle_markdown: "## REQ-1\nTitle: Login\nStatus: approved\n"
    assert:
      - {type: contains, value: "REQ-1"}
      - {type: contains, value: "Login"}
      - {type: contains, value: "Do NOT include"}
      - {type: not-contains, value: "{memory_context}"}
      - {type: not-regex, value: "\\{memory_[A-Za-z_]*\\}"}
