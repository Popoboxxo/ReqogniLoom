name: CI Pipeline

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        test-set:
          - id: set-1-core
            name: "Core Domain Logic (application, persistence)"
            paths: "application/tests persistence/tests"
          - id: set-2-api
            name: "REST API Layer (rest_api, auth_tenancy, presets, reqogniloom, test_runs)"
            paths: "rest_api/tests auth_tenancy/tests presets/tests reqogniloom/tests test_runs/tests"
          - id: set-3-mcp
            name: "MCP Server (mcp_server)"
            paths: "mcp_server/tests"
          - id: set-4-features
            name: "Cross-Cutting & Features (llm_adapter, diagram, traceability, workflow, se_metrics, baseline, admin_ops, icd, resilience, audit)"
            paths: "llm_adapter/tests diagram/tests traceability/tests workflow/tests se_metrics/tests baseline/tests admin_ops/tests icd/tests resilience/tests audit/tests"

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: reqflow_test
          POSTGRES_USER: reqflow
          POSTGRES_PASSWORD: reqflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest for ${{ matrix.test-set.id }}
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: reqogniloom.settings_test
          SECRET_KEY: ci-test-secret-key
          AUTH_JWT_SECRET: ci-test-auth-jwt-secret
          DEBUG: 'True'
          DB_NAME: reqflow_test
          DB_USER: reqflow
          DB_PASSWORD: reqflow
          # Read by migration 0048_app_role.py to create the least-privilege
          # app role (REQ-L2-PL-010) — required, no default, even though this
          # job connects as the superuser above.
          DB_APP_PASSWORD: ci-test-app-role-password
          DB_HOST: localhost
          DB_PORT: '5432'
          ALLOWED_HOSTS: localhost,127.0.0.1
          DEFAULT_TENANT_ID: '1'
          LLM_PROVIDER: mock
          REDIS_URL: redis://localhost:6379
          # REQ-081 / issue #151: no Fernet key literal in the repository.
          # settings_test.py generates an ephemeral key per process when the
          # variable is unset, which is all the suite needs (encrypted columns
          # are written and read back within the same run). An optional
          # repository secret still wins if one is configured.
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
        run: pytest ${{ matrix.test-set.paths }}

      - name: Security scan - pip-audit (fixes #153)
        if: matrix.test-set.id == 'set-1-core'
        working-directory: backend
        run: |
          pip install pip-audit
          echo "Scanning backend dependencies for known vulnerabilities..."
          pip-audit --desc
        continue-on-error: false

  agent-templates-test:
    name: "Agent Templates & Distribution (docs/agent-templates, dist)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run pytest for docs/agent-templates and dist
        run: pytest docs/agent-templates dist

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run Vitest
        working-directory: frontend
        run: npm run test

      - name: Security scan - npm audit (fixes #153)
        working-directory: frontend
        run: |
          echo "Scanning frontend dependencies for known vulnerabilities..."
          npm audit --audit-level=high
        continue-on-error: false

  hermes-plugin-test:
    name: "Hermes IDE Plugin (integrations/hermes-plugin)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/hermes-plugin/reqogniloom/package-lock.json

      - name: Install hermes-plugin dependencies
        working-directory: integrations/hermes-plugin/reqogniloom
        run: npm ci

      - name: Typecheck
        working-directory: integrations/hermes-plugin/reqogniloom
        run: npx tsc --noEmit

      - name: Run Vitest
        working-directory: integrations/hermes-plugin/reqogniloom
        run: npm run test

      # "npm run build" also runs the verify-build guard as a postbuild step
      # (fixes #545) -- it fails the job if the production bundle inlines
      # React/its JSX runtime instead of keeping it external (the class of
      # bug that silently broke this plugin in the
      # feat/interview-management-hermes-plugin branch, undetected by both
      # tsc --noEmit and vitest since neither exercises the real Vite build).
      - name: Build and verify plugin bundle
        working-directory: integrations/hermes-plugin/reqogniloom
        run: npm run build
