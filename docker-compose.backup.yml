version: '3.8'

# Backup service for postgres_data volume
# Usage: docker compose -f docker-compose.yml -f docker-compose.backup.yml run --rm backup

services:
  backup:
    image: postgres:16
    container_name: reqogniloom_backup
    environment:
      PGPASSWORD: ${DB_PASSWORD:-reqogniloom}
    volumes:
      - ./backups:/backups
    command: >
      sh -c "
        echo 'Starting PostgreSQL backup...' &&
        pg_dump \
          -h postgres \
          -U ${DB_USER:-reqogniloom} \
          -d ${DB_NAME:-reqogniloom} \
          -F custom \
          -f /backups/reqogniloom_$(date +%Y%m%d_%H%M%S).dump &&
        echo 'Backup completed successfully'
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reqogniloom_network
    restart: "no"
