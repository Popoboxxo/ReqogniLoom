# Prompt-regression scenarios for the `goal_aggregate` slot.
# Case files are owned by plan D (backend/application/prompt_testing/cases.py).
slot: goal_aggregate
scenarios:
  - name: two-goals-without-memory
    data:
      goals: "- Ship audit logging\n- Keep tenant data isolated"
      memory_context: ""
    assert:
      - {type: contains, value: "Ship audit logging"}
      - {type: contains, value: "tenant data isolated"}
  - name: two-goals-with-memory
    data:
      goals: "- Ship audit logging\n- Keep tenant data isolated"
      memory_context: "Memory: audit logging is a compliance requirement."
    assert:
      - {type: contains, value: "audit logging is a compliance requirement"}
