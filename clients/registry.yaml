  - id: hermes
    name: Hermes
    tested_version: "current stack"
    target_level: L3
    status: supported
    transport: streamable_http
    url_path: /mcp/
    auth_header: "Authorization: Bearer"
    config_artifact: ""
    skills_dir: "~/.hermes/skills"
    install_de:
      - lang: bash
        text: |
          # Ein Befehl: MCP-Server (remote) + Agent-Skill (-> ~/.hermes/skills/reqogniloom).
          # Der Installer merged mcp_servers.reqogniloom non-interaktiv via
          # `hermes config set` (Env-Referenz statt Key):
          scripts/clients/install.sh --client hermes \
            --url "https://<host>" --key-env REQOGNILOOM_API_KEY
          hermes mcp test reqogniloom         # -> ✓ Connected, 227 Tools
    install_en:
      - lang: bash
        text: |
          # One command: MCP server (remote) + agent skill (-> ~/.hermes/skills/reqogniloom).
          # The installer merges mcp_servers.reqogniloom non-interactively via
          # `hermes config set` (env reference instead of a key):
          scripts/clients/install.sh --client hermes \
            --url "https://<host>" --key-env REQOGNILOOM_API_KEY
          hermes mcp test reqogniloom         # -> ✓ Connected, 227 tools
    fallback_de:
      - lang: yaml
        text: |
          # ~/.hermes/config.yaml  (Windows: %LOCALAPPDATA%\hermes\config.yaml)
          mcp_servers:
            reqogniloom:
              url: "https://<host>/mcp/"
              headers:
                Authorization: "Bearer ${REQOGNILOOM_API_KEY}"
    fallback_en:
      - lang: yaml
        text: |
          # ~/.hermes/config.yaml  (Windows: %LOCALAPPDATA%\hermes\config.yaml)
          mcp_servers:
            reqogniloom:
              url: "https://<host>/mcp/"
              headers:
                Authorization: "Bearer ${REQOGNILOOM_API_KEY}"
    verify:
      command: "hermes mcp test reqogniloom"
      expected_de: "`✓ Connected` (QA: 2232 ms, 227 Tools); echte Calls: `requirement_query` → 49, `architecture_query` → 1."
      expected_en: "`✓ Connected` (QA: 2232 ms, 227 tools); real calls: `requirement_query` → 49, `architecture_query` → 1."
      tool_result: "227 tools; requirement_query = 49"
    prereq_de:
      - "Hermes-Installation (aktueller Stack)."
      - "Key in `~/.hermes/.env` — `${REQOGNILOOM_API_KEY}` wird beim Server-Start interpoliert."
    prereq_en:
      - "Hermes installation (current stack)."
      - "Key in `~/.hermes/.env` — `${REQOGNILOOM_API_KEY}` is interpolated at server start."
    provider_de:
      - "Unabhängig von ReqogniLoom — Hermes nutzt seine eigene LLM-Config."
    provider_en:
      - "Independent of ReqogniLoom — Hermes uses its own LLM config."
    pitfalls_de:
      - "`hermes mcp add` ist discovery-first (fragt den Key am TTY ab, probt den Server) — der Installer nutzt daher `hermes config set` (non-interaktiv, idempotent)."
      - "`hermes config set` schreibt `config.yaml` über PyYAML neu → **Kommentarzeilen gehen verloren**; der Installer legt vorher ein Backup an."
      - "Der Bearer-Token steht nur als `${REQOGNILOOM_API_KEY}`-Referenz in der Config; der Wert liegt in `~/.hermes/.env`."
      - "Ein konsolidierter MCP-First-Pfad: Agent-Plugin `integrations/hermes-agent-plugin/` und Skill `integrations/hermes-skill/reqogniloom/` sprechen denselben `POST /mcp/`-Vertrag; das Agent-Plugin authentifiziert sich mit `X-API-Key` (Bearer-JWT wird serverseitig abgelehnt)."
      - "`Cancel` im Plugin ruft seit #1152 `interview.abandon` auf, damit Sessions nicht als `in_progress` liegen bleiben."
    pitfalls_en:
      - "`hermes mcp add` is discovery-first (prompts for the key on a TTY, probes the server) — the installer uses `hermes config set` instead (non-interactive, idempotent)."
      - "`hermes config set` rewrites `config.yaml` via PyYAML → **comment lines are lost**; the installer takes a backup first."
      - "The bearer token lives only as a `${REQOGNILOOM_API_KEY}` reference in the config; the value stays in `~/.hermes/.env`."
      - "One consolidated MCP-first path: the agent plugin `integrations/hermes-agent-plugin/` and the skill `integrations/hermes-skill/reqogniloom/` speak the same `POST /mcp/` contract; the agent plugin authenticates with `X-API-Key` (a Bearer JWT is rejected server-side)."
      - "The plugin's `Cancel` calls `interview.abandon` as of #1152 so sessions do not linger as `in_progress`."
    roles_de:
      - "Key-Scope steuert die Rechte; read-only für reine Lesezwecke."
    roles_en:
      - "Key scope governs permissions; read-only for pure read use."
    update_de:
      - "Installer erneut ausführen; oder direkt `hermes config set mcp_servers.reqogniloom…`."
      - "Repo-Pull bzw. Store-Update; Stufe-2-Ziel: Katalogeintrag → `hermes mcp install reqogniloom`."
    update_en:
      - "Re-run the installer; or set the values directly via `hermes config set mcp_servers.reqogniloom…`."
      - "Repo pull or store update; Stage-2 goal: catalog entry → `hermes mcp install reqogniloom`."
