# DRAFT — Stufe 2: E1–E4/E6 decided; trigger stays OFF until W-wave activation
# (no publication active).
#
# Mirrors the marketplace/plugin versions from VERSION by regenerating the
# client artifacts and committing the result (or opening a PR). See plan §5.3
# and decision E3 (marketplace lives in this repo). Everything is guarded by
# enable_publish=true, so a plain dispatch changes nothing.
#
# DECISION E4 (decided): curated stores (S3 Anthropic Plugin Directory,
# S6 Hermes catalog) are NOT automated (they have no workflow here) and MUST
# refuse pre-releases. This S2 marketplace-in-repo workflow may carry a
# pre-release, but only with an explicit pre-release label — S1/S2 handle
# pre-releases with a clear label, npm uses `next` (plan §5.2 rule 2). There is
# deliberately no hard beta block here.
#
# NOTE: a cross-workflow `needs: ci` is not possible in GitHub Actions — a job
# may only depend on jobs in the SAME file, and `ci` lives in ci.yml. This
# workflow therefore ASSUMES CI is green (gate it via branch protection and the
# `release` environment before activation).
name: Sync marketplace versions (DRAFT)

on:
  workflow_dispatch:
    inputs:
      enable_publish:
        description: 'Actually commit/push the regenerated marketplace files (default off)'
        required: false
        type: boolean
        default: false

concurrency:
  group: marketplace-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Mirror marketplace/plugin versions from VERSION
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Approval gate before any commit/push.
    environment: release
    permissions:
      contents: write # commit the regenerated marketplace/plugin files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Decision E4: make a pre-release publish explicit, never silent. Curated
      # stores (S3/S6) are not automated; S1/S2 only carry pre-releases with a
      # clear label (plan §5.2 rule 2).
      - name: Detect pre-release (E4)
        id: prerelease
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          if [[ "$VERSION_VALUE" == *-* ]]; then
            RELEASE_KIND="pre-release"
          else
            RELEASE_KIND="stable"
          fi
          echo "release_kind=$RELEASE_KIND" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_VALUE" >> "$GITHUB_OUTPUT"
          echo "PRE-RELEASE LABEL: ${RELEASE_KIND} (VERSION=${VERSION_VALUE})"
          if [[ "$RELEASE_KIND" == "pre-release" ]]; then
            echo "::notice title=Pre-release::VERSION=${VERSION_VALUE} is a pre-release; S2 must carry an explicit pre-release label and curated stores (S3/S6) are NOT published by this workflow."
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install renderer dependency
        run: pip install --disable-pip-version-check pyyaml

      - name: Mirror versions from VERSION (regenerate client artifacts)
        run: python scripts/clients/render.py

      - name: Show resulting diff
        run: git --no-pager diff --stat

      # DRAFT: commit + push only when a human explicitly sets
      # enable_publish=true; a plain dispatch stops after the diff above.
      - name: Commit marketplace/version sync (DRAFT)
        if: inputs.enable_publish
        env:
          RELEASE_KIND: ${{ steps.prerelease.outputs.release_kind }}
        run: |
          set -euo pipefail
          echo "PRE-RELEASE LABEL: ${RELEASE_KIND} (marketplace sync)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "no marketplace changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "chore(marketplace): sync versions from VERSION [skip ci]"
          git push
