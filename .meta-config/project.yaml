systems-engineering:
  enabled: true
project:
  name: ReqFlow
  prefix: rf
  short: reqflow
gitignore:
  local: true
  generated: true
  settings: true
variables:
  PROJECT_NAME: ReqFlow
  PROJECT_DESCRIPTION: AI-natives Requirements-Management-Tool mit Testmanagement-Unterstützung
  PROJECT_GOAL: Anforderungen und Tests in Artefakten verwalten, von einfach bis Systems
    Engineering
  PLATFORM: Django + React + Docker Compose
  RUNTIME: Python 3.x (Django) + Node.js (React)
  PROJECT_LANGUAGES: Python, TypeScript
  LANGUAGE: Python, TypeScript
  COMMUNICATION_LANGUAGE: Deutsch
  USER_INPUT_LANGUAGE: Deutsch
  DOCS_LANGUAGE: Englisch
  INTERNAL_DOCS_LANGUAGE: Deutsch
  CODE_LANGUAGE: Englisch
  GIT_PLATFORM: Codeberg
  GIT_REMOTE_URL: https://codeberg.org/dduchrow/ai-native-reqflow-POC.git
  GIT_MAIN_BRANCH: main
  BUILD_COMMAND: docker-compose build
  TEST_COMMAND: pytest (Backend) + npm test (Frontend)
  DEV_COMMANDS: 'docker-compose build

    docker-compose up

    '
  TEST_COMMANDS: 'docker-compose exec backend pytest

    docker-compose exec frontend npm test

    '
  BUILD_COMMANDS: docker-compose build
  DEV_STACK_START: docker-compose up
  DEV_STACK_RELOAD: docker-compose restart (oder Hot Reload je nach Service)
  PROJECT_CONTEXT: 'ReqFlow ist ein AI-natives Requirements-Management-Tool mit Testmanagement-Unterstützung.
    Tech-Stack: Django (Backend) + React (Frontend) + Docker Compose. Schnittstellen:
    REST API + nativer MCP Server. Fähigkeiten: Einfaches Requirements Management
    bis komplexe Systems-Engineering-Strukturen mit Artefakt-basierter Zerlegung von
    Requirements und Tests.'
  ARCHITECTURE: "backend/\n  manage.py          # Django Entry-Point\n  reqflow/ \
    \          # Django Project\n  requirements_app/  # Requirements Management App\n\
    frontend/\n  src/               # React Source\n  package.json\ndocker-compose.yml\
    \   # Orchestrierung\n"
  PROJECT_STRUCTURE: 'backend/             # Django REST API

    frontend/            # React UI

    docker-compose.yml   # Container Orchestrierung

    '
  ENTRY_POINT_PATTERN: 'backend/manage.py — Django Management

    frontend/src/index.tsx — React Entry-Point

    '
  KEY_PATTERNS: '- Django REST Framework für API-Endpoints

    - MCP Server für AI-Tool-Integration

    - Artefakt-basierte Zerlegung von Requirements

    '
  CODE_CONVENTIONS: '- PEP 8 für Python (Django Backend)

    - TypeScript best practices für React Frontend

    - Django-spezifisch: Models, Views, Serializers Trennung

    - React-spezifisch: Functional Components, Hooks

    '
  EXTRA_DONTS: |
    - NICHT direkt in .claude/agents/ schreiben (generierter Output)
    - NICHT Docker-Services einzeln stoppen wenn andere laufen (Volume-Locks)
    - NICHT frontend-Service neu starten ohne danach E2E-Tests zu prüfen (HMR-Problem auf Windows)
  CODE_QUALITY_RULES: |
    - TypeScript strict mode (tsconfig.json)
    - PEP 8 für Python
    - DRF Serializer-First-Approach (niemals direkte Model-Queries in Views)
    - React: Functional Components + Hooks, kein class-based
    - data-testid auf allen interaktiven UI-Elementen (E2E-Pflicht)
    - CSS Custom Properties aus tokens.css verwenden (keine hardcodierten Farben/Größen)
  REQ_CATEGORIES: |
    - Functional: Features, User Stories
    - Non-Functional: Performance, Sicherheit, Skalierbarkeit
    - API: REST API und MCP Server Schnittstellen
    - UI/UX: Frontend und Benutzerinteraktion
    - Data: Datenmodelle, Artefakte, Zerlegungsstrukturen
    - Integration: Externe Systeme, Import/Export
    - Test: Testmanagement-Anforderungen
  REQ_CATEGORIES_LIST: |
    - **Functional** — Features, User Stories
    - **Non-Functional** — Performance, Sicherheit, Skalierbarkeit
    - **API** — REST API und MCP Server Schnittstellen
    - **UI/UX** — Frontend und Benutzerinteraktion
    - **Data** — Datenmodelle, Artefakte, Zerlegungsstrukturen
    - **Integration** — Externe Systeme, Import/Export
    - **Test** — Testmanagement-Anforderungen
  TESTER_SNIPPETS_PATH: ''
  DEVELOPER_SNIPPETS_PATH: ''
  AGENT_META_REPO: Popoboxxo/agent-meta
  SYSTEM_DEPENDENCIES: |
    - Docker >= 24
    - Docker Compose >= 2.x
    - Node.js >= 18 (nur für E2E-Tests mit Playwright)
    - Python 3.x (im Container)
  SYSTEM_URLS: |
    - Frontend: http://localhost:5173
    - Backend API: http://localhost:8000/api/v1/
    - Admin: http://localhost:8000/admin/
  SERVICE_NAME: reqflow-backend
  CONTAINER_NAME: ai-native-reqflow-poc-backend-1
  PRIMARY_PORT: "8000"
  EXTRA_PORTS: |
    - 5173 (frontend Vite)
    - 5432 (postgres)
    - 6379 (redis)
  BUILD_OUTPUT: "(kein Build-Artifact — Django served via gunicorn, React via Vite Dev Server oder build/)"
  ARTIFACT_ZIP_CMD: ''
  ARTIFACT_TAR_CMD: ''
  GH_ASSETS: ''
  BUILD_SYSTEM_NOTES: |
    docker-compose build erstellt Images für backend und frontend.
    Backend: Dockerfile in backend/ (Python/Django).
    Frontend: Dockerfile in frontend/ (Node/Vite).
    Kein separates Build-Artifact — Deployment via Docker Compose.
  VERSION_DIST_BEHAVIOUR: |
    1. VERSION-Datei erhöhen (noch nicht vorhanden — zu erstellen)
    2. CHANGELOG.md aktualisieren
    3. git tag v<version>
    4. docker-compose build && docker-compose push (optional)
  SE_MIN_DEPTH: 1
  SE_MAX_DEPTH: 4
  SE_MAX_CRITIC_ITERATIONS: 1
  SE_MAX_PARALLEL_CELLS: 3
orchestrator:
  enabled: true
  strict: true
  handoff:
    protocol: a2a-v1
    token-budget: {}
    protocol_routing: dynamic
    validate-before-delegate: true
viz:
  enabled: false
  server: {}
  mcp: {}
  report: {}
admin-ui:
  enabled: true
  auto-sync-on-save: true
rules-preset: ''
speech-mode: short
dod-preset: spec-driven
tier-preset: Cheap
se-focus: true
memory:
  enabled: true
  default_scope: ""
lifecycle-triggers:
  on-merge:
    - agent: code-reviewer
      task: "Post-Merge Blast-Radius-Analyse: Prüfe betroffene Code-Pfade auf Clean-Code-Verletzungen."
  on-release:
    - agent: documenter
      task: "Update CODEBASE_OVERVIEW.md and ARCHITECTURE.md for this release."
hooks:
  lifecycle-check:
    enabled: true
model-overrides:
  Claude:
    se-senior-developer: claude-opus-4-8
    se-developer: claude-sonnet-4-6
  Opencode:
    senior-developer: opencode-go/kimi-k2.7-code
    orchestrator: opencode-go/minimax-m3
    se-junior-developer: opencode-go/minimax-m3
    developer: opencode-go/minimax-m3
    prompt-engineer: opencode-go/minimax-m3
    agent-meta-manager: opencode-go/minimax-m3
