# ReqogniLoom — Production Deployment via GHCR Pre-Built Images
# ADR-08: Self-Hosted via Docker Compose
#
# Unlike the root docker-compose.yml (which builds backend/frontend from
# source — the right choice for development), this file pulls the images
# published by .github/workflows/docker-publish.yml on every `vX.Y.Z` tag:
#   ghcr.io/<owner>/reqogniloom-backend:<tag>
#   ghcr.io/<owner>/reqogniloom-frontend:<tag>
# Celery/celery-beat reuse the backend image with a different `command:` —
# there is no separate Celery image (see docker-publish.yml header).
#
# ┌─ QUICK START ─────────────────────────────────────────────────────┐
# │ 1. cp deployment/.env.example deployment/.env                     │
# │ 2. Fill in all CHANGE-ME values in deployment/.env                │
# │ 3. Set GHCR_OWNER and IMAGE_TAG (see below)                       │
# │ 4. docker compose -f deployment/docker-compose.ghcr.yml           │
# │      --env-file deployment/.env pull                              │
# │ 5. docker compose -f deployment/docker-compose.ghcr.yml           │
# │      --env-file deployment/.env up -d                             │
# └─────────────────────────────────────────────────────────────────┘
#
# IMAGE TAGGING:
#   GHCR_OWNER   — GitHub org/user that owns the images (default: popoboxxo)
#   IMAGE_TAG    — pin a version (e.g. 1.2.0) or track `latest` (default: latest)
# Pin IMAGE_TAG in production; `latest` is convenient for homelab/test use
# but moves underneath you on every release.
#
# GHCR images are public by default for this project; if yours are private,
# authenticate first: docker login ghcr.io -u <github-user>
#
# SECURITY NOTES:
# • NEVER commit deployment/.env with real secrets (already in .gitignore)
# • Always use HTTPS reverse proxy in production (nginx, Traefik, Caddy, ...)
# • Keep DEBUG=False in production
# • Use strong POSTGRES_PASSWORD / SECRET_KEY (32+ random chars)
# • Do not publish ports 5432 (postgres) / 6379 (redis) beyond the docker network

services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL — ARCH-L1-010 PersistenceLayer
  # ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-reqogniloom}
      POSTGRES_USER: ${DB_USER:-reqogniloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reqogniloom}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # PostgreSQL Backup — REQ-102 (INF-21) backup strategy
  # ─────────────────────────────────────────────────────────
  # Requires backend/scripts/backup_postgres.sh from a repo checkout mounted
  # read-only. If you deploy without a repo checkout, drop this service and
  # back up via an external tool instead.
  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-reqogniloom}
      POSTGRES_USER: ${DB_USER:-reqogniloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
    volumes:
      - postgres_backup_data:/backups
      - ${REPO_ROOT:-..}/backend/scripts/backup_postgres.sh:/usr/local/bin/backup_postgres.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /bin/sh /usr/local/bin/backup_postgres.sh || echo "[backup] run failed";
          sleep "${BACKUP_INTERVAL:-86400}";
        done
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────
  # Redis — ARCH-L1-016 ResilienceOrchestrator (Celery broker)
  # ─────────────────────────────────────────────────────────
  # P0 Fix (SYSTEMAUDIT_2026-08-27): Changed maxmemory-policy from volatile-lru
  # to noeviction to prevent silent loss of broker messages when Redis is full.
  # Volatile-lru would evict queue messages (no TTL), causing tasks to disappear
  # without error. Noeviction fails loudly on OOM, and cgroup limit is doubled
  # (256mb→512M) to give AOF-rewrite headroom and prevent OOM-crash during rewrites.
  redis:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "${REDIS_PASSWORD}" ]; then
          exec redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
        else
          exec redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
        fi
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # Database Migration + Self-Init Service (REQ-188)
  # ─────────────────────────────────────────────────────────
  # One-shot: runs migrations, then the application self-initialises a fresh
  # deployment via a post_migrate receiver (application.self_init) — base
  # tenant, workspace, admin user/role, default workflow/permission
  # definitions. Idempotent; create-only on the admin password (an admin who
  # changed their password via UI/API is never reset). No separate
  # "bootstrap" service exists — self-init runs inline here.
  migrate:
    image: ghcr.io/${GHCR_OWNER:-popoboxxo}/reqogniloom-backend:${IMAGE_TAG:-latest}
    restart: "no"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-reqogniloom}
      # Superuser (Postgres bootstrap role) — RLS (REQ-L2-PL-010) does not
      # restrict superusers, so `migrate` uses it to run DDL; runtime traffic
      # below (backend/celery/celery-beat) must NOT use this role.
      DB_USER: ${DB_USER:-reqogniloom}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      # Read by persistence/migrations/0048_app_role.py to (re-)create the
      # least-privilege runtime role that backend/celery/celery-beat use.
      DB_APP_USER: ${DB_APP_USER:-reqogniloom_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SYSTEM_ADMIN_USERNAME: ${SYSTEM_ADMIN_USERNAME:-admin}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:-admin@demo.local}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    command: python manage.py migrate

  # ─────────────────────────────────────────────────────────
  # Django Backend — All backend ARCH-L1 systems
  # ─────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/${GHCR_OWNER:-popoboxxo}/reqogniloom-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_NAME: ${DB_NAME:-reqogniloom}
      # Least-privilege app role (persistence/migrations/0048_app_role.py), not
      # the superuser — RLS tenant-isolation must actually apply to backend traffic.
      DB_USER: ${DB_APP_USER:-reqogniloom_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      # LLM Provider — ARCH-L1-009 LlmAdapter (ADR-02)
      # Set LLM_PROVIDER=anthropic|openai|ollama to enable AI features.
      # Graceful degradation if not set (REQ-L1-032).
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_LONG_RUNNING_TIMEOUT: ${LLM_LONG_RUNNING_TIMEOUT:-180}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-1}
    volumes:
      - backend_dr_backups:/app/backups
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────────────────
  # Celery Worker — ARCH-L1-016 ResilienceOrchestrator
  # ─────────────────────────────────────────────────────────
  celery:
    image: ghcr.io/${GHCR_OWNER:-popoboxxo}/reqogniloom-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-reqogniloom}
      # Least-privilege app role (persistence/migrations/0048_app_role.py), not
      # the superuser — RLS tenant-isolation must actually apply to task traffic.
      DB_USER: ${DB_APP_USER:-reqogniloom_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_LONG_RUNNING_TIMEOUT: ${LLM_LONG_RUNNING_TIMEOUT:-180}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "celery -A reqogniloom inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # REQ-077: single worker consumes all queues. Split into dedicated workers
    # (e.g. a high-concurrency -Q llm worker) when workloads need to scale apart.
    command: >
      sh -c "celery -A reqogniloom worker --loglevel=info -Q default,llm,events,memory"

  # ─────────────────────────────────────────────────────────
  # Celery Beat Scheduler — Periodic Tasks (REQ-030)
  # ─────────────────────────────────────────────────────────
  celery-beat:
    image: ghcr.io/${GHCR_OWNER:-popoboxxo}/reqogniloom-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-reqogniloom}
      # Least-privilege app role (persistence/migrations/0048_app_role.py), not
      # the superuser — RLS tenant-isolation must actually apply to task traffic.
      DB_USER: ${DB_APP_USER:-reqogniloom_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_LONG_RUNNING_TIMEOUT: ${LLM_LONG_RUNNING_TIMEOUT:-180}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: >
      sh -c "celery -A reqogniloom beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"

  # ─────────────────────────────────────────────────────────
  # React Frontend — ARCH-L1-001 ReactFrontend
  # ─────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/${GHCR_OWNER:-popoboxxo}/reqogniloom-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # NOTE: VITE_API_BASE_URL / VITE_ALLOWED_HOSTS are baked into the image at
    # build time (Vite). They cannot be changed at runtime for a pre-built
    # image — if your deployment needs a different API URL, build your own
    # frontend image from source (see the root docker-compose.yml) instead of
    # pulling ghcr.io/.../reqogniloom-frontend.
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_backup_data:  # REQ-102: retained pg_dump backups
  backend_dr_backups:    # REQ-L1-046: admin_ops DR backup JSON files (/app/backups)
