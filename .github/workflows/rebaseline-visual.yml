name: Rebaseline visual snapshots (temporary)

# TEMPORARY workflow — delete together with `.github/rebaseline-trigger`
# once the metrics route baseline has been regenerated on the CI platform.
#
# Why: `e2e/tests/visual-regression.spec.ts-snapshots/route-metrics-chromium-linux.png`
# is platform-specific and Playwright paints `mask` regions INTO the stored
# snapshot. The /metrics baseline has to be produced by the same Linux runner
# that later compares against it (a Windows render is a different image, and a
# missing/foreign mask shows up as a ~40% pixel diff). `workflow_dispatch` is
# unavailable here because this workflow intentionally only exists on the
# feature branch, hence the `push` trigger on a throwaway marker file.

on:
  push:
    branches: [fix/security-bulk-2]
    paths:
      - '.github/rebaseline-trigger'

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: reqflow
          POSTGRES_USER: reqflow
          POSTGRES_PASSWORD: reqflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Generate ephemeral field encryption key
        env:
          FIELD_ENCRYPTION_KEY_SECRET: ${{ secrets.FIELD_ENCRYPTION_KEY }}
        run: |
          KEY="${FIELD_ENCRYPTION_KEY_SECRET:-$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')}"
          echo "::add-mask::$KEY"
          echo "FIELD_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Run Django migrations
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          AUTH_JWT_SECRET: ci-test-auth-jwt-secret
          DJANGO_ENV: test
          DEBUG: 'True'
          DB_NAME: reqflow
          DB_USER: reqflow
          DB_PASSWORD: reqflow
          DB_APP_PASSWORD: ci-test-app-role-password
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_CONN_MAX_AGE: '0'
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          ALLOWED_HOSTS: localhost,127.0.0.1
          DEFAULT_TENANT_ID: '1'
          LLM_PROVIDER: mock
          SYSTEM_ADMIN_PASSWORD: admin12345
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py seed_toothbrush

      - name: Start Django backend
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          AUTH_JWT_SECRET: ci-test-auth-jwt-secret
          DJANGO_ENV: test
          DEBUG: 'True'
          DB_NAME: reqflow
          DB_USER: reqflow
          DB_PASSWORD: reqflow
          DB_APP_PASSWORD: ci-test-app-role-password
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_CONN_MAX_AGE: '0'
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          ALLOWED_HOSTS: localhost,127.0.0.1
          DEFAULT_TENANT_ID: '1'
          LLM_PROVIDER: mock
          SYSTEM_ADMIN_PASSWORD: admin12345
        run: python manage.py runserver 0.0.0.0:8000 &

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Start Vite frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run dev &

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for services
        run: |
          echo "Waiting for backend..."
          timeout 30 bash -c 'until curl -sf http://localhost:8000/api/v1/schema/ > /dev/null; do sleep 2; done'
          echo "Waiting for frontend..."
          timeout 30 bash -c 'until curl -sf http://localhost:5173/ > /dev/null; do sleep 2; done'

      - name: Regenerate metrics route baseline
        working-directory: e2e
        env:
          FRONTEND_URL: http://localhost:5173
          BACKEND_URL: http://localhost:8000
        run: npx playwright test tests/visual-regression.spec.ts --grep 'metrics route' --update-snapshots --reporter=line

      - name: Upload regenerated snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-rebaseline
          path: e2e/tests/visual-regression.spec.ts-snapshots/
          retention-days: 5
