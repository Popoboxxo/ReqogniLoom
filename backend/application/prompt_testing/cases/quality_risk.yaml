# Prompt-regression scenarios for the `quality_risk` slot (Plan B/B5-T2).
# Deliberately memory-free (prompt_slots.MEMORY_HARD_OFF_PREFIXES, ADR-024).
# Case files are owned by plan D (backend/application/prompt_testing/cases.py).
slot: quality_risk
scenarios:
  - name: second-datastore-risk
    data:
      artifact_title: "Zweiter Datastore ueberfordert den Betrieb"
      artifact_description: "Ein zusaetzlicher Datastore erhoeht den Betriebsaufwand."
      artifact_fields_json: '{"probability": "medium", "impact": "high", "category": "operational"}'
    assert:
      - {type: contains, value: "Zweiter Datastore ueberfordert den Betrieb"}
      - {type: contains, value: "score"}
      - {type: contains, value: "mitigation"}
      - {type: not-contains, value: "{memory_context}"}
