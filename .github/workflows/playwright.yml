name: Playwright E2E Tests

on:
  # Same rationale as ci.yml: a feature-branch push with an open PR started a
  # second identical 4-shard matrix (push + pull_request).
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # GH-682: this is a *safety net*, not the test budget. The test budget is
    # `globalTimeout` in e2e/playwright.config.ts (10 min), which lets
    # Playwright stop itself and still write its report. Hitting the job cap
    # instead means GitHub cancels the job, which also skips the
    # `if: always()` report upload below — leaving no evidence of what failed.
    # Setup (~5-8 min) + globalTimeout (10 min) + upload must therefore fit
    # comfortably inside this value. Normal runs finish in 8-12 min.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: reqflow
          POSTGRES_USER: reqflow
          POSTGRES_PASSWORD: reqflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        working-directory: backend
        # uv statt pip: gemessen 448 s -> 168 s kalt (Faktor 2,7) bei identischem
        # Wheel-Satz; --system trifft das setup-python-Interpreter, das die
        # folgenden Schritte benutzen. Version gepinnt, damit der Resolver
        # nicht unbemerkt wechselt.
        run: |
          python -m pip install --quiet --disable-pip-version-check "uv==0.13.1"
          uv pip install --system --quiet -r requirements.txt

      - name: Restore the seeded database snapshot
        # Der E2E-Aufbau (migrate + seed_demo + seed_toothbrush + bootstrap) kostet
        # ~6 min pro Shard und laeuft 4x parallel. Der fertige DB-Zustand ist
        # 1,9 MB gross und in ~2 s wiederherstellbar (gemessen auf der QS-Box:
        # pg_dump < 1 s, pg_restore 2 s bei 1152 Artefakten / 7059 Links).
        # Key haengt an den Migrationen UND an e2e/helpers/auth.ts, weil
        # seed_demo das Admin-Passwort aus SYSTEM_ADMIN_PASSWORD setzt und der
        # Test-Login dagegen pruefen muss.
        id: db-snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/reqflow-snapshot.dump
          key: pg-snapshot-v1-${{ hashFiles('backend/**/migrations/*.py', 'e2e/helpers/auth.ts') }}

      - name: Restore the database from the snapshot
        if: steps.db-snapshot.outputs.cache-hit == 'true'
        # pg_restore laeuft im Service-Container: Client- und Serverversion sind
        # damit garantiert identisch, und es braucht kein apt-get auf dem Runner.
        # --no-owner/--no-privileges, weil pg_dump keine Rollen sichert und die
        # App-Rolle (Migration 0048) im frischen Cluster noch nicht existiert.
        run: |
          set -euo pipefail
          docker exec -i ${{ job.services.postgres.id }} \
            pg_restore -U reqflow -d reqflow --no-owner --no-privileges \
            < "${RUNNER_TEMP}/reqflow-snapshot.dump"
          echo "DB aus Snapshot wiederhergestellt (keine Migrationen, keine Seeds)."

      # Issue #151: no Fernet key literal in the repository. The migrate step
      # and the backend server are separate processes that must share one key
      # (seed_demo encrypts values the server later decrypts), so it is
      # generated once per run here and exported for the remaining steps.
      # An optional repository secret takes precedence if configured.
      - name: Generate ephemeral field encryption key
        env:
          FIELD_ENCRYPTION_KEY_SECRET: ${{ secrets.FIELD_ENCRYPTION_KEY }}
        run: |
          KEY="${FIELD_ENCRYPTION_KEY_SECRET:-$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')}"
          echo "::add-mask::$KEY"
          echo "FIELD_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Run Django migrations
        if: steps.db-snapshot.outputs.cache-hit != 'true'
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          AUTH_JWT_SECRET: ci-test-auth-jwt-secret
          DJANGO_ENV: test
          DEBUG: 'True'
          DB_NAME: reqflow
          DB_USER: reqflow
          DB_PASSWORD: reqflow
          # Read by migration 0048_app_role.py to create the least-privilege
          # app role (REQ-L2-PL-010) — required, no default, even though this
          # job connects as the superuser above.
          DB_APP_PASSWORD: ci-test-app-role-password
          DB_HOST: localhost
          DB_PORT: '5432'
          # settings.py's CONN_MAX_AGE default (60s) is tuned for a fixed
          # worker pool (gunicorn/uwsgi) that reuses threads and therefore
          # reuses their cached connections. `manage.py runserver` below is
          # Django's ThreadingMixIn dev server: it spawns a brand-new thread
          # per request, so a 60s-old "warm" connection is never revisited by
          # its own thread and only gets closed whenever the GC gets to it —
          # not deterministic. Across a shard's ~10min run of real HTTP
          # traffic this leaks connections until Postgres' max_connections is
          # exhausted ("FATAL: sorry, too many clients already"). Forcing 0
          # here makes Django close each connection at the end of every
          # request regardless of which thread holds it.
          DB_CONN_MAX_AGE: '0'
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          ALLOWED_HOSTS: localhost,127.0.0.1
          DEFAULT_TENANT_ID: '1'
          LLM_PROVIDER: mock
          # REQ-188: without this, self-init's post_migrate hook has no admin
          # password to provision with and silently skips — leaving the base
          # workspace without its default workflow definitions (E2E-blocking).
          # Must match e2e/helpers/auth.ts TEST_USER.password — seed_demo
          # reads this same var, so a mismatch breaks every E2E login.
          SYSTEM_ADMIN_PASSWORD: admin12345
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          # Fixture workspace for tests/toothbrush-syseng.spec.ts. The spec used
          # to seed itself via `docker compose exec`, which no CI job can do —
          # there is no compose stack here, only the runserver process below.
          python manage.py seed_toothbrush
          # Issue #947: the tenant's GlobalAttributeDefinition rows. Every
          # artifact editor renders its fields from them; without them the whole
          # editor suite fails with "No global attribute definition for
          # '<ItemType>/<preset>'" instead of its real assertions.
          #
          # Belt-and-braces, not a fix for a broken chain: `migrate` above
          # already reaches this through self_init's post_migrate hook
          # (REQ-188). With SYSTEM_ADMIN_PASSWORD set (see the migrate step) that
          # hook does NOT return early — it provisions the tenant itself via
          # provision_admin() -> _ensure_tenant() and then calls
          # _bootstrap_attribute_definitions() in the same pass, so on this
          # workflow the rows normally exist by the time seed_demo runs.
          #
          # The explicit call covers the one path where the hook IS a no-op: a
          # stack without SYSTEM_ADMIN_PASSWORD (self_init logs "Self-init
          # skipped ..." and returns early), and — silently — the case where the
          # hook's own bootstrap throws: self_init deliberately swallows that
          # exception (it runs inside post_migrate, where raising would abort the
          # whole migrate) and only logs it, so a green migrate does not prove
          # the definitions landed. This command makes the outcome explicit and
          # idempotent (existing rows are left alone).
          python manage.py bootstrap_attribute_definitions

      - name: Dump the seeded database for the snapshot cache
        # Nur Shard 1 schreibt den Cache: bei kaltem Cache bauen alle vier Shards
        # die DB selbst (wie bisher), aber vier gleichzeitige Saves auf denselben
        # Key sind ein Wettlauf, den GitHub nur einmal gewinnen laesst.
        if: steps.db-snapshot.outputs.cache-hit != 'true' && matrix.shard == 1
        run: |
          set -euo pipefail
          docker exec ${{ job.services.postgres.id }} \
            pg_dump -U reqflow -Fc -d reqflow > "${RUNNER_TEMP}/reqflow-snapshot.dump"
          ls -l "${RUNNER_TEMP}/reqflow-snapshot.dump"

      - name: Save the seeded database snapshot
        if: steps.db-snapshot.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/reqflow-snapshot.dump
          key: ${{ steps.db-snapshot.outputs.cache-primary-key }}

      - name: Start Django backend
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          AUTH_JWT_SECRET: ci-test-auth-jwt-secret
          DJANGO_ENV: test
          DEBUG: 'True'
          DB_NAME: reqflow
          DB_USER: reqflow
          DB_PASSWORD: reqflow
          # Read by migration 0048_app_role.py to create the least-privilege
          # app role (REQ-L2-PL-010) — required, no default, even though this
          # job connects as the superuser above.
          DB_APP_PASSWORD: ci-test-app-role-password
          DB_HOST: localhost
          DB_PORT: '5432'
          # See the identical override + rationale in the migration step above
          # — this is the actual long-running runserver process it protects.
          DB_CONN_MAX_AGE: '0'
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          ALLOWED_HOSTS: localhost,127.0.0.1
          DEFAULT_TENANT_ID: '1'
          LLM_PROVIDER: mock
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          VITE_API_BASE_URL: http://localhost:8000
        run: python manage.py runserver 0.0.0.0:8000 &

      # ADR-010: /health/ready is fail-closed and requires celery_worker=up and
      # celery_beat heartbeating. Without these two processes the readiness
      # probe (e2e/helpers/preconditions.ts) gets HTTP 503 (celery_worker:
      # down, celery_beat: unknown), which fails RES-04 in
      # e2e/tests/health-contract.spec.ts before any product test runs.
      - name: Start Celery worker and beat
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          AUTH_JWT_SECRET: ci-test-auth-jwt-secret
          DJANGO_ENV: test
          DEBUG: 'True'
          DB_NAME: reqflow
          DB_USER: reqflow
          DB_PASSWORD: reqflow
          DB_APP_PASSWORD: ci-test-app-role-password
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_CONN_MAX_AGE: '0'
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          ALLOWED_HOSTS: localhost,127.0.0.1
          DEFAULT_TENANT_ID: '1'
          LLM_PROVIDER: mock
        run: |
          celery -A reqogniloom worker --loglevel=info -Q default,llm,events,memory --concurrency=2 &
          celery -A reqogniloom beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler &

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        # No --ignore-scripts here: Vite/esbuild/rollup resolve their platform
        # binaries through dependency install scripts. Reproducibility comes
        # from `npm ci` (lockfile-exact), not from skipping scripts.
        run: npm ci

      - name: Start Vite frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run dev &

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for services
        run: |
          echo "Waiting for backend..."
          timeout 30 bash -c 'until curl -sf http://localhost:8000/api/v1/schema/ > /dev/null; do sleep 2; done'
          echo "Waiting for frontend..."
          timeout 30 bash -c 'until curl -sf http://localhost:5173/ > /dev/null; do sleep 2; done'
          # ADR-010 readiness needs celery_beat to have heartbeaten at least
          # once; the beat heartbeat interval is 60s
          # (CELERY_BEAT_HEARTBEAT_INTERVAL_SECONDS=60), hence the generous
          # bounded budget below.
          echo "Waiting for readiness (celery worker+beat)..."
          timeout 240 bash -c 'until curl -sf http://localhost:8000/health/ready > /dev/null; do sleep 5; done'

      - name: Verify prod Docker build (smoke test)
        # Build the frontend production Docker image to ensure no build-time regressions
        # fix #149: tag with the commit SHA instead of mutable :latest for traceability/rollback
        # Only shard 1: the artifact is identical and --no-cache made this a
        # 4x repetition of the most expensive non-test step.
        if: matrix.shard == 1
        run: docker build -f frontend/Dockerfile --target production frontend --no-cache -t reqflow-frontend:${{ github.sha }}

      - name: Run Playwright E2E tests
        working-directory: e2e
        env:
          FRONTEND_URL: http://localhost:5173
          BACKEND_URL: http://localhost:8000
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report
        # Failure only: uploading a report for a green run burned time and once
        # failed transiently, turning a green test run into a red job.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report/
          retention-days: 7
