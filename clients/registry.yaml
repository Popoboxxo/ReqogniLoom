# ReqogniLoom client connection registry — Single Source of Truth (#1171 / B0).
#
# Every generated client artifact (docs/clients/**, snippets referenced below,
# marketplace/server.json in Stufe 2) is derived from this file. `render.py`
# reads it; `client-artifacts-check.yml` fails when the committed artifacts no
# longer match. Editing a snippet or a client doc by hand is therefore a
# deliberate CI failure, not a silent drift.
#
# Verified against v1.8.0-beta.18 (QS sandbox 172.20.5.120); see
# docs/plans/2026-10-04-one-click-client-installation.md for the QA evidence.

version_source: VERSION

conventions:
  mcp_url_env: REQOGNILOOM_MCP_URL
  api_key_env: REQOGNILOOM_API_KEY
  api_key_prefix: reqlo_
  default_auth_header: X-API-Key
  transport_paths:
    streamable_http: /mcp/
    sse: /mcp/sse/
  # Rule (plan §3.3): prefer Streamable HTTP when the client speaks it natively;
  # use SSE for plugin/store paths; stdio bridge when the client is stdio-only.
  transport_rule_de:
    - "**Streamable HTTP** (`/mcp/`): Client spricht es nativ — bevorzugt."
    - "**SSE** (`/mcp/sse/`): Plugin-/Store-Weg sieht SSE vor (Claude-Plugin, Antigravity)."
    - "**stdio-Bridge** (lokales Skript): falls ein Client ausschließlich stdio spricht."
  transport_rule_en:
    - "**Streamable HTTP** (`/mcp/`): client speaks it natively — preferred."
    - "**SSE** (`/mcp/sse/`): plugin/store path expects SSE (Claude plugin, Antigravity)."
    - "**stdio bridge** (local script): when a client only speaks stdio."

smoke:
  # One identical test across all clients (plan §4.3); the reference number is
  # a REST cross-check, never a free-text guess.
  task_de: "Nutze das reqogniloom-MCP-Werkzeug und nenne die Anzahl der Requirements im Workspace <workspace-id>."
  task_en: "Use the reqogniloom MCP tool and report the number of requirements in workspace <workspace-id>."
  second_de: "Liste die Workspaces."
  second_en: "List the workspaces."
  pass_de: "Bestanden, wenn beide Zahlen der REST-Gegenprobe entsprechen UND der MCP-Call im Client-Log sichtbar ist."
  pass_en: "Pass when both numbers match the REST cross-check AND the MCP call is visible in the client log."

store:
  # Stufe-2 distribution metadata (plan §5.1/§5.2). Confirmed decisions (user,
  # 2026-10-09): E1 = personal MCP namespace io.github.popoboxxo; E3 = Claude
  # marketplace lives in this repo; E4 = no pre-releases in the curated stores
  # (S3 Anthropic Plugin Directory, S6 Hermes catalog), pre-releases only on the
  # npm dist-tag `next`; E2 = npm scope @popoboxxo. Decision context:
  # docs/clients/STAGE2.md. render.py generates the repo-root
  # .claude-plugin/marketplace.json and server.json from this section; a hand
  # edit of either artifact is a CI failure (--check).
  marketplace:
    name: reqogniloom-marketplace
    owner:
      name: ReqogniLoom
    repo: Popoboxxo/ReqogniLoom
    plugin: reqogniloom
    plugin_path: dist/plugins/claude-code/reqogniloom
    description: "ReqogniLoom Claude Code marketplace — SE agent roles plus a native MCP connection."
    plugin_description: "ReqogniLoom SE agent roles + MCP connection"
  mcp_registry:
    # E1 confirmed (user, 2026-10-09): personal namespace io.github.popoboxxo.
    name: io.github.popoboxxo/reqogniloom
    description: "ReqogniLoom MCP server: requirements, architecture and test management."
    repository_url: https://github.com/Popoboxxo/ReqogniLoom
    remote_path: /mcp/
    auth_header: X-API-Key
    decision_e1: "confirmed 2026-10-09: personal namespace io.github.popoboxxo"

  # E2 (npm): scope and package coordinates for the OpenCode installer package.
  npm:
    scope: "@popoboxxo"
    package: "@popoboxxo/reqogniloom-opencode"
    package_dir: dist/npm/reqogniloom-opencode
    dist_tags:
      prerelease: next
      stable: latest

  # E4: curated stores receive stable releases only; pre-releases go to the npm
  # `next` dist-tag. S1 (MCP registry) and S2 (Claude marketplace) may carry a
  # labelled pre-release.
  publish_policy:
    curated_stores_no_prerelease: [S3, S6]
    prerelease_dist_tag: next
    allow_prerelease_with_label: [S1, S2]

clients:
  - id: claude-code
    name: Claude Code
    tested_version: "2.1.267"
    target_level: L3
    status: supported
    transport: sse
    url_path: /mcp/sse/
    auth_header: X-API-Key
    config_artifact: dist/plugins/claude-code/reqogniloom/.mcp.json
    skills_dir: "~/.claude/skills"
    install_de:
      - lang: bash
        text: |
          # Stufe 1 (lokal, aus dem geklonten Repo):
          claude plugin marketplace add ./dist/plugins/claude-code
          claude plugin install reqogniloom@reqogniloom-marketplace --scope user -y
          export REQOGNILOOM_MCP_URL="https://<host>"
          export REQOGNILOOM_API_KEY="reqlo_…"
    install_en:
      - lang: bash
        text: |
          # Stage 1 (local, from the cloned repo):
          claude plugin marketplace add ./dist/plugins/claude-code
          claude plugin install reqogniloom@reqogniloom-marketplace --scope user -y
          export REQOGNILOOM_MCP_URL="https://<host>"
          export REQOGNILOOM_API_KEY="reqlo_…"
    fallback_de:
      - lang: bash
        text: |
          claude mcp add --transport http reqogniloom \
            "$REQOGNILOOM_MCP_URL/mcp/sse/" \
            --header "X-API-Key: $REQOGNILOOM_API_KEY"
    fallback_en:
      - lang: bash
        text: |
          claude mcp add --transport http reqogniloom \
            "$REQOGNILOOM_MCP_URL/mcp/sse/" \
            --header "X-API-Key: $REQOGNILOOM_API_KEY"
    verify:
      command: "claude mcp list"
      expected_de: "`plugin:reqogniloom:reqogniloom: http://<host>/mcp/sse/ (SSE) - ✔ Connected`"
      expected_en: "`plugin:reqogniloom:reqogniloom: http://<host>/mcp/sse/ (SSE) - ✔ Connected`"
      tool_result: "49 Requirements (QA reference workspace)"
    prereq_de:
      - "`claude` ≥ 2.1.x im `PATH`."
      - "Netzwerkzugriff auf den MCP-Endpunkt."
      - "`reqlo_…`-Key mit passender Rolle (read-only für Audit-Zwecke empfohlen)."
    prereq_en:
      - "`claude` ≥ 2.1.x on `PATH`."
      - "Network access to the MCP endpoint."
      - "A `reqlo_…` key with the right role (read-only recommended for audit use)."
    provider_de:
      - "Standard-Anthropic-Abo/-Key unverändert. Für eigene Anthropic-kompatible Endpunkte: `ANTHROPIC_BASE_URL`, `ANTHROPIC_API_KEY`, `ANTHROPIC_MODEL`, `ANTHROPIC_CUSTOM_HEADERS`."
      - "Die Warnung `[claude-code:unrecognized_model]` ist bei Fremdmodellen kosmetisch."
    provider_en:
      - "Standard Anthropic subscription/key unchanged. For custom Anthropic-compatible endpoints: `ANTHROPIC_BASE_URL`, `ANTHROPIC_API_KEY`, `ANTHROPIC_MODEL`, `ANTHROPIC_CUSTOM_HEADERS`."
      - "The `[claude-code:unrecognized_model]` warning is cosmetic with third-party models."
    pitfalls_de:
      - "`plugin@marketplace` referenziert den **Marketplace-Namen** aus `marketplace.json → name` (`reqogniloom-marketplace`) — **nicht** den Quellordner (`claude-code`); der Installer liest den Namen aus der Datei."
      - "Marketplace-/Entry-Name **muss** `plugin.json → name` entsprechen, sonst `Plugin \"x\" not found in marketplace \"y\"`."
      - "Reservierte Marketplace-Namen (`claude-plugins-official`) sind gesperrt."
      - "Relative `source`-Pfade werden ab der Marketplace-Wurzel aufgelöst."
    pitfalls_en:
      - "`plugin@marketplace` names the **marketplace name** from `marketplace.json → name` (`reqogniloom-marketplace`) — **not** the source folder (`claude-code`); the installer reads the name from the file."
      - "Marketplace/entry name **must** match `plugin.json → name`, else `Plugin \"x\" not found in marketplace \"y\"`."
      - "Reserved marketplace names (`claude-plugins-official`) are blocked."
      - "Relative `source` paths resolve from the marketplace root."
    roles_de:
      - "Der Key-Scope (Rolle am Server) entscheidet über die Rechte — nicht die Skill-Auswahl. Für Audit/Preview eine read-only-Rolle binden."
    roles_en:
      - "The key scope (server-side role) decides permissions — not the skill selection. Bind a read-only role for audit/preview."
    update_de:
      - "`claude plugin update reqogniloom` (Version aus `VERSION`)."
      - "Deinstallation: `claude plugin uninstall reqogniloom`."
    update_en:
      - "`claude plugin update reqogniloom` (version fed from `VERSION`)."
      - "Uninstall: `claude plugin uninstall reqogniloom`."

  - id: codex
    name: Codex CLI
    tested_version: "0.151.0"
    target_level: L3
    status: supported
    transport: streamable_http
    url_path: /mcp/
    auth_header: "Authorization: Bearer"
    config_artifact: dist/codex/config.toml.snippet
    skills_dir: "~/.codex/skills"
    install_de:
      - lang: bash
        text: |
          # Ein Befehl: MCP-Server + Skills (-> ~/.codex/skills):
          scripts/clients/install.sh --client codex \
            --url "$REQOGNILOOM_MCP_URL" --key-env REQOGNILOOM_API_KEY
          codex mcp list            # -> reqogniloom   enabled
          export REQOGNILOOM_API_KEY="reqlo_…"   # via bearer_token_env_var
    install_en:
      - lang: bash
        text: |
          # One command: MCP server + skills (-> ~/.codex/skills):
          scripts/clients/install.sh --client codex \
            --url "$REQOGNILOOM_MCP_URL" --key-env REQOGNILOOM_API_KEY
          codex mcp list            # -> reqogniloom   enabled
          export REQOGNILOOM_API_KEY="reqlo_…"   # read via bearer_token_env_var
    fallback_de:
      - lang: toml
        text: |
          [mcp_servers.reqogniloom]
          url = "https://your-reqogniloom-host/mcp/"
          bearer_token_env_var = "REQOGNILOOM_API_KEY"
    fallback_en:
      - lang: toml
        text: |
          [mcp_servers.reqogniloom]
          url = "https://your-reqogniloom-host/mcp/"
          bearer_token_env_var = "REQOGNILOOM_API_KEY"
    verify:
      command: "codex mcp list"
      expected_de: "`reqogniloom   enabled`; danach ein headless Call liefert die Workspace-Liste."
      expected_en: "`reqogniloom   enabled`; then a headless call returns the workspace list."
      tool_result: "12 Workspaces (REST cross-check count = 12)"
    prereq_de:
      - "`codex` ≥ 0.151 im `PATH`."
      - "Ein eigener Modell-/Provider-Eintrag (siehe Modell/Provider)."
      - "`reqlo_…`-Key; er wird über `bearer_token_env_var` gelesen, nie in die Config geschrieben."
    prereq_en:
      - "`codex` ≥ 0.151 on `PATH`."
      - "A custom model/provider entry (see Model/Provider)."
      - "A `reqlo_…` key read via `bearer_token_env_var`, never written into the config."
    provider_de:
      - "**`wire_api = \"responses\"` ist Pflicht** — Codex ≥ 0.151 lehnt `\"chat\"` ab (sonst lädt die Config nicht)."
      - "Headless-MCP-Calls brauchen `--dangerously-bypass-approvals-and-sandbox`; sonst blockiert die Approval-Policy **jeden** MCP-Aufruf (nur in kontrollierten Läufen)."
      - "Der LLM-Endpunkt muss die Responses-API sprechen; nicht jedes Modell tut das."
    provider_en:
      - "**`wire_api = \"responses\"` is mandatory** — Codex ≥ 0.151 rejects `\"chat\"` (otherwise the config fails to load)."
      - "Headless MCP calls need `--dangerously-bypass-approvals-and-sandbox`; otherwise the approval policy blocks **every** MCP call (controlled runs only)."
      - "The LLM endpoint must speak the Responses API; not every model does."
    pitfalls_de:
      - "`wire_api=\"chat\"` → Config lädt nicht."
      - "„MCP tool call requires approval, but approval policy is never\" → Bypass fehlt."
      - "Die Warnung „bubblewrap not found\" betrifft nur die Shell-Sandbox (für MCP irrelevant)."
    pitfalls_en:
      - "`wire_api=\"chat\"` → config fails to load."
      - "\"MCP tool call requires approval, but approval policy is never\" → bypass missing."
      - "The \"bubblewrap not found\" warning only affects the shell sandbox (irrelevant for MCP)."
    roles_de:
      - "Bearer-Transport ist die einzige von Codex unterstützte Form für einen `reqlo_`-Key; der Key-Scope steuert die Rechte."
    roles_en:
      - "Bearer is the only transport Codex supports for a `reqlo_` key; the key scope governs permissions."
    update_de:
      - "Config-Snippet aktualisieren bzw. `codex mcp remove reqogniloom` + erneut `add`."
    update_en:
      - "Update the config snippet, or `codex mcp remove reqogniloom` + `add` again."

  - id: opencode
    name: OpenCode
    tested_version: "1.18.31"
    target_level: L3
    status: supported
    transport: sse
    url_path: /mcp/sse/
    auth_header: X-API-Key
    config_artifact: dist/opencode/opencode.json.snippet
    skills_dir: ".opencode/skills"
    install_de:
      - lang: bash
        text: |
          # Ein Befehl: MCP-Server (remote/SSE) + Skills (-> .opencode/skills, DOMAIN_MODEL.md):
          scripts/clients/install.sh --client opencode \
            --url "$REQOGNILOOM_MCP_URL" --key-env REQOGNILOOM_API_KEY
          # (intern: opencode mcp add reqogniloom --url "$REQOGNILOOM_MCP_URL/mcp/sse/" \
          #   --header "X-API-Key={env:REQOGNILOOM_API_KEY}")
          opencode mcp list                 # -> ✓ reqogniloom connected
    install_en:
      - lang: bash
        text: |
          # One command: MCP server (remote/SSE) + skills (-> .opencode/skills, DOMAIN_MODEL.md):
          scripts/clients/install.sh --client opencode \
            --url "$REQOGNILOOM_MCP_URL" --key-env REQOGNILOOM_API_KEY
          # (internally: opencode mcp add reqogniloom --url "$REQOGNILOOM_MCP_URL/mcp/sse/" \
          #   --header "X-API-Key={env:REQOGNILOOM_API_KEY}")
          opencode mcp list                 # -> ✓ reqogniloom connected
    fallback_de:
      - lang: json
        text: |
          {
            "mcp": {
              "reqogniloom": {
                "type": "remote",
                "url": "{env:REQOGNILOOM_MCP_URL}/mcp/sse/",
                "headers": { "X-API-Key": "{env:REQOGNILOOM_API_KEY}" }
              }
            }
          }
    fallback_en:
      - lang: json
        text: |
          {
            "mcp": {
              "reqogniloom": {
                "type": "remote",
                "url": "{env:REQOGNILOOM_MCP_URL}/mcp/sse/",
                "headers": { "X-API-Key": "{env:REQOGNILOOM_API_KEY}" }
              }
            }
          }
    verify:
      command: "opencode mcp list"
      expected_de: "`✓ reqogniloom connected`; danach ein echter Tool-Call (`requirement_query` → 49)."
      expected_en: "`✓ reqogniloom connected`; then a real tool call (`requirement_query` → 49)."
      tool_result: "49 Requirements"
    prereq_de:
      - "`opencode` im `PATH`; Skills-Ablage beschreibbar."
      - "`reqlo_…`-Key."
    prereq_en:
      - "`opencode` on `PATH`; skills directory writable."
      - "A `reqlo_…` key."
    provider_de:
      - "`opencode-go/…`-Modelle funktionieren (verifiziert)."
      - "Free-Tier-Modelle (`opencode/*-free`) waren zum Testzeitpunkt serverseitig defekt (`UnknownError`) — Umgebungszustand, kein Produktfehler."
    provider_en:
      - "`opencode-go/…` models work (verified)."
      - "Free-tier models (`opencode/*-free`) were server-side broken at test time (`UnknownError`) — environment state, not a product bug."
    pitfalls_de:
      - "**Historischer Widerspruch (aufgelöst):** `docs/agent-templates/INSTALL.md` nannte `type:\"http\"` + `options.headers`; das ausgelieferte Snippet und diese Seite verwenden `type:\"remote\"` + Top-Level-`headers` — das ist die kanonische Form."
      - "`{env:NAME}` wird expandiert, ein blankes `{...}` nicht (wird literal gesendet → stille Fehlfunktion)."
      - "Der Installer setzt den Key-Header als `X-API-Key={env:REQOGNILOOM_API_KEY}` (Platzhalter, nie ein literaler Key in der Config)."
      - "`DOMAIN_MODEL.md` muss **zwei Ebenen über** `skills/<name>/SKILL.md` liegen."
      - "Keine client-seitige Tool-Beschränkung je Skill → Rechte über den Key-Scope steuern."
    pitfalls_en:
      - "**Historical contradiction (resolved):** `docs/agent-templates/INSTALL.md` said `type:\"http\"` + `options.headers`; the shipped snippet and this page use `type:\"remote\"` + top-level `headers` — that is the canonical form."
      - "`{env:NAME}` is expanded, a bare `{...}` is not (sent literally → silent failure)."
      - "The installer passes the key header as `X-API-Key={env:REQOGNILOOM_API_KEY}` (placeholder, never a literal key in the config)."
      - "`DOMAIN_MODEL.md` must sit **two levels above** `skills/<name>/SKILL.md`."
      - "No client-side per-skill tool restriction → govern permissions via the key scope."
    roles_de:
      - "Read-only-Rolle für Fremd-/Preview-Nutzung; der Key-Scope ist die einzige wirksame Grenze."
    roles_en:
      - "Read-only role for third-party/preview use; the key scope is the only effective boundary."
    update_de:
      - "Snippet/Config neu ziehen; `opencode plugin <modul>` (Stufe 2) installiert MCP + Skills in einem Schritt."
    update_en:
      - "Re-pull the snippet/config; `opencode plugin <module>` (Stage 2) installs MCP + skills in one step."

  - id: kimi-code
    name: Kimi Code
    tested_version: "2.1.1"
    target_level: L2
    status: partial
    transport: streamable_http
    url_path: /mcp/
    auth_header: "Authorization: Bearer"
    config_artifact: ""
    skills_dir: "~/.kimi-code/skills"
    install_de:
      - lang: bash
        text: |
          # Kimi hat kein natives MCP-Add-Kommando -> Installer-Skript
          # (MCP-Config ~/.kimi-code/mcp.json + Skills -> ~/.kimi-code/skills)
          scripts/clients/install.sh --client kimi-code \
            --url "https://<host>" --key-env REQOGNILOOM_API_KEY
          kimi               # -> /mcp-config zeigt reqogniloom
    install_en:
      - lang: bash
        text: |
          # Kimi has no native MCP-add command -> installer script
          # (MCP config ~/.kimi-code/mcp.json + skills -> ~/.kimi-code/skills)
          scripts/clients/install.sh --client kimi-code \
            --url "https://<host>" --key-env REQOGNILOOM_API_KEY
          kimi               # -> /mcp-config lists reqogniloom
    fallback_de:
      - lang: json
        text: |
          // ~/.kimi-code/mcp.json
          {
            "mcpServers": {
              "reqogniloom": {
                "transport": "http",
                "url": "https://<host>/mcp/",
                "bearerTokenEnvVar": "REQOGNILOOM_API_KEY"
              }
            }
          }
    fallback_en:
      - lang: json
        text: |
          // ~/.kimi-code/mcp.json
          {
            "mcpServers": {
              "reqogniloom": {
                "transport": "http",
                "url": "https://<host>/mcp/",
                "bearerTokenEnvVar": "REQOGNILOOM_API_KEY"
              }
            }
          }
    verify:
      command: "kimi  (in-client; /mcp-config zeigt reqogniloom)"
      expected_de: "`reqogniloom` erscheint mit seinen Tools; `kimi doctor` validiert nur `config.toml`/`tui.toml` — **nicht** `mcp.json`."
      expected_en: "`reqogniloom` appears with its tools; `kimi doctor` validates only `config.toml`/`tui.toml` — **not** `mcp.json`."
      tool_result: "12 Workspaces (REST cross-check count = 12)"
    prereq_de:
      - "`kimi` im `PATH`; Schreibzugriff auf `~/.kimi-code/`."
      - "`reqlo_…`-Key."
    prereq_en:
      - "`kimi` on `PATH`; write access to `~/.kimi-code/`."
      - "A `reqlo_…` key."
    provider_de:
      - "Kimi nutzt eigene/managed Provider. Fremd-Provider nur über eine Registry: `kimi provider add <api.json>` — das Feld `type` ist **Pflicht**."
      - "Managed-Quota kann einen Lauf mit 403 blockieren („usage limit\") — kein ReqogniLoom-Fehler."
    provider_en:
      - "Kimi uses its own/managed providers. Third-party providers only via a registry: `kimi provider add <api.json>` — the `type` field is **mandatory**."
      - "Managed quota can block a run with 403 (\"usage limit\") — not a ReqogniLoom error."
    pitfalls_de:
      - "Kein `kimi mcp`-Kommando — der Installer schreibt `~/.kimi-code/mcp.json`."
      - "`headers.Authorization: Bearer ${VAR}` wird **nicht** interpoliert (literal gesendet → 401, keine Tools); stattdessen `bearerTokenEnvVar: \"REQOGNILOOM_API_KEY\"` verwenden."
      - "Der Installer schreibt `mcp.json` deterministisch neu (vorheriges Backup `mcp.json.bak-*`); weitere `mcpServers` darin werden **nicht** zusammengeführt."
      - "`kimi doctor` prüft nur `config.toml`/`tui.toml`, nicht `mcp.json`."
      - "Fremd-Registry ohne `type` wird verworfen: „Skipping invalid entry … (id, name, api, type, models)\"."
      - "Cloudflare kann Nicht-Browser-Clients mit `403 code: 1010` abweisen (User-Agent setzen)."
    pitfalls_en:
      - "No `kimi mcp` command — the installer writes `~/.kimi-code/mcp.json`."
      - "`headers.Authorization: Bearer ${VAR}` is **not** interpolated (sent literally → 401, no tools); use `bearerTokenEnvVar: \"REQOGNILOOM_API_KEY\"` instead."
      - "The installer rewrites `mcp.json` deterministically (prior backup `mcp.json.bak-*`); other `mcpServers` entries are **not** merged."
      - "`kimi doctor` validates only `config.toml`/`tui.toml`, not `mcp.json`."
      - "A third-party registry entry without `type` is dropped: \"Skipping invalid entry … (id, name, api, type, models)\"."
      - "Cloudflare can reject non-browser clients with `403 code: 1010` (set a User-Agent)."
    roles_de:
      - "Key-Scope steuert die Rechte; read-only für Audit-Zwecke."
    roles_en:
      - "Key scope governs permissions; read-only for audit use."
    update_de:
      - "Installer erneut ausführen (`mcp.json` wird neu geschrieben, Backup unter `mcp.json.bak-*`; Skills: copy-if-absent, kein Refresh)."
      - "L3 erst mit einem Upstream-`kimi mcp add` (Feature-Request offen)."
    update_en:
      - "Re-run the installer (`mcp.json` is rewritten, backup at `mcp.json.bak-*`; skills: copy-if-absent, no refresh)."
      - "L3 only once upstream ships `kimi mcp add` (feature request open)."

