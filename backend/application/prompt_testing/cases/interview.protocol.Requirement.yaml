# Prompt-regression scenarios for the `interview.protocol.Requirement` slot.
# Protocol slots are parsed as YAML, not rendered (see prompt_slots.py); the
# assertion pins the top-level key the parser requires.
# Case files are owned by plan D (backend/application/prompt_testing/cases.py).
slot: interview.protocol.Requirement
scenarios:
  - name: factory-protocol-is-valid-yaml
    data:
      artifact_type: "Requirement"
      phase_name: "elicitation"
      collected_fields_json: "{}"
      missing_fields_json: "[]"
      grounding_snapshot_json: "[]"
      memory_context: ""
    assert:
      - {type: contains, value: "phases:"}
      - {type: contains, value: "required_fields:"}
