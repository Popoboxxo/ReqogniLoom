# Prompt-regression scenarios for the `sysreq_to_arch_assign` slot.
# Case files are owned by plan D (backend/application/prompt_testing/cases.py).
slot: sysreq_to_arch_assign
scenarios:
  - name: login-allocation-without-memory
    data:
      req_title: "Login mit JWT"
      req_description: "Der Dienst MUSS einen Login per JWT anbieten."
      arch_elements_json: '[{"id": "arch-auth", "name": "AuthService", "description": "Authentication"}]'
      memory_context: ""
    assert:
      - {type: contains, value: "Login mit JWT"}
      - {type: contains, value: "AuthService"}
  - name: login-allocation-with-memory
    data:
      req_title: "Login mit JWT"
      req_description: "Der Dienst MUSS einen Login per JWT anbieten."
      arch_elements_json: '[{"id": "arch-auth", "name": "AuthService", "description": "Authentication"}]'
      memory_context: "Memory: authentication lives in the AuthService."
    assert:
      - {type: contains, value: "authentication lives in the AuthService"}
