# ReqogniLoom Production Compose — Unraid Deployment
# Based on ai-native-reqogniloom-POC/docker-compose.yml (production target)
# Unraid-specific: Bind mounts to /mnt/user/reqogniloom_prod/, custom network, icon labels
#
# REGISTRY AUTHENTICATION REQUIRED (only once CI pushes images)
# ────────────────────────────────
# Images are hosted in Codeberg Container Registry (private).
# Before starting this stack against pre-built images, authenticate to Codeberg:
#   docker login codeberg.org
#   (Use Codeberg username and personal access token or password)
#
# Images are automatically built and pushed by Woodpecker CI (.woodpecker.yml in ai-native-reqogniloom-POC)
# on every push to the main branch.
#
# LOCAL BUILD (no registry / no CI access needed)
# ────────────────────────────────
# Every custom service below also has a `build:` section. Compose builds
# locally and tags with `image:` whenever both keys are present — so
#   docker compose -f deployment/unraid/docker-compose.yaml build
#   docker compose -f deployment/unraid/docker-compose.yaml up -d
# works entirely offline against a full repo checkout, no registry login
# needed. Once CI access is approved and images are pushed, just delete
# the `build:` blocks to go back to pure registry pulls.
#
# REPO_ROOT: build contexts resolve to ${REPO_ROOT:-../..}/backend and
# ${REPO_ROOT:-../..}/frontend. The default (../..) only works if this file
# is run in place from deployment/unraid/ inside a full repo checkout.
# Unraid's Docker Compose Manager plugin does NOT run the file in place —
# it stores its own copy under /boot/config/plugins/compose.manager/projects/<name>/,
# so the relative default resolves to the wrong place and the build fails
# with "unable to prepare context: path ... not found". If you're deploying
# via Compose Manager, set REPO_ROOT in your .env to the absolute path of
# the actual repo checkout on this host, e.g.:
#   REPO_ROOT=/mnt/user/appdata/ai-native-reqogniloom-POC

services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL — ARCH-L1-010 PersistenceLayer
  # ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    labels:
      net.unraid.docker.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/postgresql.png"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-reqogniloom}
      POSTGRES_USER: ${DB_USER:-reqogniloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /mnt/user/reqogniloom_prod/db:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reqogniloom}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - reqogniloom-net-prod

  # ─────────────────────────────────────────────────────────
  # PostgreSQL Backup — REQ-102 (INF-21)
  # Runs backend/scripts/backup_postgres.sh on a fixed interval (default 24h)
  # ─────────────────────────────────────────────────────────
  postgres-backup:
    image: postgres:16-alpine
    labels:
      net.unraid.docker.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/postgresql.png"
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-reqogniloom}
      POSTGRES_USER: ${DB_USER:-reqogniloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
    volumes:
      - /mnt/user/reqogniloom_prod/backup:/backups
      # NOTE: For Unraid, mount the backup script from the frontend container or copy it manually
      # Option 1: Copy backend/scripts/backup_postgres.sh to /mnt/user/reqogniloom_prod/scripts/backup_postgres.sh
      #           then mount: - /mnt/user/reqogniloom_prod/scripts/backup_postgres.sh:/usr/local/bin/backup_postgres.sh:ro
      # Option 2: If running in the same compose with backend build context, uncomment below:
      # - ./backend/scripts/backup_postgres.sh:/usr/local/bin/backup_postgres.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /bin/sh /usr/local/bin/backup_postgres.sh || echo "[backup] run failed";
          sleep "${BACKUP_INTERVAL:-86400}";
        done
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - reqogniloom-net-prod

  # ─────────────────────────────────────────────────────────
  # Redis — ARCH-L1-016 ResilienceOrchestrator (Celery broker)
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    labels:
      net.unraid.docker.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/redis.png"
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "${REDIS_PASSWORD}" ]; then
          exec redis-server --maxmemory 256mb --maxmemory-policy volatile-lru --appendonly yes
        else
          exec redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy volatile-lru --appendonly yes
        fi
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - reqogniloom-net-prod

  # ─────────────────────────────────────────────────────────
  # Database Migration Service
  # Runs migrations before backend startup
  # ─────────────────────────────────────────────────────────
  migrate:
    image: codeberg.org/dduchrow/reqogniloom-backend:latest
    build:
      context: ${REPO_ROOT:-../..}/backend
      dockerfile: Dockerfile
    platform: linux/amd64
    restart: "no"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-reqogniloom}
      DB_USER: ${DB_USER:-reqogniloom}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    command: python manage.py migrate
    networks:
      - reqogniloom-net-prod

  # ─────────────────────────────────────────────────────────
  # Admin Bootstrap Service — Mandatory base provisioning (REQ-L1-010)
  # ─────────────────────────────────────────────────────────
  # Runs after migrate and before backend. Idempotently provisions the base
  # tenant, workspace, admin user and admin role so a fresh instance is usable
  # immediately (no manual seed step, no 401-on-first-login). Create-only on the
  # password: an admin who changed their password via the UI/API is never reset.
  # Fails fast only when it must create the admin but SYSTEM_ADMIN_PASSWORD is
  # unset — see backend/auth_tenancy/management/commands/bootstrap_admin.py.
  bootstrap:
    image: codeberg.org/dduchrow/reqogniloom-backend:latest
    build:
      context: ${REPO_ROOT:-../..}/backend
      dockerfile: Dockerfile
    platform: linux/amd64
    restart: "no"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-reqogniloom}
      DB_USER: ${DB_USER:-reqogniloom}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Admin account provisioned on first start. Username/email have safe
      # defaults; SYSTEM_ADMIN_PASSWORD is required only when the admin does not
      # exist yet (mirrors createsuperuser --noinput).
      SYSTEM_ADMIN_USERNAME: ${SYSTEM_ADMIN_USERNAME:-admin}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:-admin@demo.local}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python manage.py bootstrap_admin
    networks:
      - reqogniloom-net-prod

  # ─────────────────────────────────────────────────────────
  # Django Backend — All backend ARCH-L1 systems
  # ─────────────────────────────────────────────────────────
  backend:
    image: codeberg.org/dduchrow/reqogniloom-backend:latest
    build:
      context: ${REPO_ROOT:-../..}/backend
      dockerfile: Dockerfile
    platform: linux/amd64
    labels:
      net.unraid.docker.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/django.png"
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_NAME: ${DB_NAME:-reqogniloom}
      DB_USER: ${DB_USER:-reqogniloom}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      # LLM Provider — ARCH-L1-009 LlmAdapter (ADR-02)
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    ports:
      # NOTE: Backend publishes on 8010 for direct access. For production, use a reverse proxy
      # (e.g., Nginx Proxy Manager, Swag, or Traefik) instead and remove this port mapping.
      # The reverse proxy should connect to backend:8000 (internal Docker network).
      - "8010:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/schema/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    networks:
      - reqogniloom-net-prod

  # ─────────────────────────────────────────────────────────
  # Celery Worker — ARCH-L1-016 ResilienceOrchestrator
  # Handles async tasks: LLM calls, Webhooks, GitHub integration
  # ─────────────────────────────────────────────────────────
  celery:
    image: codeberg.org/dduchrow/reqogniloom-backend:latest
    build:
      context: ${REPO_ROOT:-../..}/backend
      dockerfile: Dockerfile
    platform: linux/amd64
    labels:
      net.unraid.docker.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/celery.png"
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-reqogniloom}
      DB_USER: ${DB_USER:-reqogniloom}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "celery -A reqogniloom inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "celery -A reqogniloom worker --loglevel=info -Q default,llm,events"
    networks:
      - reqogniloom-net-prod

  # ─────────────────────────────────────────────────────────
  # Celery Beat Scheduler — Periodic Tasks (REQ-030)
  # ─────────────────────────────────────────────────────────
  celery-beat:
    image: codeberg.org/dduchrow/reqogniloom-backend:latest
    build:
      context: ${REPO_ROOT:-../..}/backend
      dockerfile: Dockerfile
    platform: linux/amd64
    labels:
      net.unraid.docker.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/celery.png"
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-reqogniloom}
      DB_USER: ${DB_USER:-reqogniloom}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "celery -A reqogniloom beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    networks:
      - reqogniloom-net-prod

  # ─────────────────────────────────────────────────────────
  # React Frontend — ARCH-L1-001 ReactFrontend
  # ─────────────────────────────────────────────────────────
  frontend:
    image: codeberg.org/dduchrow/reqogniloom-frontend:latest
    build:
      context: ${REPO_ROOT:-../..}/frontend
      dockerfile: Dockerfile
      target: production
    platform: linux/amd64
    labels:
      net.unraid.docker.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/react.png"
      net.unraid.docker.webui: "http://172.20.4.255:5554"
    restart: unless-stopped
    env_file: .env
    environment:
      # Environment variables used at build time for Vite
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "5554:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - reqogniloom-net-prod

networks:
  reqogniloom-net-prod:
    driver: bridge
