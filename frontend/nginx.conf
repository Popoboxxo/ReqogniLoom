# nginx Configuration for ReqogniLoom React SPA
# REQ-031: SPA History-API Fallback with Gzip and Cache Headers

server {
    listen 8080;
    server_name _;

    # Root directory for React build output
    root /usr/share/nginx/html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json
               application/wasm image/svg+xml;
    gzip_comp_level 6;

    # Security headers (fixes #155; plan D / D1.0 for the regression).
    #
    # The five headers live in a snippet because a location with its own
    # `add_header` drops every inherited one — the SPA document and the static
    # assets therefore lost CSP/XFO/nosniff (RB-D02). Every location below that
    # adds a header includes the snippet as well.
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # Lightweight healthcheck endpoint (fixes #155)
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type "text/plain";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Reverse-proxy API requests to Django backend (REQ-225)
    #
    # The upstream is resolved per request through Docker's embedded DNS
    # (127.0.0.11) instead of at startup, for the same reason as the
    # bluepencil block below (#1054): with a literal
    # `proxy_pass http://backend:8000;` nginx resolves "backend" once, when the
    # worker starts, and keeps that IP for the worker's whole lifetime. Every
    # deployment that recreates the backend container — which is every `up -d`,
    # every image update, every changed .env — hands the container a NEW IP,
    # and the frontend proxy then answers 502 for /api/ and /mcp/ until the
    # FRONTEND is restarted too. The symptom is deceptive: the SPA itself is
    # served from this same nginx and stays reachable, so the UI loads and only
    # the login POST fails, which reads as "wrong password" to the user and is
    # invisible in every application health check.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        # Issue #617: nginx's $host variable always drops the port, even when
        # the client's Host header included one (a well-known nginx gotcha —
        # $host is normalized, $http_host is the raw header). On any
        # deployment reachable on a non-default port (every port this stack
        # publishes: 5173, 8001, ...) that made Django see e.g. Host:
        # <backend-host> while the browser's real Origin was
        # http://<backend-host>:5173 — the two can never self-match, so
        # Django's CSRF origin check falls through to CSRF_TRUSTED_ORIGINS
        # and 403s unless that exact origin happens to be listed there.
        # $http_host preserves host:port exactly as the browser sent it, so
        # the self-origin match succeeds without depending on an exhaustive
        # CSRF_TRUSTED_ORIGINS entry per deployment host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        client_max_body_size 100M;
        # Issue #342: workspace-wide LLM tools may legitimately run up to
        # LLM_LONG_RUNNING_TIMEOUT (default 180s). nginx's 60s default
        # proxy_read_timeout would cut those requests off with a 504 before the
        # backend can answer, so keep this above the backend-side timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Reverse-proxy MCP server requests to Django backend (REQ-225)
    #
    # Same per-request resolution as the /api/ block above (#1054) — the MCP
    # transport has the identical 502-on-backend-recreate failure mode, and it
    # is the block most likely to be reached by a long-lived SSE stream while a
    # deployment is rolling, which is exactly when the stale IP hurts most.
    location /mcp/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $backend_mcp_upstream http://backend:8000;
        proxy_pass $backend_mcp_upstream;
        # Issue #617 — see the /api/ block above for why $http_host (not $host).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        client_max_body_size 100M;
        # Issue #342 — see the /api/ block above. The MCP surface hosts all
        # three workspace-wide LLM tools, plus long-lived SSE streams.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Reverse-proxy the bluepencil review-layer hub (issue #980). The layer is
    # same-origin by design (loader.ts probes `/bluepencil/api/health` and posts
    # to `/bluepencil/api`), so the SPA's own nginx must forward that path to the
    # hub; without this it fell through to the SPA fallback and answered
    # index.html.
    #
    # The upstream is resolved per request through Docker's embedded DNS
    # (127.0.0.11) instead of at startup: the hub is an opt-in Compose profile,
    # and a literal `proxy_pass http://bluepencil:8787;` would make nginx fail to
    # start ("host not found in upstream") on every deployment that does not run
    # it.
    #
    # ACCESS CONTROL (plan D / D1.1, ENT-D2 = B, QR-S02). The hub itself only
    # knows one shared secret, not users — so the REQUESTER is authenticated
    # here, against Django, and the hub secret never leaves this server:
    #
    #   * `auth_request` asks the backend whether the caller has a session. The
    #     subrequest goes to `GET /api/v1/auth/me/`, which answers 401 without a
    #     valid session (httpOnly access cookie or Bearer), and nginx relays that
    #     401 to the browser before any note is read or written. The hub has no
    #     tenant isolation, so "anyone who can reach the frontend port" must not
    #     be enough.
    #   * `x-bluepencil-auth` is then SET here, from the `BLUEPENCIL_AUTH_SECRET`
    #     the template is rendered with — a client-supplied header of the same
    #     name is overwritten and never passed through. With an empty secret the
    #     hub answers 401 to everything (fail-closed).
    location /bluepencil/api/ {
        auth_request /_bluepencil_auth;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $bluepencil_upstream http://bluepencil:8787;
        proxy_pass $bluepencil_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # `${BLUEPENCIL_AUTH_SECRET}` (curly form on purpose) is substituted by
        # the image's envsubst template step; see frontend/Dockerfile and the
        # NGINX_ENVSUBST_FILTER note there. Never write an nginx variable in
        # `${...}` form in this file — envsubst would eat it.
        proxy_set_header x-bluepencil-auth "${BLUEPENCIL_AUTH_SECRET}";
        proxy_redirect off;
        proxy_buffering off;
    }

    # Internal-only subrequest target for the `auth_request` above. `internal`
    # makes nginx answer 404 to a direct call from outside, so this cannot be
    # used as an open session probe. The resolver is needed because the backend
    # address is a variable (`$auth_upstream`), which defers name resolution to
    # request time — the same reason as the proxied locations (backend container
    # recreation changes the IP).
    location = /_bluepencil_auth {
        internal;
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $auth_upstream http://backend:8000/api/v1/auth/me/;
        proxy_pass $auth_upstream;
        # A GET subrequest carries no body; drop it explicitly instead of
        # forwarding a Content-Length that no longer matches a body.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # `/api/v1/auth/me/` accepts the httpOnly access cookie (browser) or a
        # Bearer token (API client); forward both, nothing else.
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    # The Bluepencil browser layer itself (plan D / D1.2, RB-D04, RB-D05).
    #
    # The layer used to be baked into the image from the repository, where it was
    # served by the regex asset location below with `Cache-Control: immutable`.
    # Two things were wrong with that: a layer update forced a frontend rebuild,
    # and a stale `immutable` answer kept browsers on old bytes for a year.
    #
    # Now the directory is a read-only bind mount
    # (deploy/docker-compose.bluepencil.yml, served at this exact path) and this
    # location states the contract:
    #   * `^~` wins over the regex asset location, so the `immutable` policy
    #     below never applies to the layer, and `add_header Cache-Control
    #     "no-cache"` below is the one that takes effect;
    #   * `try_files $uri =404` replaces the SPA fallback — a missing layer asset
    #     must be a loud 404, never `index.html` with status 200. A silent 200
    #     would make the loader parse HTML as JavaScript and fail far from the
    #     cause (a forgotten `fetch-layer.sh`, or a mount that pointed nowhere).
    #   * the security snippet is included because a location with its own
    #     `add_header` inherits none (RB-D02).
    location ^~ /bluepencil/latest/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA History-API fallback: all non-file requests → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache policy for index.html: always revalidate
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Cache policy for static assets (JS, CSS, images, fonts)
    # Long-term caching since build includes hash in filenames
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Deny access to hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
