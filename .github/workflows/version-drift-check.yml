name: Version Drift Monitor (scheduled)

# Lightweight monitoring check: detects when a deployed environment's reported
# commit has fallen behind main, addressing issue #368.
#
# This is NOT a merge gate. It runs on a schedule and reports findings via
# workflow failure/notifications only (non-blocking observability).
#
# To use this workflow:
#
# 1. Set up a GitHub Actions secret named DEPLOYED_VERSION_URL pointing to your
#    deployed environment's /api/v1/version/ endpoint:
#
#      Settings -> Secrets and variables -> Actions -> New repository secret
#      Name:  DEPLOYED_VERSION_URL
#      Value: https://your-app.example.com/api/v1/version/
#
#    Or set DEPLOYED_VERSION_URL_STAGING, DEPLOYED_VERSION_URL_PRODUCTION, etc.
#    for multiple environments. Copy the job and change the secret reference.
#
# 2. The workflow will fetch the deployed version, extract the commit_short,
#    and compare it against origin/main. If the deployed commit is behind or
#    not in the history, it fails (sends a notification).
#
# 3. Operators are responsible for redeploying when notified of drift.

on:
  schedule:
    # Every day at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      deployed_url:
        description: 'Override DEPLOYED_VERSION_URL for this run (optional)'
        required: false

permissions:
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This job should not block merges; allow failures to be reported but not
    # stop the workflow from completing.
    continue-on-error: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history needed for git merge-base

      - name: Determine deployed URL
        id: url
        env:
          DISPATCH_DEPLOYED_URL: ${{ github.event.inputs.deployed_url }}
          DEPLOYED_VERSION_URL_SECRET: ${{ secrets.DEPLOYED_VERSION_URL }}
        run: |
          set -euo pipefail
          URL="$DISPATCH_DEPLOYED_URL"
          if [[ -z "$URL" ]]; then
            URL="$DEPLOYED_VERSION_URL_SECRET"
          fi

          if [[ -z "$URL" ]]; then
            printf '%s\n' 'DEPLOYED_VERSION_URL not configured. Skipping check.'
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! python3 - "$URL" <<'PY'
          import ipaddress
          import re
          import sys
          import unicodedata
          from urllib.parse import unquote, urlsplit

          def has_control(value):
              return any(
                  char.isspace() or unicodedata.category(char).startswith("C")
                  for char in value
              )

          def validate_ip(value):
              address = ipaddress.ip_address(value)
              mapped = getattr(address, "ipv4_mapped", None)
              if mapped is not None:
                  address = mapped
              if not address.is_global:
                  raise SystemExit(1)

          value = sys.argv[1]
          if not value or has_control(value):
              raise SystemExit(1)
          try:
              decoded = unquote(value, errors="strict")
          except UnicodeError:
              raise SystemExit(1)
          if has_control(decoded):
              raise SystemExit(1)
          if any(char in "\"'`;|&<>$()\\{}^" for char in decoded):
              raise SystemExit(1)
          try:
              parts = urlsplit(value)
              host = parts.hostname
              port = parts.port
          except (UnicodeError, ValueError):
              raise SystemExit(1)
          if parts.scheme != "https" or not parts.netloc or not host:
              raise SystemExit(1)
          if "@" in parts.netloc or parts.username is not None or parts.password is not None:
              raise SystemExit(1)
          authority = parts.netloc.rsplit("@", 1)[-1]
          if authority.endswith(":"):
              raise SystemExit(1)
          if port is not None and not 1 <= port <= 65535:
              raise SystemExit(1)
          normalized_host = host.rstrip(".").lower()
          if (
              normalized_host
              in {
                  "localhost",
                  "localhost.localdomain",
                  "ip6-localhost",
                  "ip6-loopback",
              }
              or normalized_host.endswith(".localhost")
          ):
              raise SystemExit(1)
          if ":" in host:
              try:
                  validate_ip(host)
              except ValueError:
                  raise SystemExit(1)
          elif re.fullmatch(r"[0-9.]+", host):
              try:
                  validate_ip(host)
              except ValueError:
                  raise SystemExit(1)
          else:
              if len(host) > 253 or not re.fullmatch(
                  r"[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?", host
              ):
                  raise SystemExit(1)
              labels = host.rstrip(".").split(".")
              if any(
                  not label
                  or len(label) > 63
                  or label.startswith("-")
                  or label.endswith("-")
                  for label in labels
              ):
                  raise SystemExit(1)
          PY
          then
            printf '%s\n' 'Invalid deployed URL.' >&2
            exit 1
          fi

          printf 'url=%s\n' "$URL" >> "$GITHUB_OUTPUT"
          printf 'skip=false\n' >> "$GITHUB_OUTPUT"

      - name: Check version drift
        if: steps.url.outputs.skip == 'false'
        env:
          DEPLOYED_VERSION_URL: ${{ steps.url.outputs.url }}
          TARGET_BRANCH: origin/main
        run: |
          chmod +x ./scripts/check-version-drift.sh
          ./scripts/check-version-drift.sh

      - name: Report skipped (no deployment URL configured)
        if: steps.url.outputs.skip == 'true'
        run: |
          echo "Skipped: DEPLOYED_VERSION_URL secret not configured."
          echo ""
          echo "To enable version drift monitoring, set up a GitHub Actions secret:"
          echo "  Settings -> Secrets and variables -> Actions"
          echo "  Secret name: DEPLOYED_VERSION_URL"
          echo "  Value: https://your-deployed-app.com/api/v1/version/"
