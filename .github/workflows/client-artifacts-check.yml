name: Client artifacts check

# Drift gate for the generated client documentation (#1171, Bundle B0, AP-1.5).
#
# clients/registry.yaml is the single source of truth; docs/clients/** is
# generated from it. This job fails on:
#   1. a hand edit of a generated file (render.py --check reports STALE),
#   2. a registry <-> shipped-snippet contradiction (transport path / literal key),
#   3. a German/English parity break,
#   4. a broken relative link inside docs/clients/**,
#   5. a lost executable bit on scripts/clients/{install,verify}.sh (#1350).
#
# Read-only, no secrets: safe on pull requests from forks.
on:
  pull_request:
    paths:
      - 'clients/**'
      - 'scripts/clients/**'
      - 'docs/clients/**'
      - 'dist/**'
      - '.claude-plugin/**'
      - 'server.json'
      - 'VERSION'
      - 'docs/agent-templates/INSTALL.md'
      - 'docs/plans/2026-10-04-one-click-client-installation.md'
      - '.github/workflows/client-artifacts-check.yml'
  push:
    branches: [main]
    paths:
      - 'clients/**'
      - 'scripts/clients/**'
      - 'docs/clients/**'
      - 'dist/**'
      - '.claude-plugin/**'
      - 'server.json'
      - 'VERSION'

permissions:
  contents: read

concurrency:
  group: client-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install renderer dependency
        run: pip install --disable-pip-version-check pyyaml
      - name: Render check (drift / parity / registry-vs-snippet)
        run: python scripts/clients/render.py --check
      - name: Claude plugin validate (pinned CLI)
        # --strict treats warnings as errors, so a manifest regression (e.g. a
        # dropped `userConfig` key, or an `.mcp.json` reference to an
        # undeclared key) fails the PR instead of an install. The CLI is
        # pinned: an unpinned install would let a future Claude release change
        # this gate without a code change here.
        #
        # The runner cannot always provide the CLI (no npm, registry outage).
        # In that case the step reports the reason in the job summary and
        # skips — visible, never a silent green. A CLI that IS present but
        # fails validation still fails the job.
        run: |
          set -euo pipefail
          CLI_VERSION="2.1.306"
          skip() {
            echo "::warning title=claude plugin validate skipped::$1"
            {
              echo "### claude plugin validate — SKIPPED"
              echo ""
              echo "Reason: $1"
              echo ""
              echo "This is a reported skip, not a passing validation."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
            exit 0
          }
          command -v npm >/dev/null 2>&1 \
            || skip "npm is not available on this runner"
          npm install -g "@anthropic-ai/claude-code@${CLI_VERSION}" \
            || skip "npm install -g @anthropic-ai/claude-code@${CLI_VERSION} failed (registry/network)"
          command -v claude >/dev/null 2>&1 \
            || skip "claude CLI is not on PATH after installing ${CLI_VERSION}"
          claude --version
          claude plugin validate --strict dist/plugins/claude-code/reqogniloom
          claude plugin validate .
      - name: Bash syntax of installer/verifier
        run: |
          set -euo pipefail
          bash -n scripts/clients/install.sh
          bash -n scripts/clients/verify.sh
      - name: Executable bits of installer/verifier (#1350)
        # The documented one-command install calls the scripts directly, so the
        # git mode must stay 100755. `chmod` alone is ineffective where the
        # checkout has core.fileMode=false (Windows), hence the index-mode check
        # and the update-index hint. Fix: git update-index --chmod=+x <path>
        run: |
          set -euo pipefail
          status=0
          for script in scripts/clients/install.sh scripts/clients/verify.sh; do
            mode="$(git ls-files -s -- "$script" | awk '{print $1}')"
            if [ "$mode" != "100755" ]; then
              echo "::error file=$script::git mode is ${mode:-<untracked>}, expected 100755 (run: git update-index --chmod=+x $script)"
              status=1
            else
              echo "ok: $script mode $mode"
            fi
          done
          exit "$status"
      - name: Relative link check in docs/clients
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          root = Path("docs/clients")
          link = re.compile(r"\]\((?!https?://|#|mailto:)([^)]+)\)")
          problems = []
          for md in sorted(root.glob("*.md")):
              for m in link.finditer(md.read_text(encoding="utf-8")):
                  target = m.group(1).split("#", 1)[0]
                  if target and not (root / target).exists():
                      problems.append(f"{md.as_posix()}: broken link -> {target}")
          if problems:
              print("\n".join(problems), file=sys.stderr)
              sys.exit(1)
          print("link check OK")
          PY
