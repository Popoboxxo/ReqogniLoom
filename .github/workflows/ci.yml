name: CI Pipeline

on:
  # PRs are the gate. A feature-branch push with an open PR used to start a
  # second, identical run (push + pull_request), doubling the queue and leaving
  # one of the two as a CANCELLED check. Keep push for main (post-merge signal).
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # SEC-08 / AUD-2026-09-137: expose this pipeline as a reusable workflow so
  # docker-publish.yml can make publishing conditional on a green CI run
  # (`needs: ci`). The push/PR triggers above are unchanged; a call reuses the
  # exact same jobs on the same ref, so "tests pass before image publish" is a
  # hard, same-run contract instead of a separate, skippable workflow run.
  workflow_call:
    # OPS-004: the publish workflow may no longer forward every secret via
    # `secrets: inherit`. Declare explicitly the one secret this pipeline uses
    # so callers must pass it and an empty value cannot silently slip through.
    secrets:
      FIELD_ENCRYPTION_KEY:
        description: "Fernet key used by the backend tests to encrypt/decrypt fields"
        required: true

# A new push to the same ref supersedes the previous run. Without this, stale
# runs keep occupying runners and their checks show up as CANCELLED (which the
# merge gate then has to explain away). Different PRs/refs keep their own runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more opt in explicitly.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

  backend-test:
    runs-on: ubuntu-latest
    # 10 min used to be enough on a warm pip cache, but set-3-mcp installs the
    # full heavy dependency set (torch/transformers/sentence-transformers,
    # multi-GB) and then runs 1286 tests. When GitHub evicts the pip cache the
    # cold install alone takes ~8.5 min and the job was killed mid-pytest by the
    # old 10-min cap (flake on PR #943). 20 min leaves headroom for the cold
    # path; the other test sets still finish in well under 8 min.
    #
    # 30 min: set-1-core crossed 20 min after the wave-0/1 suite growth. The
    # real fix is test-level (the 362 s demo-seed test now runs in 1 s), this
    # is the safety net; a hard timeout must never be the thing that "catches"
    # a slow suite because a cancelled job hides which test was running.
    timeout-minutes: 30
    strategy:
      # One failing set must not cancel the others: the per-set verdict is the
      # useful signal (and a cancelled sibling looks like an infrastructure
      # problem, not a test failure).
      fail-fast: false
      matrix:
        test-set:
          - id: set-1-core
            name: "Core Domain Logic (application, persistence)"
            paths: "application/tests persistence/tests"
            # BEWUSST SERIELL: -n 2 lief auf dem Messhost gruen (771 s -> 563 s),
            # aber in echtem CI rot. Auf Worker gw1 rollt
            # persistence/tests/test_uid_unique_constraints_1402.py::
            # test_migration_reverse_roundtrip das Schema zurueck (er ist der
            # letzte PASSED vor dem ersten FAILED); ab 45 % fehlt dort
            # "column embedding_model of relation pl_requirement", und alle
            # folgenden Tests dieses Workers scheitern. Erst wenn dieser
            # Roundtrip auf dem echten Leaf landet, ist xdist hier wieder eine
            # Option — dann xdist auf "-n 2 --dist loadfile" stellen.
            xdist: "-n 0"
          - id: set-2-api
            name: "REST API Layer (rest_api, auth_tenancy, presets, reqogniloom, test_runs)"
            paths: "attribute_definitions/tests rest_api/tests auth_tenancy/tests presets/tests reqogniloom/tests test_runs/tests"
            # Groesster Einzelset (552 s pytest): parallelisieren wie set-1-core.
            xdist: "-n 2 --dist loadfile"
          - id: set-3-mcp
            name: "MCP Server (mcp_server)"
            paths: "mcp_server/tests"
            # Noch nicht gemessen: bewusst seriell.
            xdist: "-n 0"
          - id: set-4-features
            # AUD-2026-09-193 (DOC-03): memory/tests (344), link_types/tests (141)
            # and the root tests/ suite (55) were previously matched by none of
            # the four path sets and therefore ran in no backend CI job. They are
            # cross-cutting (AI memory, link-type catalog, celery/csrf/wiring
            # smoke) and belong to this "Cross-Cutting & Features" leg. Measured
            # with `pytest --collect-only`: 540 tests that used to be dark.
            name: "Cross-Cutting & Features (llm_adapter, diagram, traceability, workflow, context_graph, se_metrics, baseline, admin_ops, icd, resilience, audit, memory, link_types, root tests)"
            paths: "llm_adapter/tests diagram/tests traceability/tests workflow/tests context_graph/tests se_metrics/tests baseline/tests admin_ops/tests icd/tests resilience/tests audit/tests memory/tests link_types/tests tests"
            # Noch nicht gemessen: bewusst seriell.
            xdist: "-n 0"

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        # Ephemeral CI database: keep PGDATA in RAM (53 transaction=True tests
        # TRUNCATE 100+ tables each; measured >300 s on a slow store vs 3.6 s
        # on tmpfs). Keep rationale comments OUTSIDE the `options: >-` string:
        # GitHub passes every token of that string verbatim to `docker create`.
        # tmpfs startup verified locally against pgvector/pgvector:pg16.
        env:
          POSTGRES_DB: reqflow_test
          POSTGRES_USER: reqflow
          POSTGRES_PASSWORD: reqflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install uv (pinned, checksum-verified)
        # uv bewusst NICHT per pip in das audited site-packages: genau das hat
        # im ersten Lauf den Job gekippt — pip-audit meldete PYSEC-2026-4321
        # fuer uv 0.13.1 (Fix 0.13.4) im selben Environment, das die
        # Backend-Abhaengigkeiten prueft. Ein Installer-Werkzeug gehoert nicht
        # in die Laufzeit-Abhaengigkeiten. Version und Checksumme gepinnt wie
        # beim gitleaks-Download.
        env:
          UV_VERSION: '0.13.4'
          UV_SHA256: '2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f'
        run: |
          set -euo pipefail
          curl -sSfL -o "${RUNNER_TEMP}/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  ${RUNNER_TEMP}/uv.tar.gz" | sha256sum -c -
          tar xzf "${RUNNER_TEMP}/uv.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/uv-x86_64-unknown-linux-gnu" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/uv-x86_64-unknown-linux-gnu/uv" --version

      - name: Install backend dependencies
        working-directory: backend
        # uv statt pip: 448 s -> 168 s kalt gemessen; --system trifft das
        # setup-python-Interpreter der folgenden Schritte.
        run: uv pip install --system --quiet -r requirements.txt

      - name: Lint backend with ruff (SA-45)
        if: matrix.test-set.id == 'set-1-core'
        working-directory: backend
        run: |
          pip install ruff==0.16.5
          echo "Running ruff linter (Pyflakes only - F rules)..."
          # H1: First merge: lint F (Pyflakes) only — detects undefined names, unused imports.
          # E/W (style) rules will be ratcheted in gradually after the codebase is clean.
          # Line-length now configured in pyproject.toml (line-length=100 matches code style).
          # Narrow scope: only real interpreter-level bugs (undefined names — the two concrete cases
          # this closed were ValidationResult/VCRMRow). Broader F401/F811/F405/F841/F541 cleanup
          # needs its own dedicated PR with careful per-file review — see
          # docs/SYSTEMAUDIT_2026-08-27_RESTPLAN.md AP-4/H1.
          ruff check . --select=F821,F822
        continue-on-error: false

      - name: Django system and migration checks
        if: matrix.test-set.id == 'set-1-core'
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: reqogniloom.settings_test
          SECRET_KEY: ci-test-secret-key
          AUTH_JWT_SECRET: ci-test-auth-jwt-secret
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1
          # Same required settings as the pytest step below: settings.py has
          # no defaults for the DB secrets, and the check command imports the
          # full settings module before it can report anything.
          DB_NAME: reqflow_test
          DB_USER: reqflow
          DB_PASSWORD: reqflow
          DB_APP_PASSWORD: ci-test-app-role-password
          DB_HOST: localhost
          DB_PORT: '5432'
          REDIS_URL: redis://localhost:6379
          LLM_PROVIDER: mock
          DEFAULT_TENANT_ID: '1'
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run pytest for ${{ matrix.test-set.id }}
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: reqogniloom.settings_test
          SECRET_KEY: ci-test-secret-key
          AUTH_JWT_SECRET: ci-test-auth-jwt-secret
          DEBUG: 'True'
          DB_NAME: reqflow_test
          DB_USER: reqflow
          DB_PASSWORD: reqflow
          # Read by migration 0048_app_role.py to create the least-privilege
          # app role (REQ-L2-PL-010) — required, no default, even though this
          # job connects as the superuser above.
          DB_APP_PASSWORD: ci-test-app-role-password
          DB_HOST: localhost
          DB_PORT: '5432'
          ALLOWED_HOSTS: localhost,127.0.0.1
          DEFAULT_TENANT_ID: '1'
          LLM_PROVIDER: mock
          # Issue #89: seed_demo refuses its built-in demo password unless this
          # explicit opt-in is set. set-1-core's application/tests/
          # test_migrate_se_docs.py provisions its fixtures via seed_demo with
          # no admin password in the environment, so it needs the opt-in here
          # (same value as testing/docker-compose.test.yml). Test-only — never
          # set in deploy/docker-compose.yml.
          SEED_DEMO_ALLOW_DEFAULT_PASSWORD: '1'
          # torch/OpenMP otherwise spawns one thread per vCPU inside a single
          # pytest process; the MCP suite used 14 cores unattended on a dev box
          # and starved itself. One thread is deterministic and fast here.
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          REDIS_URL: redis://localhost:6379
          # REQ-081 / issue #151: no Fernet key literal in the repository.
          # settings_test.py generates an ephemeral key per process when the
          # variable is unset, which is all the suite needs (encrypted columns
          # are written and read back within the same run). An optional
          # repository secret still wins if one is configured.
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
        run: pytest ${{ matrix.test-set.paths }} ${{ matrix.test-set.xdist }}

      # The pip-audit gate moved to the dedicated `dependency-audit` job
      # (DEP-AUDIT-01, fixes #153). Two things were wrong with the step that
      # used to sit here: `pip install pip-audit` was unpinned, and it audited
      # the interpreter that had just installed the tool into its own
      # site-packages (that is how the old run reported a finding against `uv`).
      # The replacement pins the tool version, runs it from a throwaway venv and
      # uses `--strict` so an unresolvable dependency fails instead of being
      # skipped over as "nothing to report".

  requirements-drift-check:
    name: "Backend Requirements Drift Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      # DEP-002: the floor must be an INDEPENDENT, CVE-derived constant. Writing
      # the gate once to a temp script lets the real check and the negative
      # self-test below exercise exactly the same code (no drift between them).
      - name: Write the independent security-floor gate
        run: |
          cat > "${RUNNER_TEMP}/check_req_floors.py" << 'PY'
          import re
          import sys

          manifest_path = sys.argv[1]

          # Independent, CVE-derived security floors. These constants are
          # deliberately maintained HERE and NOT derived from the manifest:
          # deriving a floor from requirements.txt makes the comparison
          # tautological (a downgrade would simply lower the floor too).
          # Django 6.1.3 / pytest 9.2.0 are the patched baselines recorded in
          # the S0.4 problem-analysis gate; the other floors are the existing
          # constraint checks and remain unchanged.
          DJANGO_MIN = (6, 1, 3)
          PYTEST_MIN = (9, 2, 0)

          required_floors = {
              'Django': DJANGO_MIN,
              'cryptography': (50, 0, 0),         # PYSEC-2026-3552 (pkcs7 oracle)
              'pytest': PYTEST_MIN,
              'pytest-django': (4, 14, 0),        # Must support pytest>=9 and Django>=6.1
              'sentence-transformers': (6, 0, 0), # transformers>=5.0.0 (RCE CVEs in <5.0)
          }

          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()

          failures = []

          for package, (major, minor, patch) in required_floors.items():
              pattern = rf'^{re.escape(package)}[>=].*$'
              matches = re.findall(pattern, content, re.MULTILINE | re.IGNORECASE)

              if not matches:
                  failures.append(f"[MISSING] {package} not found in {manifest_path}")
                  continue

              match_line = matches[0]

              # Parse version constraint (e.g., "Django>=6.1.3,<6.2")
              version_match = re.search(r'[>=<]+([0-9.]+)', match_line)
              if not version_match:
                  failures.append(f"[PARSE ERROR] Cannot parse version from: {match_line}")
                  continue

              constraint_version_str = version_match.group(1)
              try:
                  constraint_parts = [int(x) for x in constraint_version_str.split('.')[:3]]
                  while len(constraint_parts) < 3:
                      constraint_parts.append(0)
                  constraint_version = tuple(constraint_parts)
              except ValueError:
                  failures.append(f"[PARSE ERROR] Invalid version format in: {match_line}")
                  continue

              if constraint_version < (major, minor, patch):
                  failures.append(
                      f"[SECURITY FLOOR VIOLATION] {package}: "
                      f"requires >={major}.{minor}.{patch}, "
                      f"but constraint is {constraint_version_str}"
                  )

          if failures:
              print("DRIFT CHECK FAILED:")
              for failure in failures:
                  print(f"  {failure}")
              sys.exit(1)
          print("✓ All security-critical packages meet minimum version floors")
          PY

      - name: Validate security-critical version floors in requirements.txt
        working-directory: backend
        run: python3 "${RUNNER_TEMP}/check_req_floors.py" requirements.txt

      - name: Negative self-test — a downgraded manifest must fail the gate
        # DEP-002: prove the floor is independent of the manifest. Inject the
        # known-bad versions (Django 5.2.17, pytest 9.1.1) into a synthetic
        # copy and require the SAME gate to reject it. A gate that passes this
        # downgrade is tautological and must not protect a release.
        working-directory: backend
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          src = Path('requirements.txt').read_text(encoding='utf-8')
          src = re.sub(r'(?mi)^Django>=[^\n]*', 'Django>=5.2.17,<6.2', src)
          src = re.sub(r'(?mi)^pytest>=[^\n]*', 'pytest>=9.1.1,<10.0', src)
          assert 'Django>=5.2.17' in src, 'failed to inject downgraded Django'
          assert 'pytest>=9.1.1' in src, 'failed to inject downgraded pytest'
          Path(os.environ['RUNNER_TEMP'], 'downgraded-requirements.txt').write_text(src, encoding='utf-8')
          PY
          if python3 "${RUNNER_TEMP}/check_req_floors.py" "${RUNNER_TEMP}/downgraded-requirements.txt"; then
            echo "ERROR: downgraded manifest (Django 5.2.17 / pytest 9.1.1) passed the floor gate" >&2
            exit 1
          fi
          echo "OK: downgraded manifest rejected by the independent security floors"

  agent-templates-test:
    name: "Agent Templates & Distribution (docs/agent-templates, dist)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install test dependencies
        # cryptography is for scripts/test_setup_script.py, which validates the
        # generated FIELD_ENCRYPTION_KEY by constructing a real Fernet instance.
        run: pip install pytest pyyaml cryptography

      - name: Run pytest for docs/agent-templates, dist and repository scripts
        # RB-D18: a bare scripts/test_*.py runs in no job by default, so every
        # contract test is listed explicitly (P1-3 adds the prompt-regression
        # one, P1-4 the .gitignore/env one, D3.2/D3.3 the setup + off-host
        # backup gates).
        run: >-
          pytest docs/agent-templates dist
          scripts/test_gitignore_env.py
          scripts/test_prompt_regression_workflow.py
          scripts/test_setup_script.py
          scripts/test_check_plugin_packages.py
          scripts/test_offhost_backup_check.py
          scripts/test_check_env_example_keys.py
          scripts/test_bump_version.py
          scripts/tests/test_security_scan_config_guard.py
          scripts/tests/test_npm_audit_waivers.py
          scripts/tests/test_doc_index_freshness.py
          scripts/tests/test_internal_doc_language.py
          scripts/tests/test_doc_number_drift.py
          scripts/tests/test_se_mobile_requirements.py
          scripts/tests/test_se_frontmatter_coverage.py
          scripts/tests/test_se_review_lifecycle.py
          scripts/tests/test_normative_path_refs.py
          scripts/tests/test_adr_naming.py
          scripts/tests/test_deploy_image_pins.py
          scripts/tests/test_compose_resource_limits.py

      - name: Check .env.example covers every compose/settings key
        # #1737: a key used by Compose or read by settings.py must be documented
        # in .env.example, exactly once and never as a duplicate active value.
        run: python scripts/check_env_example_keys.py

      - name: Validate the shipped Compose files
        # Catches YAML anchor/merge mistakes (e.g. the TZ anchor) before a
        # deployment does. A throwaway .env satisfies the required secrets.
        run: |
          # HONCHO_DB_PASSWORD is a required (`:?`) variable in the base
          # Compose file; supply a throwaway value so config -q succeeds even
          # though the honcho profile is inactive (interpolation runs first).
          printf 'SECRET_KEY=ci\nDB_PASSWORD=ci\nREQOGNILOOM_VERSION=0.0.0\nHONCHO_DB_PASSWORD=ci\n' > .env
          docker compose -f deploy/docker-compose.yml --project-directory . config -q
          docker compose -f deploy/docker-compose.minimal.yml --project-directory . config -q
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.tls.example.yml --project-directory . config -q
          rm -f .env

      - name: Check version carriers
        # C8/#1662: VERSION, the frontend app package and every plugin/store
        # manifest must agree. This is the gate that would have caught the
        # beta.25 tag shipping frontend/package.json at beta.22.
        run: python scripts/check_plugin_packages.py

  # AUD-2026-09 (integrations stability, #1156): the Hermes agent plugin's
  # capture-queue suite (integrations/hermes-agent-plugin/tests) was fully
  # mocked but matched by NO CI job -- the backend-test matrix only
  # enumerates backend/<app>/tests paths, and there is no other job that
  # runs pytest outside backend/. The tests therefore asserted nothing in CI.
  # They are pure-python, dependency-free (the README documents the
  # PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 invocation), so one small job is enough.
  #
  # ENV LIMITATION this job CLOSES and does NOT close: it proves the plugin's
  # MCP envelope contract, tool names and review-queue/suggestion plumbing
  # run green deterministically. It does NOT cover a live ReqogniLoom backend,
  # real LLM provider answer quality, quota-dependent derivation transitions,
  # a live dialectic engine, or the end-to-end Celery queue (the backend
  # consolidation E2E test never runs a consuming worker either) -- those stay
  # real-provider/live-deployment territory.
  #
  # The dashboard bundle (dashboard/dist/index.js) is plain ES with no build
  # step, and two node-only checks guard it: plugin_ui_smoke.mjs (render with a
  # stub host SDK, test ids, curated tool names against the manifest) and
  # plugin_ui_flow.mjs (runs the components for real and asserts the request
  # bodies). They were documented in the plugin README but called by no job, so
  # a change that broke the tab would have passed CI; the second check is what
  # caught a defect that made 11 of the 12 create flows unusable.
  hermes-plugin-test:
    name: "Hermes Agent Plugin (integrations/hermes-agent-plugin)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Set up Node
        # Same pinned action and version as the frontend job. No npm cache: the
        # plugin has no package.json -- the checks are scripts with no
        # dependencies, run directly by node.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install test dependency
        # pytest is the only requirement: the plugin tests stub the MCP
        # envelope, the tool manifest and the review queue themselves.
        # Pinned to the backend/requirements.txt floor (pytest>=9.1.1,<10.0,
        # CVE-2025-71176 / PYSEC-2026-1845) so this job cannot resolve an
        # older, vulnerable version that the backend job refuses to run.
        run: pip install "pytest>=9.1.1,<10.0"

      - name: Run pytest for the hermes-agent-plugin suite
        # PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 is the documented repo-root
        # invocation (integrations/hermes-agent-plugin/README.md): the suite
        # must not depend on whichever pytest plugins the runner happens to
        # have installed.
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest integrations/hermes-agent-plugin/tests -q

      - name: Syntax-check the dashboard bundle
        run: node --check integrations/hermes-agent-plugin/dashboard/dist/index.js

      - name: Render the dashboard bundle against a stub host SDK
        # Fails on an undefined component, a control without data-testid, a
        # fetch during render, or a curated tool name the server does not
        # publish any more.
        run: node integrations/hermes-agent-plugin/tests/plugin_ui_smoke.mjs

      - name: Drive the dashboard components and assert the request bodies
        # Runs the components for real (hook state, dependency arrays, event
        # handlers) and checks the arguments the tab builds: only declared
        # parameters, and untouched optional fields absent rather than empty.
        run: node integrations/hermes-agent-plugin/tests/plugin_ui_flow.mjs

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npm run test

      # The npm audit gate moved to the dedicated `dependency-audit` job
      # (DEP-AUDIT-01, fixes #153): one scan, one threshold, one place to change
      # it. Running it here as well meant two npm-registry round trips per CI run
      # and two copies of the severity policy.

  # DEP-AUDIT-01 (fixes #153, docs/audit/2026-11-15-code-audit.md §4.2 + §6):
  # one reproducible dependency-audit gate covering both ecosystems.
  #
  # THRESHOLDS (deliberately different per ecosystem, see below):
  #   frontend — high/critical advisories fail the gate, moderate and below are
  #              visible in the summary but do not block. `npm audit --json`
  #              still requests `--audit-level=high`, but its exit code is now
  #              informational: a Python step parses the report and is the
  #              authority, so an active per-advisory waiver can let the step
  #              pass. NOT `--omit=dev`/`--production`: the three high/critical
  #              advisories in the 2026-11-15 audit (dompurify, undici, zod) were
  #              transitive DEV-tool dependencies, so a production-only audit
  #              would have answered "0" while those three were open.
  #   backend  — every severity. Baseline measured 2026-11-15 on main: 0 findings
  #              across 145 resolved packages, so the "high/critical only"
  #              relaxation that a non-empty baseline would require does not
  #              apply yet. pip-audit exposes NO severity at all (no CVSS field
  #              in json or cyclonedx output, no --audit-level flag); gating on
  #              severity here would require a hand-rolled CVSS parser, i.e. a
  #              DIY security heuristic that can silently mis-grade. Instead the
  #              escape hatch is explicit: a moderate/low-only advisory is waived
  #              with `--ignore-vuln <ID>` plus a one-line justification right
  #              here, which keeps the decision in the diff. Never `|| true`.
  #
  # WAIVERS — one explicit, reviewed exception policy for both ecosystems:
  #   frontend — `.github/npm-audit-waivers.json` maps ONE GHSA id to
  #              reason / owner / expires. Only advisories whose `expires` is
  #              strictly in the future are subtracted from the high/critical
  #              set; the full table still lists every finding with a `waived`
  #              column carrying the owner and expiry. An EXPIRED waiver fails
  #              the gate outright so it must be actively renewed or removed,
  #              and parse/registry errors fail closed. Guard:
  #              scripts/tests/test_npm_audit_waivers.py. Added for the
  #              dev-only picomatch ReDoS advisory GHSA-fc5q-39xc-vjpf (range
  #              '*', no fixed version), which has no production runtime path.
  #   backend  — as above: `--ignore-vuln <ID>` plus a one-line justification.
  #   NEVER weaken either gate globally: no `--audit-level=critical`, no
  #   `--omit=dev`/`--production`, no `|| true`. A waiver is the only escape
  #   hatch and it always expires.
  #
  # MERGE BLOCKING: this job is meant to be a required check — that is safe
  # because the frontend half only fails on UNWAIVED high/critical. An
  # unwaived backend finding does block: an unowned advisory should not reach
  # a merge.
  #
  # REPRODUCIBILITY: pip-audit is pinned (PIP_AUDIT_VERSION) and installed into a
  # throwaway venv, never into the environment it audits — installing the tool
  # into its own audit target is what produced the bogus `uv` finding in the old
  # set-1-core step (PYSEC-2026-4321 against uv 0.13.1, the pip-audit installer
  # of that job). `--strict` turns "dependency could not be collected" into a
  # failure instead of a silent skip (fail-closed). The pip HTTP cache keyed on
  # requirements.txt keeps the full resolution cheap; `npm audit` reads
  # frontend/package-lock.json only, so no `npm ci` — and therefore no
  # install-time lifecycle script from a transitive dependency — runs in a job
  # that talks to the npm registry.
  dependency-audit:
    name: "Dependency Audit (npm + pip-audit)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Least privilege: the audits only read the checkout and the public registries.
    permissions:
      contents: read
    env:
      # Pinned like every other tool in this file (gitleaks/actionlint/uv): a
      # floating pip-audit would make the gate's verdict drift with a tool
      # upgrade instead of with a dependency change. Bump deliberately and
      # re-measure the baseline in the same PR.
      PIP_AUDIT_VERSION: '2.10.1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Cache pip packages for the pip-audit resolution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-audit-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-audit-

      - name: Frontend - npm audit (fails on high/critical)
        working-directory: frontend
        run: |
          set -euo pipefail
          # `status` is informational: npm still exits 1 while a high advisory
          # is live, but an ACTIVE waiver must let the step pass. The Python
          # gate below is authoritative and fails closed on parse/registry
          # errors, expired waivers, and any unwaived high/critical advisory.
          status=0
          npm audit --audit-level=high --json > "${RUNNER_TEMP}/npm-audit.json" || status=$?

          python_status=0
          python3 - "${RUNNER_TEMP}/npm-audit.json" \
            "${GITHUB_WORKSPACE}/.github/npm-audit-waivers.json" \
            "${status}" \
            <<'PY' >> "${GITHUB_STEP_SUMMARY}" || python_status=$?
          """npm audit gate: fail closed on errors, waive only active GHSA ids."""
          import datetime as dt
          import json
          import pathlib
          import re
          import sys

          GHSA_RE = re.compile(r"GHSA-[0-9A-Za-z]{4}-[0-9A-Za-z]{4}-[0-9A-Za-z]{4}")
          HIGH = {"high", "critical"}

          report_path = pathlib.Path(sys.argv[1])
          waivers_path = pathlib.Path(
              sys.argv[2] if len(sys.argv) > 2 else ".github/npm-audit-waivers.json"
          )
          npm_status = int(sys.argv[3]) if len(sys.argv) > 3 else 0


          def fail(msg):
              print(f"### npm audit - frontend\n\n**Gate error:** {msg}")
              print(f"npm audit gate error: {msg}", file=sys.stderr)
              raise SystemExit(1)


          try:
              raw_report = report_path.read_text(encoding="utf-8")
          except OSError as exc:
              fail(f"No npm audit report at {report_path}: {exc}")
          if not raw_report.strip():
              fail(f"Empty npm audit report at {report_path} — audit did not run")

          try:
              data = json.loads(raw_report)
          except ValueError as exc:
              fail(f"No parsable npm audit report at {report_path}: {exc}")
          if not isinstance(data, dict) or "metadata" not in data:
              fail("npm audit report has no metadata — refusing to treat as clean")

          if "error" in data:
              fail(f"npm registry error: {data['error']}")

          # WAI-01: npm's exit code must never be discarded. A failed audit with
          # no advisories in the report (timeout/kill/OOM) is NOT a clean gate.
          if npm_status != 0 and not data.get("vulnerabilities"):
              fail(
                  f"npm audit exited {npm_status} but the report lists no "
                  "vulnerabilities — refusing to treat the gate as clean"
              )

          try:
              doc = json.loads(waivers_path.read_text(encoding="utf-8"))
          except (OSError, ValueError) as exc:
              fail(f"No parsable waiver file at {waivers_path}: {exc}")

          waivers = doc.get("waivers", {})
          if not isinstance(waivers, dict):
              fail("waiver file: 'waivers' must be an object")

          today = dt.date.today()
          active, expired = {}, {}
          for wid, waiver in sorted(waivers.items()):
              for field in ("reason", "owner", "expires"):
                  if not isinstance(waiver, dict) or not str(waiver.get(field, "")).strip():
                      fail(f"waiver {wid}: missing or empty '{field}'")
              if not GHSA_RE.fullmatch(wid):
                  fail(f"waiver {wid}: not a GHSA-shaped advisory id")
              try:
                  expiry = dt.date.fromisoformat(str(waiver["expires"])[:10])
              except ValueError as exc:
                  fail(f"waiver {wid}: invalid 'expires' date: {exc}")
              if expiry > today:
                  active[wid.lower()] = waiver
              else:
                  expired[wid] = expiry

          if expired:
              detail = ", ".join(f"{wid} (expired {exp})" for wid, exp in expired.items())
              fail(
                  f"expired waiver(s): {detail}. Renew or remove them in "
                  f"{waivers_path.name}; a waiver must have an expiry in the future."
              )

          vulns = data.get("vulnerabilities", {})
          if not isinstance(vulns, dict):
              fail("audit report: 'vulnerabilities' must be an object")

          advisories = {}
          unidentified = set()
          for pkg, entry in sorted(vulns.items()):
              for via in entry.get("via", []):
                  if not isinstance(via, dict):
                      continue
                  match = GHSA_RE.search(str(via.get("url", ""))) or GHSA_RE.search(
                      str(via.get("source", ""))
                  )
                  if not match:
                      if str(via.get("severity", "")).lower() in HIGH:
                          unidentified.add(f"{pkg}:{via.get('source')}")
                      continue
                  wid = match.group(0).upper()
                  rec = advisories.setdefault(
                      wid.lower(),
                      {
                          "severity": str(via.get("severity", "")).lower(),
                          "title": via.get("title", ""),
                          "packages": set(),
                      },
                  )
                  rec["packages"].add(pkg)
                  if str(via.get("severity", "")).lower() in HIGH:
                      rec["severity"] = "high"

          if unidentified:
              fail(
                  "high/critical finding without a GHSA id cannot be waived: "
                  + ", ".join(sorted(unidentified))
              )

          blocking = {wid for wid, rec in advisories.items() if rec["severity"] in HIGH}
          unwaived = sorted(blocking - set(active))

          meta = data.get("metadata", {})
          counts = meta.get("vulnerabilities", {})
          deps = meta.get("dependencies", {})

          print("### npm audit - frontend")
          print()
          print(
              "Gate: high/critical advisories block unless covered by an active waiver in "
              f"`{waivers_path.name}`. Expired waivers always fail. Never `|| true`."
          )
          print()
          print(
              f"Packages: {deps.get('total', 0)} (prod {deps.get('prod', 0)}, "
              f"dev {deps.get('dev', 0)}, optional {deps.get('optional', 0)})"
          )
          print()
          print("| severity | count | effect |")
          print("|---|---|---|")
          for sev in ("critical", "high", "moderate", "low", "info"):
              count = counts.get(sev, 0)
              effect = "**fails unless waived**" if sev in HIGH and count else "warn only"
              print(f"| {sev} | {count} | {effect} |")
          print()
          print(
              f"Distinct advisories: **{len(advisories)}** "
              f"({sum(1 for r in advisories.values() if r['severity'] in HIGH)} high/critical, "
              f"{len(active)} active waiver(s), {len(expired)} expired). "
              f"Unwaived high/critical: **{len(unwaived)}**."
          )


          def ids_for(pkg, seen=None):
              seen = (seen or set()) | {pkg}
              out = set()
              for via in vulns.get(pkg, {}).get("via", []):
                  if isinstance(via, str):
                      if via not in seen:
                          out |= ids_for(via, seen)
                  elif isinstance(via, dict):
                      m = GHSA_RE.search(str(via.get("url", ""))) or GHSA_RE.search(
                          str(via.get("source", ""))
                      )
                      if m:
                          out.add(m.group(0).upper())
              return out


          print()
          print("| package | severity | direct | advisory | waived |")
          print("|---|---|---|---|---|")
          for pkg, entry in sorted(vulns.items()):
              ids = sorted(ids_for(pkg))
              if not ids:
                  adv, waived = "—", "n/a"
              else:
                  parts, wparts = [], []
                  for wid in ids:
                      key = wid.lower()
                      rec = advisories.get(key, {})
                      parts.append(f"`{wid}`" + ("" if rec.get("severity") in HIGH else " (moderate)"))
                      if rec.get("severity") not in HIGH:
                          wparts.append("n/a (moderate)")
                      elif key in active:
                          w = active[key]
                          wparts.append(f"yes — {w['owner']}, {w['expires']}")
                      else:
                          wparts.append("**NO — blocking**")
                  adv, waived = "<br>".join(parts), "<br>".join(wparts)
              direct = "yes" if entry.get("isDirect") else "no"
              print(f"| `{pkg}` | {entry.get('severity','?')} | {direct} | {adv} | {waived} |")

          if active:
              print()
              print("Active waivers (narrow, expiring, per-advisory):")
              print()
              print("| advisory | owner | expires | reason |")
              print("|---|---|---|---|")
              for wid, waiver in sorted(active.items()):
                  print(f"| `{wid.upper()}` | {waiver['owner']} | {waiver['expires']} | {waiver['reason']} |")

          if unwaived:
              print()
              print(
                  "**Gate result: FAIL.** Unwaived high/critical advisory IDs: "
                  + ", ".join(f"`{w.upper()}`" for w in unwaived)
              )
              raise SystemExit(1)

          print()
          print("**Gate result: PASS** — no unwaived high/critical advisories.")
          PY

          exit "${python_status}"

      - name: Backend - pip-audit (fails on any finding)
        # Audits requirements.txt, not the runner's interpreter: pip-audit
        # resolves the file into its own temporary environment, so the venv that
        # holds the tool is never part of the audited set.
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/pip-audit-venv"
          python3 -m venv "${venv}"
          "${venv}/bin/pip" install --quiet --disable-pip-version-check \
            "pip-audit==${PIP_AUDIT_VERSION}"
          "${venv}/bin/pip-audit" --version

          status=0
          # `--strict`: a dependency that cannot be resolved or collected fails
          # the audit instead of being dropped from the result (fail-closed).
          # `--timeout 60`: the 15 s default is tuned for a laptop and produced
          # resolution timeouts against PyPI from CI.
          (cd backend && "${venv}/bin/pip-audit" \
            -r requirements.txt \
            --strict \
            --timeout 60 \
            --progress-spinner off \
            -f json \
            -o "${RUNNER_TEMP}/pip-audit.json") || status=$?

          python3 - "${RUNNER_TEMP}/pip-audit.json" <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          import pathlib
          import sys

          try:
              data = json.loads(pathlib.Path(sys.argv[1]).read_text() or "{}")
          except (OSError, ValueError) as exc:
              print(f"### pip-audit - backend\n\nNo parsable report: {exc}")
              raise SystemExit(0)

          deps = data.get("dependencies", [])
          flagged = [dep for dep in deps if dep.get("vulns")]

          print("### pip-audit - backend")
          print()
          print(f"Resolved packages audited: **{len(deps)}**")

          if not flagged:
              print()
              print("No known vulnerabilities.")
          else:
              seen = set()
              rows = []
              for dep in sorted(flagged, key=lambda item: item["name"]):
                  for vuln in dep["vulns"]:
                      key = (dep["name"], vuln["id"])
                      if key in seen:
                          continue
                      seen.add(key)
                      aliases = ", ".join(vuln.get("aliases", [])[:2])
                      fixes = ", ".join(vuln.get("fix_versions", [])[:2]) or "none published"
                      advisory = vuln["id"] + (f" ({aliases})" if aliases else "")
                      rows.append(f"| `{dep['name']}` | {dep['version']} | {advisory} | {fixes} |")
              print()
              print("| package | version | advisory | fix versions |")
              print("|---|---|---|---|")
              print("\n".join(rows))
              print()
              print(
                  "Every finding fails this gate, including moderate. If one is "
                  "moderate/low only, add `--ignore-vuln <ID>` to the pip-audit "
                  "invocation above with a one-line justification."
              )
          PY

          exit "${status}"

      - name: Upload the audit reports
        # Audit trail (DORA: change-fail rate / recovery evidence): the raw
        # reports stay attached to the run even when the gate is red.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-audit-reports
          path: |
            ${{ runner.temp }}/npm-audit.json
            ${{ runner.temp }}/pip-audit.json
          if-no-files-found: ignore

  # Plan D / D2.4 (#587, QR-S12): prompt-regression gate, ahead of Plan A WP A1.
  #
  # Deliberately LLM-free: export_promptfoo_configs renders every scenario
  # through the real resolver, and promptfoo's `echo` provider returns that
  # literal prompt (preliminary provider choice, ENT-D8 = A). A prompt change
  # that breaks an assertion therefore fails here without a model call.
  #
  # No path filter: a path-filtered Required Check stays "pending" on PRs that
  # do not touch the prompt files, which blocks every merge (index §f.2).
  #
  # Supply chain (QR-S12): the job holds `contents: read`, checks out without
  # persisted credentials, never touches `secrets.*` (the Fernet test key is
  # generated in-job and masked), and installs promptfoo from the committed
  # lockfile via `npm ci --ignore-scripts` -- never via `npx`.
  prompt-regression:
    name: "Prompt Regression (promptfoo, echo)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_DB: reqflow_test
          POSTGRES_USER: reqflow
          POSTGRES_PASSWORD: reqflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DJANGO_SETTINGS_MODULE: reqogniloom.settings_test
      SECRET_KEY: ci-test-secret-key
      AUTH_JWT_SECRET: ci-test-auth-jwt-secret
      DEBUG: 'True'
      DB_NAME: reqflow_test
      DB_USER: reqflow
      DB_PASSWORD: reqflow
      DB_APP_PASSWORD: ci-test-app-role-password
      DB_HOST: localhost
      DB_PORT: '5432'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DEFAULT_TENANT_ID: '1'
      LLM_PROVIDER: mock

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-promptfoo-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Generate an ephemeral Fernet test key
        # No `secrets.*` in this job (QR-S12). A fresh per-run key is enough:
        # the job only reads factory-default prompt rows.
        run: |
          set -euo pipefail
          KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          echo "::add-mask::${KEY}"
          echo "FIELD_ENCRYPTION_KEY=${KEY}" >> "${GITHUB_ENV}"

      - name: Run Django migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Validate the prompt case set (export --check)
        working-directory: backend
        run: python manage.py export_promptfoo_configs --check

      - name: Render the promptfoo configs
        working-directory: backend
        run: python manage.py export_promptfoo_configs --out ../promptfoo/generated

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: promptfoo/package-lock.json

      - name: Install promptfoo from the lockfile
        # `--ignore-scripts`: no install-time lifecycle script from a
        # transitive dependency runs with the job's token (QR-S12).
        run: npm ci --ignore-scripts --prefix promptfoo

      - name: Evaluate the rendered prompts (LLM-free)
        # No `--fail-on-error`: the flag does not exist in promptfoo; the CLI
        # exits 100 on a failed test and 1 on an execution error, and either
        # one turns the step red.
        env:
          PROMPTFOO_DISABLE_TEMPLATING: "true"
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          PROMPTFOO_DISABLE_UPDATE: "1"
        # One eval per generated config. promptfoo evaluates the cross-product
        # of prompts x tests inside a config, so the exporter emits exactly one
        # (prompt, test) pair per file; merging the files back would recreate
        # the false failures (1,341/1,444 in the first CI run).
        run: |
          set -o pipefail
          mkdir -p promptfoo/results
          status=0
          for config in promptfoo/generated/*.promptfooconfig.yaml; do
            name="$(basename "$config" .promptfooconfig.yaml)"
            promptfoo/node_modules/.bin/promptfoo eval \
              -c "$config" --no-cache --no-share \
              -o "promptfoo/results/${name}.json" || status=1
          done
          exit "$status"

      - name: Upload generated configs and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: promptfoo-regression
          path: |
            promptfoo/generated
            promptfoo/results
          if-no-files-found: ignore

  # W1: actionlint gate over the workflow files. No path arguments: implicit
  # discovery collects every file in .github/workflows, so a new workflow
  # cannot slip past a stale hard-coded list. Discovery resolves the project
  # root, which actions/checkout provides via .git. The image is pinned by
  # digest (not a floating tag) so the CI verdict cannot drift from the local
  # `docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:... -color`
  # command -- the args below are exactly that command's arguments. Digest
  # resolved with `docker pull` + `docker image inspect`; bump version and
  # digest together when upgrading. No rule is ignored here on purpose --
  # see docs/se/reports/deep_audit/system-audit-2026-09/09-evidence-register.md.
  workflow-lint:
    name: "Workflow Lint (actionlint)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Least privilege: linting only reads the checked-out workflow files.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint GitHub Actions workflows with actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  # ADR-012 / DATA-01: a backup is only proven by restoring it. This job runs
  # deploy/verify-restore.sh, which produces a dump with the REAL inlined
  # `postgres-backup` command block and restores it atomically
  # (psql --single-transaction) into an isolated throwaway Postgres. It asserts
  # 15/15 tables, 0 errors, and that an injected error rolls back to zero
  # tables. Requires only docker + bash + python3, all present on the runner.
  restore-smoke:
    name: "Restore Smoke Gate (ADR-012)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least privilege: the smoke only reads compose/checkout and runs docker.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create compose env file
        # deploy/docker-compose.yml declares `env_file: .env`; Docker Compose
        # resolves it against --project-directory (the repo root) and treats a
        # missing file as fatal. CI has no .env (gitignored), so materialise it
        # from the tracked example before the smoke parses the Compose model.
        run: cp .env.example .env

      - name: Run atomic restore smoke
        # Defence-in-depth: the exec bit is also set (git mode 100755), but
        # invoking via `bash` cannot fail with exit 126 on a checkout that
        # dropped the bit (e.g. a filesystem/export that loses POSIX modes).
        run: bash deploy/verify-restore.sh

  # Plan D / D1.0 (RB-D02, QR-S17): prove that every nginx response carries the
  # security headers. A throwaway nginx serves a synthetic SPA from the real
  # `frontend/nginx.conf` + the shared snippet; the check script asserts CSP,
  # X-Frame-Options, nosniff and Referrer-Policy on `/`, a deep link, a real
  # `.js` asset and `/healthz`.
  #
  # `frontend/nginx.conf` is mounted read-only as the final config — the same
  # file the production image ships.
  #
  # The second container is the negative case: its snippet has
  # `script-src ... 'unsafe-inline'`, so the script MUST exit non-zero. If it
  # exits 0 the hardening gate is broken and the job fails.
  #
  # No path filter: a path-filtered Required Check stays "pending" on unrelated
  # PRs (index §f.2). Both smoke containers are built from the exact
  # `FROM nginx:*@sha256:*` of frontend/Dockerfile, resolved at runtime, so the
  # gate cannot drift from the production image (DEP-004).
  nginx-headers-smoke:
    name: "nginx Security Headers Smoke (D1.0)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve nginx image from the production Dockerfile (DEP-004)
        id: nginx-pin
        run: |
          set -euo pipefail
          # Exactly one digest-pinned nginx FROM must exist; ambiguity would
          # make the smoke result meaningless.
          pins="$(grep -E '^FROM nginx:[^[:space:]]+@sha256:[0-9a-f]{64}([[:space:]]|$)' frontend/Dockerfile || true)"
          count="$(printf '%s\n' "$pins" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one pinned nginx FROM in frontend/Dockerfile, found ${count}" >&2
            exit 1
          fi
          image="$(printf '%s\n' "$pins" | awk '{print $2}')"
          case "$image" in
            nginx:*@sha256:*) ;;
            *) echo "resolved image is not a digest-pinned nginx reference: ${image}" >&2; exit 1 ;;
          esac
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "nginx smoke image resolved from frontend/Dockerfile: ${image}"

      - name: Assert smoke image digest matches the production pin (DEP-004)
        env:
          SMOKE_IMAGE: ${{ steps.nginx-pin.outputs.image }}
        run: |
          set -euo pipefail
          # Re-derive the pin independently and compare with the value both
          # smoke containers will actually use. Any drift fails the gate.
          dockerfile_pin="$(grep -E '^FROM nginx:[^[:space:]]+@sha256:[0-9a-f]{64}' frontend/Dockerfile | awk '{print $2}')"
          if [ "${dockerfile_pin}" != "${SMOKE_IMAGE}" ]; then
            echo "nginx digest mismatch: Dockerfile=${dockerfile_pin} smoke=${SMOKE_IMAGE}" >&2
            exit 1
          fi
          echo "OK: smoke containers use the production nginx pin (${SMOKE_IMAGE})"

      - name: Build the synthetic docroot
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/www/assets"
          printf '<!doctype html><html><body><div id="root"></div><script src="/assets/a.js"></script></body></html>\n' \
            > "${RUNNER_TEMP}/www/index.html"
          printf 'console.log("header smoke");\n' > "${RUNNER_TEMP}/www/assets/a.js"
          # check-nginx-headers.sh also probes /manifest.webmanifest and /sw.js.
          # Ship the real manifest so its exact-location headers (explicit MIME,
          # no-cache) are exercised; a minimal dummy worker is enough because the
          # smoke test checks status/headers only, not service-worker behaviour.
          cp frontend/public/manifest.webmanifest "${RUNNER_TEMP}/www/manifest.webmanifest"
          printf 'self.addEventListener("install", function(){});\n' > "${RUNNER_TEMP}/www/sw.js"

      - name: Start nginx with the real config
        run: |
          set -euo pipefail
          docker run -d --name nginx-headers \
            -p 8080:8080 \
            -v "${PWD}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "${PWD}/frontend/nginx-security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" \
            -v "${RUNNER_TEMP}/www:/usr/share/nginx/html:ro" \
            ${{ steps.nginx-pin.outputs.image }}

      - name: Validate the nginx configuration
        # The rendered config only exists once the entrypoint's envsubst step has
        # run, so wait for it instead of racing `docker run -d` (a too-early
        # exec would either find no include or test the base image's stub).
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if docker exec nginx-headers test -s /etc/nginx/conf.d/default.conf; then
              break
            fi
            sleep 1
          done
          docker exec nginx-headers nginx -t

      - name: Wait for nginx
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "nginx did not become reachable on :8080" >&2
          docker logs nginx-headers >&2
          exit 1

      - name: Check the security headers
        run: bash frontend/scripts/check-nginx-headers.sh http://localhost:8080

      - name: Negative case — a snippet with 'unsafe-inline' must fail the gate
        run: |
          set -euo pipefail
          sed "s/script-src 'self'/script-src 'self' 'unsafe-inline'/" \
            frontend/nginx-security-headers.conf \
            > "${RUNNER_TEMP}/negative-headers.conf"
          grep -q "'unsafe-inline'" "${RUNNER_TEMP}/negative-headers.conf"

          docker run -d --name nginx-headers-negative \
            -p 8081:8080 \
            -v "${PWD}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "${RUNNER_TEMP}/negative-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" \
            -v "${RUNNER_TEMP}/www:/usr/share/nginx/html:ro" \
            ${{ steps.nginx-pin.outputs.image }}

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8081/healthz >/dev/null; then
              ready=1
              break
            fi
            ready=0
            sleep 1
          done
          if [ "${ready:-0}" -ne 1 ]; then
            echo "negative-case nginx did not become reachable on :8081" >&2
            docker logs nginx-headers-negative >&2
            exit 1
          fi

          set +e
          bash frontend/scripts/check-nginx-headers.sh http://localhost:8081
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "negative case did not fail: the CSP hardening gate is broken" >&2
            exit 1
          fi
          echo "negative case failed as expected (exit ${status})"

      - name: Remove the smoke containers
        if: always()
        run: |
          docker rm -f nginx-headers nginx-headers-negative 2>/dev/null || true

  # SECTRACK-03 + OPS-003/SEC-006 + S0.1/R1: reproducible secret-scan backstop.
  # gitleaks 8.30.1 (pinned, sha256-verified) runs FOUR blocking scans:
  #   1. working tree (`dir`)  --enable-rule reqlo-api-key
  #   2. full git history (`git`) --enable-rule reqlo-api-key
  #   3. PR diff (`git --log-opts`) --enable-rule env-secret-assignment
  #   4. DEFAULT rule set (no --enable-rule) over BOTH full history and the
  #      working tree -- this is the OPS-003 fix: with only --enable-rule every
  #      built-in detector (AWS/GitHub/PEM/...) was silently disabled.
  #
  # Scans 1-3 are DEDICATED custom-rule gates and use .gitleaks-dedicated.toml
  # (useDefault = false, NO global allowlists). Scan 4 uses the allowlisted
  # .gitleaks.toml. The split is required by review finding R1: gitleaks applies
  # global allowlists to custom rules too, so sharing one config let the
  # default-rule exemptions hollow scans 1-3. Local evidence (counts/rule ids/
  # paths only, fully redacted): docs/audit/2026-11-17-s01-gitleaks-evidence.md.
  #
  # The canary step proves every rule id and the default detectors stay live;
  # a separate expiry step (S0.1/R2) fails after 2026-12-01 if the TEMP SEC-001
  # allowlist is still present. 0 findings is a hard requirement for every scan
  # (--exit-code 1).
  secret-scan:
    name: "Secret Scan (gitleaks 8.30.1)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least privilege: the scan only reads the checked-out repository.
    permissions:
      contents: read
    # Single source of truth for the rule ids: the canary step and every
    # blocking scan below read the same variables, so the canary cannot drift
    # away from what the gate actually enables (W0-04).
    env:
      REQLO_API_KEY_RULE: reqlo-api-key
      ENV_SECRET_RULE: env-secret-assignment

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history is required for the `gitleaks git` history scan.
          fetch-depth: 0

      - name: Install gitleaks (pinned 8.30.1, sha256-verified)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          curl -sSfL "$URL" -o "/tmp/${ARCHIVE}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/${ARCHIVE}" | sha256sum -c -
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: "Canary: prove each --enable-rule id is live (W0-04)"
        # A rule id that resolves to nothing makes every scan below exit 0
        # (silently green). This step feeds each enabled id a value it MUST
        # report, and then asserts the report actually names that rule — a
        # non-zero exit alone is not proof, because gitleaks also exits
        # non-zero when the id is unknown (FTL "not found in rules").
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT

          canary() {
            rule="$1"
            value="$2"
            scan="${work}/scan-${rule}"
            report="${work}/report-${rule}.json"
            mkdir -p "${scan}"
            printf '%s\n' "${value}" > "${scan}/canary.txt"

            rc=0
            # R1: prove the rule under the SAME config the dedicated gates use.
            # .gitleaks-dedicated.toml has no global allowlists, so the canary
            # must resolve and report even in an allowlisted path (asserted in
            # the R1 regression canary below).
            gitleaks dir "${scan}" --config .gitleaks-dedicated.toml \
              --enable-rule "${rule}" --exit-code 1 --redact --no-banner \
              --report-format json --report-path "${report}" || rc=$?

            if [ "${rc}" -eq 0 ]; then
              echo "::error::Rule '${rule}' did not report its canary (exit 0) -- the enabled rule is inert (fail-open)"
              exit 1
            fi
            if ! python3 - "${report}" "${rule}" <<'PY'
          import json
          import sys

          try:
              findings = json.load(open(sys.argv[1]))
          except (OSError, ValueError):
              sys.exit(1)
          sys.exit(0 if any(f.get("RuleID") == sys.argv[2] for f in findings) else 1)
          PY
            then
              echo "::error::Rule '${rule}' exited ${rc} without a '${rule}' finding -- the id does not resolve to that rule"
              exit 1
            fi
            echo "Canary OK: '${rule}' resolved and reported its canary"
          }

          # Both canary values are assembled at run time on purpose: a literal
          # `reqlo_<40 alnum>` or `SECRET_KEY=<12+ chars>` in this file would
          # be reported by the repository's own scans (dir / PR-diff gate).
          #
          # 40 alphanumerics after `reqlo_` (the rule's exact boundary). The
          # pattern is mixed-case so the inherited default allowlist (which
          # compares case-sensitively) cannot swallow the canary.
          api_key_canary="reqlo_$(printf 'Zx9Qm2Lp7Rt4Wv8N%.0s' $(seq 1 3) | cut -c1-40)"
          canary "${REQLO_API_KEY_RULE}" "${api_key_canary}"
          # A value of 12+ non-whitespace chars under a secret-shaped name.
          # It must be high-entropy: `useDefault = true` inherits gitleaks'
          # global allowlist, whose stopwords (e.g. `aaaaaa`) suppress
          # repeated-character dummies -- such a canary would exit 0 and be
          # misread as an inert rule.
          env_secret_var="SECRET_KEY"
          env_secret_value="Zx9Qm2Lp7Rt4Wv8N"
          canary "${ENV_SECRET_RULE}" "${env_secret_var}=${env_secret_value}"

          # R1 regression (negative test for the config split): place the same
          # live-shaped token in a path that .gitleaks.toml GLOBALLY allowlists
          # (docs/*.md, entry #3). The dedicated config has no global
          # allowlists, so it MUST still report it. If this flips, the gates are
          # no longer split and the original hollowing bug has returned.
          # (The complementary assertion -- that the allowlisted config DOES
          # suppress this fixture -- is pinned by the offline guard test and
          # the redacted evidence under docs/audit/.)
          r1_dir="${work}/r1-allowlisted-path"
          r1_report="${work}/r1-report.json"
          mkdir -p "${r1_dir}/docs"
          printf 'doc example: %s\n' "${api_key_canary}" > "${r1_dir}/docs/canary.md"

          rc=0
          gitleaks dir "${r1_dir}" --config .gitleaks-dedicated.toml \
            --enable-rule "${REQLO_API_KEY_RULE}" --exit-code 1 --redact --no-banner \
            --report-format json --report-path "${r1_report}" || rc=$?
          if [ "${rc}" -eq 0 ]; then
            echo "::error::R1 regression: reqlo token in an allowlisted path was NOT reported by the dedicated config"
            exit 1
          fi
          if ! python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if any(f.get("RuleID")==sys.argv[2] for f in d) else 1)' "${r1_report}" "${REQLO_API_KEY_RULE}"; then
            echo "::error::R1 regression: dedicated config did not report the reqlo-api-key RuleID"
            exit 1
          fi

          echo "R1 regression OK: reqlo in an allowlisted path is still reported by the dedicated config"

          # OPS-003 / SEC-006: the two canaries above only prove the custom ids
          # work UNDER --enable-rule; they say nothing about the built-in
          # detectors that the fourth gate relies on. Feed a default-rule scan
          # a non-`reqlo` secret (a GitHub PAT and a PEM private-key header)
          # plus the two custom shapes, run with NO --enable-rule, and assert
          # that ALL FOUR rule ids are reported. A built-in detector that has
          # been disabled by a config regression therefore fails the canary.
          # The high-entropy values are assembled at run time; the PEM header
          # is a public, well-known marker (not a credential). The historical
          # canary/fixture lines in this path are covered by the narrow
          # .github/workflows/ allowlist entry in .gitleaks.toml.
          default_scan="${work}/default-scan"
          default_report="${work}/default-report.json"
          mkdir -p "${default_scan}"
          {
            printf 'reqlo_%s\n' "$(printf 'Zx9Qm2Lp7Rt4Wv8N%.0s' $(seq 1 3) | cut -c1-40)"
            printf '%s=%s\n' "${env_secret_var}" "${env_secret_value}"
            printf 'ghp_%s\n' 'Ab12Cd34Ef56Gh78Ij90Kl12Mn34Op56Qr78'
            printf '%s\n' '-----BEGIN RSA PRIVATE KEY-----'
            printf '%s\n' 'MIIEowIBAAKCAQEAtestkeymaterialforthecanary-----END RSA PRIVATE KEY-----'
          } > "${default_scan}/canary.txt"

          rc=0
          gitleaks dir "${default_scan}" --config .gitleaks.toml \
            --exit-code 1 --redact --no-banner \
            --report-format json --report-path "${default_report}" || rc=$?
          if [ "${rc}" -eq 0 ]; then
            echo "::error::Default-rule scan did not report any canary (exit 0) -- built-in detectors inert (fail-open)"
            exit 1
          fi
          if ! python3 - "${default_report}" <<'PY'
          import json
          import sys

          try:
              findings = json.load(open(sys.argv[1]))
          except (OSError, ValueError):
              sys.exit(1)
          # Built-in default rules must fire on the non-reqlo canaries; the
          # two custom rules must still be present in the default rule set.
          required = {"reqlo-api-key", "env-secret-assignment", "github-pat", "private-key"}
          reported = {f.get("RuleID") for f in findings}
          missing = required - reported
          if missing:
              print("missing default-rule canary findings: " + ",".join(sorted(missing)))
              sys.exit(1)
          PY
          then
            echo "::error::Default-rule scan did not report all required canary rule ids -- a detector is inert"
            exit 1
          fi
          echo "Default-rule canary OK: built-in (github-pat, private-key) and custom (reqlo-api-key, env-secret-assignment) detectors reported"

      - name: Scan working tree (gitleaks dir)
        # R1: dedicated gates use the no-allowlist config so a reqlo token in
        # any path (docs, tests, ...) is still reported.
        run: gitleaks dir . --config .gitleaks-dedicated.toml --enable-rule "$REQLO_API_KEY_RULE" --redact --exit-code 1

      - name: Scan full git history (gitleaks git)
        # R1: dedicated gates use the no-allowlist config.
        run: gitleaks git . --config .gitleaks-dedicated.toml --enable-rule "$REQLO_API_KEY_RULE" --redact --exit-code 1

      - name: Scan PR diff for env secrets
        # Plan D / D2.6 (QR-S03, KA-D-03): third, BLOCKING gate. The two steps
        # above only know the `reqlo_` key pattern, so a literal
        # `SECRET_KEY=...` / `AUTH_JWT_SECRET=...` / `*_PASSWORD=...` line
        # entering a commit stayed invisible. This step enables only the
        # `env-secret-assignment` rule and scans the PR's diff, so historical
        # fixtures and placeholder docs never turn it red. Runs on branch pushes
        # and pull requests; a tag push has no meaningful "before" (null SHA)
        # and would scan the whole history, firing on those fixtures, so tags
        # are skipped — their commits were already scanned when pushed to main.
        if: github.ref_type != 'tag'
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --prune origin \
              "+refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
            RANGE="origin/${PR_BASE_REF}..HEAD"
          elif [ -n "${PUSH_BEFORE_SHA}" ] \
            && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${PUSH_BEFORE_SHA}..HEAD"
          else
            # First push of a branch: `before` is the null SHA, so scan HEAD.
            RANGE="HEAD"
          fi
          echo "Scanning ${RANGE} for literal env-secret assignments"
          # R1: dedicated config (no global allowlists) for all custom gates.
          gitleaks git . --config .gitleaks-dedicated.toml \
            --enable-rule "${ENV_SECRET_RULE}" \
            --log-opts="${RANGE}" \
            --redact --exit-code 1

      - name: "Scan default rules - full history + working tree (OPS-003)"
        # OPS-003 / SEC-006: the three scans above are all scoped with
        # --enable-rule, which restricts gitleaks to ONLY that rule and
        # disables every built-in detector (AWS/GitHub/PEM/generic keys).
        # This fourth BLOCKING step runs the default rule set (no
        # --enable-rule) over BOTH the full git history and the working tree,
        # so a committed AWS key or PEM private key can no longer pass CI
        # green. Known fixtures are exempted by narrow, reasoned [[allowlists]]
        # in .gitleaks.toml (this file is used ONLY by this gate and the
        # default-rule canary; the dedicated gates use .gitleaks-dedicated.toml
        # and are unaffected by these allowlists). The canary step re-proves
        # the detectors at CI time. Runs on every ref (incl. tags) -- 0
        # findings is a hard gate. Redacted local evidence (counts / rule ids /
        # paths, no secret values): docs/audit/2026-11-17-s01-gitleaks-evidence.md.
        run: |
          set -euo pipefail
          echo "Default-rule scan: working tree (gitleaks dir)"
          gitleaks dir . --config .gitleaks.toml --redact --exit-code 1
          echo "Default-rule scan: full git history (gitleaks git)"
          gitleaks git . --config .gitleaks.toml --redact --exit-code 1

      - name: "SEC-001 temp allowlist expiry guard (remove by 2026-12-01)"
        # S0.1/R2: the TEMP SEC-001 [[allowlists]] entry in .gitleaks.toml
        # suppresses the historical committed-.env findings until the
        # user-blocked rotation + history rewrite land. It must not become
        # permanent. From REMOVAL_DATE onward this step fails the gate while
        # the entry still exists, forcing both the rotation and the deletion
        # of the allowlist. Remove this step together with that entry.
        env:
          REMOVAL_DATE: '2026-12-01'
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          marker='description = "TEMP SEC-001 committed .env - owner: devops-engineer'
          if [ "${today}" \> "${REMOVAL_DATE}" ]; then
            if grep -Fq "${marker}" .gitleaks.toml; then
              echo "::error::SEC-001 temporary gitleaks allowlist expired on ${REMOVAL_DATE} (today ${today}) -- rotation + history rewrite must land and the allowlist must be removed" >&2
              exit 1
            fi
          fi
          echo "SEC-001 temp allowlist expiry OK (removal deadline ${REMOVAL_DATE}, today ${today})"

  # OPS-002: the E2E suite must be part of the CI gate. Before this job,
  # docker-publish.yml's `needs: ci` did not include Playwright at all (it was
  # a separate workflow), so a red E2E run did not block a release. Calling the
  # reusable playwright.yml here makes "tests pass before publish" a hard,
  # same-ref contract. fail-fast, shards, check names and globalTimeout are
  # owned by playwright.yml and are intentionally unchanged.
  e2e-gate:
    name: "E2E gate (Playwright, reusable)"
    uses: ./.github/workflows/playwright.yml
    secrets:
      FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}

  # OPS-004 / OPS-002: guard the wiring itself. A regression to blanket secret
  # inheritance, a declaration/reference mismatch, or removal of the E2E call
  # must fail CI instead of silently weakening the release gate.
  release-gate-wiring:
    name: "Release gate wiring (OPS-002 / OPS-004)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Release gate wiring must not use secrets: inherit"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import re
          import sys

          errors = []

          # (a) No workflow under .github/workflows/ may forward every secret
          # via `secrets: inherit`. Comment lines are ignored, and the pattern
          # below is written so this guard's own source lines (which contain
          # the token) never match it: they do not begin with `secrets:`.
          inherit_re = re.compile(r'^\s*secrets\s*:\s*inherit\b')
          paths = sorted(
              glob.glob('.github/workflows/*.yml')
              + glob.glob('.github/workflows/*.yaml')
          )
          if not paths:
              errors.append('no workflow files found under .github/workflows/')
          for path in paths:
              with open(path, encoding='utf-8') as fh:
                  for lineno, line in enumerate(fh, 1):
                      if line.lstrip().startswith('#'):
                          continue
                      if inherit_re.match(line):
                          errors.append(
                              f'{path}:{lineno}: {line.strip()} uses secrets: inherit'
                          )

          # (b) The e2e-gate reusable call must map FIELD_ENCRYPTION_KEY
          # explicitly rather than inheriting the whole secret store.
          with open('.github/workflows/ci.yml', encoding='utf-8') as fh:
              lines = fh.read().splitlines()
          start = next(
              (i for i, ln in enumerate(lines)
               if re.match(r'^  e2e-gate:\s*$', ln)),
              None,
          )
          if start is None:
              errors.append('e2e-gate job not found in ci.yml')
          else:
              end = len(lines)
              for i in range(start + 1, len(lines)):
                  if re.match(r'^  [A-Za-z0-9_-]+:\s*$', lines[i]):
                      end = i
                      break
              block = '\n'.join(lines[start:end])
              if inherit_re.search(block):
                  errors.append('e2e-gate uses secrets: inherit')
              if not re.search(
                  r'^\s*FIELD_ENCRYPTION_KEY\s*:\s*'
                  r'\$\{\{\s*secrets\.FIELD_ENCRYPTION_KEY\s*\}\}\s*$',
                  block,
                  re.M,
              ):
                  errors.append(
                      'e2e-gate does not map FIELD_ENCRYPTION_KEY explicitly'
                  )

          if errors:
              print('RELEASE GATE WIRING FAILED:', file=sys.stderr)
              for err in errors:
                  print(f'  {err}', file=sys.stderr)
              sys.exit(1)
          print(
              f'OK: no secrets: inherit across {len(paths)} workflows; '
              'e2e-gate maps FIELD_ENCRYPTION_KEY explicitly'
          )
          PY

      - name: Declared reusable secrets must equal referenced secrets
        run: |
          python3 - <<'PY'
          import re
          import sys

          with open('.github/workflows/ci.yml', encoding='utf-8') as fh:
              lines = fh.read().splitlines()

          declared = {}       # secret name -> required flag
          current = None
          in_wc = False
          in_secrets = False
          for line in lines:
              if not in_wc:
                  if re.match(r'^  workflow_call:\s*$', line):
                      in_wc = True
                  continue
              # Leaving the `on.workflow_call` subtree entirely.
              if line.strip() and not line.startswith('    '):
                  break
              if re.match(r'^    secrets:\s*$', line):
                  in_secrets = True
                  continue
              if not in_secrets:
                  continue
              m = re.match(r'^      ([A-Za-z_][A-Za-z0-9_]*):\s*$', line)
              if m:
                  current = m.group(1)
                  declared[current] = False
                  continue
              m = re.match(r'^        required:\s*(true|false)\s*$', line)
              if m and current:
                  declared[current] = m.group(1) == 'true'

          all_text = '\n'.join(lines)
          referenced = set(re.findall(r'\bsecrets\.([A-Za-z_][A-Za-z0-9_]*)', all_text))

          errors = []
          if not declared:
              errors.append('no secrets declared under on.workflow_call')
          if set(declared) != referenced:
              errors.append(f"declared={sorted(declared)} referenced={sorted(referenced)} differ")
          for name, required in declared.items():
              if not required:
                  errors.append(f'{name} is not declared with required: true')

          if errors:
              print('RELEASE GATE WIRING FAILED:')
              for err in errors:
                  print(f'  {err}', file=sys.stderr)
              sys.exit(1)
          print(f"OK: declared and referenced secrets match ({sorted(declared)})")
          PY

      - name: E2E must be a reusable job inside the CI gate
        run: |
          set -euo pipefail
          grep -qE 'uses:[[:space:]]*\./\.github/workflows/playwright\.yml' .github/workflows/ci.yml
          grep -qE '^[[:space:]]*workflow_call:' .github/workflows/playwright.yml
          echo "OK: playwright.yml is callable and called by ci.yml"
