variables:
  PROJECT_NAME: ReqogniLoom
  PROJECT_DESCRIPTION: AI-natives Requirements- und Test-Management-Tool mit MBSE-kompatibler
    Artefakt-Zerlegung, REST API + nativem MCP Server (11 Tool-Gruppen, 40+ Tools),
    LLM-Adapter (Anthropic/OpenAI/Ollama/mock), Multi-Tenancy mit Row-Level-Isolation,
    8 Trace-Link-Typen, Baselines (3 Scopes), 3 Rigor-Presets (minimal/standard/extended)
    und i18n (DE/EN).
  PROJECT_GOAL: Anforderungen und Tests in Artefakten verwalten — von leichtgewichtigen
    Backlogs (Minimal-Rigor) bis zu formalen Systems-Engineering-Workflows (Extended-Rigor)
    mit V-Modell-Traceability (L0 Stakeholder Needs → L1 System Requirements → L2
    Subsystems → L3 Components → L4 Presentation). Eine Codebasis, drei Rigor-Presets.
  PLATFORM: 'Django 4.2+ (Backend) + React 18 + TypeScript 5.5+ (Frontend) + PostgreSQL
    16 (Django ORM) + Redis 7 (Cache/Celery-Broker) + Celery 5.3+ (Async) + Docker
    Compose (5 Services: postgres, redis, backend, celery, frontend)'
  RUNTIME: 'Python 3.x (im Container: Django 4.2+, DRF 3.15+, drf-spectacular, psycopg2-binary,
    celery, redis, reportlab) + Node.js >= 18 (nur für E2E mit Playwright; Vite-Dev-Server
    läuft im Container) + Vite 5.4+ Dev-Server'
  PROJECT_LANGUAGES: Python 3.x (Backend, Tests mit pytest) + TypeScript 5.5+ (Frontend,
    strict mode) + YAML (Config, Docker-Compose, OpenAPI) + Bash (Dev-Commands, Docker-Entrypoints)
  LANGUAGE: Python 3.x + TypeScript 5.5+ (strict) + YAML + Bash
  COMMUNICATION_LANGUAGE: Deutsch
  USER_INPUT_LANGUAGE: Deutsch
  DOCS_LANGUAGE: Englisch
  INTERNAL_DOCS_LANGUAGE: Deutsch
  CODE_LANGUAGE: Englisch
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/Popoboxxo/ReqogniLoom.git
  GIT_MAIN_BRANCH: main
  BUILD_COMMAND: docker-compose build
  TEST_COMMAND: pytest (Backend) + npm test (Frontend)
  DEV_COMMANDS: 'docker-compose build

    docker-compose up

    '
  TEST_COMMANDS: 'docker-compose exec backend pytest

    docker-compose exec frontend npm test

    '
  BUILD_COMMANDS: docker-compose build
  DEV_STACK_START: docker-compose up
  DEV_STACK_RELOAD: docker-compose restart (oder Hot Reload je nach Service)
  PROJECT_CONTEXT: 'ReqogniLoom ist ein AI-natives Requirements- und Test-Management-Tool
    mit MBSE-Unterstützung. Tech-Stack: Django 4.2+ (Backend) + React 18 + TypeScript
    (Frontend) + PostgreSQL 16 + Redis 7 + Celery 5.3+ + Docker Compose. Schnittstellen:
    REST API unter /api/v1/ (DRF, 16 ViewSets + 2 APIViews, JWT-Auth, OpenAPI via
    drf-spectacular) und nativer MCP Server unter /mcp/ (JSON-RPC 2.0, Transports:
    HTTP, SSE, stdio; 11 Tool-Gruppen mit 40+ Tools; API-Key `reqlo_*`). Fähigkeiten:
    Requirements Management, Architecture Elements (MBSE-kompatibel), Test-Management,
    8 Trace-Link-Typen, Baselines (3 Scopes) mit Diff-Engine, Artifact-Diff (feld-level),
    History-Endpoint, PDF-Report-Export, Test-Run-Protokollierung, CSV-Bulk-Import,
    API-Key-Management, Visual Artifact Diff, 3 Rigor-Presets (Minimal/Standard/Extended),
    Terminology-Profile (dev_mode/se_mode), Audit-Log, Multi-Tenancy via Row-Level-Security.
    LLM-Adapter: Anthropic, OpenAI, Ollama, mock (Default: mock).'
  ARCHITECTURE: "backend/\n  manage.py                              # Django Entry-Point\n\
    \  reqogniloom/settings.py                    # Konfiguration (DRF, Auth, Apps,\
    \ Celery)\n  reqogniloom/urls.py                        # URL-Routing (/api/v1/,\
    \ /mcp/, /admin/)\n  persistence/                           # Layer 0 Foundation\
    \ (TenantScopedModel, AuditableModel)\n  auth_tenancy/                       \
    \   # Layer 0 (JWT-Auth, RBAC, TenantContext)\n  presets/                    \
    \           # Layer 0 (PresetRegistry, Terminology-Profile)\n  audit/        \
    \                         # Layer 0 (Operation-Level Audit-Log)\n  llm_adapter/\
    \                           # Layer 1 (LLM-Provider: Anthropic, OpenAI, Ollama,\
    \ mock)\n  traceability/                          # Layer 1 (Trace-Query, Link-Management,\
    \ PDF-Report)\n  workflow/                              # Layer 1 (konfigurierbare\
    \ State-Machines)\n  baseline/                              # Layer 1 (Snapshot-Baselines,\
    \ Diff-Engine)\n  application/                           # Layer 2 (19 Domain-Services,\
    \ Single Entry Point)\n  rest_api/                              # Layer 3 (DRF\
    \ ViewSets + drf-spectacular OpenAPI)\n  mcp_server/                         \
    \   # Layer 3 (MCP-Tool-Registry: 40+ Tools, 11 Gruppen)\n  diagram/         \
    \                      # Ext (SVG/PNG/PlantUML Renderer)\n  icd/             \
    \                      # Ext (Interface Control Document Management)\n  se_metrics/\
    \                            # Ext (KPI-Aggregation, Read-Model)\n  resilience/\
    \                            # Ext (Retry, Circuit-Breaker, Timeout)\n  admin_ops/\
    \                             # Ext (Disaster Recovery, Backup/Restore)\n  test_runs/\
    \                             # Ext (Test-Run-Protokollierung, v1.1)\nfrontend/\n\
    \  src/index.tsx                          # React Entry-Point\n  src/App.tsx \
    \                           # Root-Component\n  src/api/                     \
    \          # API-Wrapper (artifacts, requirements, ...)\n  src/components/   \
    \                     # 17 Component-Bereiche (Dashboard, Editors, Diff)\n  src/context/\
    \                           # React Context (Auth, Workspace)\n  src/i18n/locales/{de,en}.json\
    \          # i18next Uebersetzungen\n  src/styles/{tokens,global}.css        \
    \ # Design-System (CSS Custom Properties)\n  src/test/                       \
    \       # Vitest Unit-Tests\n  package.json                           # React\
    \ 18, Vite 5, react-i18next, vitest\nexternal /\n  e2e/                      \
    \             # Playwright E2E-Tests (111 Tests, Chromium)\ndocker-compose.yml\
    \                      # Orchestrierung (postgres, redis, backend, celery, frontend)\n"
  PROJECT_STRUCTURE: 'backend/             # Django REST API (17 Apps) #   Layer 0:
    persistence, auth_tenancy, presets, audit #   Layer 1: llm_adapter, traceability,
    workflow, baseline #   Layer 2: application (19 Services) #   Layer 3: rest_api,
    mcp_server #   Ext: diagram, icd, se_metrics, resilience, admin_ops, test_runs
    #   reqogniloom/  # Django-Projekt (settings.py, urls.py, wsgi.py, asgi.py)

    frontend/            # React 18 + TS SPA #   src/api/  src/components/  src/context/  src/i18n/
    #   src/styles/  src/test/  src/types/

    e2e/                 # Playwright/Chromium E2E-Tests (111 Tests)

    docs/                # Anforderungen, Architektur, SE-Kaskade, Session-Reports

    docker-compose.yml   # 5 Services: postgres, redis, backend, celery, frontend

    .meta-config/        # agent-meta Konfiguration (project.yaml)

    .agent-meta/         # agent-meta Submodul (Templates, Scripts, Schemas)

    '
  ENTRY_POINT_PATTERN: 'backend/manage.py            — Django Management (migrate,
    seed_demo, runserver, shell, check) backend/reqogniloom/settings.py     — Settings-Entry
    (DRF, JWT, Celery, Apps) backend/reqogniloom/urls.py         — URL-Routing (/api/v1/,
    /mcp/, /api/schema/, /admin/) frontend/src/index.tsx          — React Entry-Point
    (ReactDOM.render) frontend/src/App.tsx            — Root-Component (Provider,
    Router) frontend/src/api/client.ts      — Axios-Client (auto-Bearer-Token-Injection)
    e2e/playwright.config.ts        — Playwright-Konfiguration (Chromium) '
  KEY_PATTERNS: '- Django REST Framework (DRF) für REST-API-Endpoints (16 ViewSets
    + 2 APIViews) - MCP-Server (JSON-RPC 2.0) mit 11 Tool-Gruppen und 40+ Tools für
    AI-Integration - drf-spectacular für OpenAPI 3.0 Schema-Generierung (Swagger-UI,
    ReDoc) - Single-Entry-Point Pattern (ADR-01): Layer 2 application/ ist die einzige
    Domain-Fassade - TenantContext als Thread-Local Singleton + Row-Level-Security
    (ADR-03) - Configurable Rigor (ADR-04): 3 Presets (minimal/standard/extended)
    mit gleichem Datenmodell - LLM-Provider-Abstraktion (ADR-02): Capability-Interface
    mit graceful degradation - 8 Trace-Link-Typen (TRACE_TO, DERIVED_FROM, IMPLEMENTS,
    TESTS, VERIFIES, RELATED_TO, CONFLICTS_WITH, SUPERCEDES) - 3 Baseline-Scopes (Document,
    Project, Global) in einer Entität (ADR-07) - Konfigurierbare State-Machines pro
    Workspace (ADR-06) - Resilience-Decorators (Retry, Circuit-Breaker, Timeout) auf
    Service-Ebene - V-Modell-Traceability L0-L4 (Stakeholder Needs → System Req →
    Subsystems → Components → Presentation) '
  CODE_CONVENTIONS: '- Python (PEP 8, Typings, Docstrings für public API) - TypeScript
    (ESLint 9, Prettier, strict mode, functional Components + Hooks) - Django-Layer:
    Models (persistence/) ↔ Services (application/) ↔ Views/Serializers (rest_api/)
    - React-Layer: api/ (Wrapper) ↔ context/ (State) ↔ components/ (UI) ↔ i18n/ (Labels)
    - Imports-Reihenfolge: Standard Library → Third-Party → Local (PEP 8) - Keine
    wildcard imports (from x import *) - Keine direkten Model-Queries in DRF-Views
    (immer via Serializer + Service) - data-testid auf allen interaktiven UI-Elementen
    (E2E-Pflicht für Playwright) - CSS Custom Properties aus styles/tokens.css (keine
    hardcodierten Farben/Größen) - Commits: Conventional Commits Format (feat(REQ-xxx):
    ..., fix: ..., chore: ...) - Branch-Policy: feat/*, fix/*, refactor/* (NIE direkt
    auf main) - Requirements-IDs: REQ-L0-*, REQ-L1-*, REQ-L2-*, REQ-L3-* (siehe docs/se/traceability-matrix.md) '
  EXTRA_DONTS: '- NICHT direkt in .claude/agents/ oder .opencode/agents/ schreiben
    (generierter Output, wird überschrieben)

    - NICHT Docker-Services einzeln stoppen wenn andere laufen (Volume-Locks, postgres_data
    bleibt aktiv)

    - NICHT frontend-Service neu starten ohne danach E2E-Tests zu prüfen (HMR-Problem
    auf Windows)

    - NICHT migrate ohne seed_demo danach (DB leer, Login 401)

    - NICHT LLM_PROVIDER=mock ändern ohne API-Key (sonst 500 in Validation/Decomposition-Tools)

    - NICHT MCP-Tool ohne vorherigen Login via X-API-Key (auth-Header PFLICHT)

    - NICHT RFK_-Präfix API-Keys committen (greppbar als Secret)

    - NICHT TenantContext vergessen: jede DRF-View MUSS set_tenant(request.user.tenant)
    aufrufen

    - NICHT Seeder-Daten löschen (seed_demo ist idempotent, Re-Run statt Cleanup)

    - NICHT DRF-View direkt auf persistence.models zugreifen (immer via application/services)

    - NIEMALS Playwright E2E-Tests automatisch ausführen (npx playwright test, npm
    run e2e, npm run test:e2e) — nur auf explizite User-Anforderung; kein DoD-Gate

    '
  CODE_QUALITY_RULES: '- TypeScript strict mode (tsconfig.json: strict: true, noImplicitAny)

    - PEP 8 + Type Hints + Docstrings (alle public functions/classes)

    - DRF Serializer-First-Approach (niemals direkte Model-Queries in Views; immer
    via Service-Layer)

    - React: Functional Components + Hooks, kein class-based

    - data-testid auf allen interaktiven UI-Elementen (E2E-Pflicht)

    - CSS Custom Properties aus tokens.css (keine hardcodierten Farben/Größen)

    - i18n via react-i18next (alle UI-Strings in src/i18n/locales/{de,en}.json)

    - Keine hardcodierten URLs/Ports (via VITE_API_BASE_URL / SYSTEM_URLS)

    - JWT-Token in localStorage; auto-inject via api/client.ts Axios-Interceptor

    - TenantContext muss in DRF-Views explizit via set_tenant() gesetzt werden

    - LLM-Provider mock-default (kein API-Key für Entwicklung erforderlich)

    - Secrets NIE committen (RFK_-Präfix für MCP-API-Keys; grep-bar)

    - ESLint max-warnings 0 (frontend/package.json)

    - AI-Optimized Test Runner: Keine rohen Playwright-Logs in den Chat leiten (niemals
    `tail -100`). Nutze gefilterten Runner (z.B. `npm run e2e:ai`), der nur Testnamen,
    Fehlerzeilen und relevante Network-Events ausgibt.

    - Persistent Debug Sandbox: Iteratives Test-Debugging darf nur in einer permanenten
    Sandbox-Datei (z.B. `e2e/tests/sandbox.debug.ts`) stattfinden, um Schreib-Overhead
    im Chat zu vermeiden.

    - Screenshot Pull-Policy: Screenshots und Traces dürfen nur bei absoluter Notwendigkeit
    per Datei-Lesevorgang (Pull) geladen werden. Kein routinemäßiges Analysieren von
    Bildern bei E2E-Fehlern.

    '
  REQ_CATEGORIES: '- Functional: Features, User Stories, CRUD-Operationen

    - Non-Functional: Performance, Sicherheit, Skalierbarkeit, Audit-Compliance

    - API: REST API (/api/v1/) und MCP Server (/mcp/) Schnittstellen

    - UI/UX: Frontend, React-Components, Barrierefreiheit, i18n (DE/EN)

    - Data: Datenmodelle, Artefakte, Zerlegungsstrukturen, Multi-Tenancy

    - Integration: Externe Systeme, CSV-Import, PDF-Export, LLM-Provider

    - Test: Test-Management, Test-Run-Protokollierung, Coverage-Tracking

    - Workflow: State-Machine, Approval-Gates, Transition-Validierung

    - Baseline: Snapshot, Diff, 3 Scopes (Document/Project/Global)

    - Traceability: 8 Link-Typen, Coverage-Aggregation, V-Modell L0-L4

    '
  REQ_CATEGORIES_LIST: '- **Functional** — Features, User Stories, CRUD auf Requirements/Architecture/TestCases/ADRs/Risks/Issues

    - **Non-Functional** — Performance, Sicherheit, Skalierbarkeit, Audit-Compliance,
    Multi-Tenancy

    - **API** — REST API (/api/v1/, JWT-Auth, OpenAPI) und MCP Server (/mcp/, JSON-RPC
    2.0, 11 Tool-Gruppen)

    - **UI/UX** — Frontend (React 18 SPA), 17 Component-Bereiche, i18n (DE/EN), Barrierefreiheit

    - **Data** — Generic Artifact Model, Multi-Tenancy via Row-Level-Security, Configurable
    Rigor

    - **Integration** — Externe Systeme, CSV-Bulk-Import, PDF-Report-Export, LLM-Provider
    (Anthropic/OpenAI/Ollama/mock)

    - **Test** — Test-Management, Test-Run-Protokollierung (4-Phasen-Lifecycle), Coverage-Tracking

    - **Workflow** — Konfigurierbare State-Machines pro Workspace, Approval-Gates,
    Transition-Validierung

    - **Baseline** — Snapshot, Feld-Level-Diff, 3 Scopes (Document/Project/Global)

    - **Traceability** — 8 Link-Typen, Coverage-Aggregation, V-Modell L0-L4-Traceability

    - **AI** — LLM-Provider-Abstraktion, Decomposition, Validation, Consistency-Check

    - **Resilience** — Retry, Circuit-Breaker, Timeout-Decorators, async via Celery

    '
  TESTER_SNIPPETS_PATH: ''
  DEVELOPER_SNIPPETS_PATH: ''
  AGENT_META_REPO: Popoboxxo/agent-meta
  SYSTEM_DEPENDENCIES: '- Docker >= 24

    - Docker Compose >= 2.x

    - Node.js >= 18 (nur für E2E-Tests mit Playwright)

    - Python 3.x (im Container)

    '
  SYSTEM_URLS: '- Frontend: http://localhost:5173 (Vite Dev-Server)

    - Backend API: http://localhost:8000/api/v1/ (DRF)

    - MCP Server: http://localhost:8000/mcp/ (JSON-RPC 2.0, HTTP-Transport)

    - MCP Server (SSE): http://localhost:8000/mcp/sse/ (Server-Sent-Events-Transport)

    - Admin: http://localhost:8000/admin/ (Django Admin)

    - OpenAPI Schema: http://localhost:8000/api/schema/ (drf-spectacular)

    - Swagger UI: http://localhost:8000/api/schema/swagger-ui/

    - ReDoc: http://localhost:8000/api/schema/redoc/

    - Health Check: GET http://localhost:8000/mcp/ (kein Auth)

    - Postgres: localhost:5432 (intern: postgres:5432)

    - Redis: localhost:6379 (intern: redis:6379)

    '
  SERVICE_NAME: reqogniloom-backend
  CONTAINER_NAME: ai-native-reqogniloom-poc-backend-1
  PRIMARY_PORT: '8000'
  EXTRA_PORTS: '- 5173 (frontend Vite)

    - 5432 (postgres)

    - 6379 (redis)

    '
  BUILD_OUTPUT: (kein Build-Artifact — Django served via gunicorn, React via Vite
    Dev Server oder build/)
  ARTIFACT_ZIP_CMD: ''
  ARTIFACT_TAR_CMD: ''
  GH_ASSETS: ''
  BUILD_SYSTEM_NOTES: '`docker-compose build` erstellt Images für backend, celery,
    frontend (postgres und redis nutzen offizielle Images).

    Backend + Celery: Dockerfile in backend/ (Python 3.x, Django 4.2+, requirements.txt).

    Frontend: Dockerfile in frontend/ (Node 18+, Vite 5, package.json, target: development).

    Postgres: postgres:16-alpine (offiziell); Redis: redis:7-alpine (offiziell).

    Volumes: ./backend:/app (Backend), ./frontend:/app + /app/node_modules (Frontend)
    — Hot-Reload-fähig.

    Healthchecks: pg_isready (postgres), redis-cli ping (redis) — services_healthy
    als DependsOn-Bedingung.

    Kein separates Build-Artifact — Deployment via Docker Compose (5 Services orchestriert).

    Seed: `docker-compose exec backend python manage.py migrate && python manage.py
    seed_demo`.

    Demo-Credentials: admin / admin12345 (Tenant "demo", Workspace "Demo Workspace").

    '
  VERSION_DIST_BEHAVIOUR: '1. VERSION-Datei erhöhen — SemVer-Schema X.Y.Z, KEIN "v"-Präfix
    in der Datei (Präfix nur im Git-Tag, siehe Schritt 5: vX.Y.Z). Root-VERSION-Datei
    ist Single Source of Truth für backend/reqogniloom/version.py (Fallback wenn APP_VERSION-ENV
    fehlt).

    2. frontend/package.json "version"-Feld SYNCHRON auf denselben Wert wie VERSION
    setzen — beide Dateien müssen exakt übereinstimmen, keine getrennten Versionsstände.

    3. CHANGELOG.md aktualisieren (Englisch, externe Doku)

    4. docs/se/reports/ Session-Bericht schreiben (Deutsch, interne Doku)

    5. git tag v<version> (z.B. v1.1.1)

    6. Release-Build via scripts/build.sh (bzw. make build) — NICHT nacktes docker-compose
    build. scripts/build.sh berechnet APP_VERSION=$(cat VERSION), GIT_COMMIT_SHA=$(git
    rev-parse HEAD) und BUILD_TIME=$(date -u ...) und übergibt sie als Build-Args
    an docker-compose build. Ein nacktes docker-compose build lässt APP_VERSION/GIT_COMMIT_SHA/BUILD_TIME
    auf "unknown" — GET /api/v1/version/ liefert dann keine echten Werte.

    7. docker-compose push (optional, Self-Hosted-First)

    Stand v1.1.1 (2026-06-28): 1,599 pytest-Tests + 111 E2E-Tests + 150+ MCP-E2E-Tests.

    Roadmap v2.0: ReqIF-Import/Export, Comment-Threads mit @Mention, RAG-basierte
    Vektorsuche.

    '
  SE_MIN_DEPTH: 1
  SE_MAX_DEPTH: 4
  SE_MAX_CRITIC_ITERATIONS: 1
  SE_MAX_PARALLEL_CELLS: 3
  DOCKER_STACKS_OVERVIEW: 'ReqogniLoom verwendet eine einzige `docker-compose.yml`
    im Projekt-Root mit 5 Services:

    - postgres (PostgreSQL 16-alpine, persistent via Volume `postgres_data`)

    - redis (Redis 7-alpine, Cache + Celery-Broker)

    - backend (Django 4.2+ / Python 3.12, Port 8000)

    - celery (gleiches Image wie backend, Worker-Prozess)

    - frontend (React 18 / Node 22, Vite Dev-Server Port 5173)

    Kein separater Test-Stack: Backend-Tests (pytest) laufen gegen das Compose-Postgres,

    E2E-Tests (Playwright/Chromium) laufen lokal auf dem Host gegen den laufenden
    Stack.

    Binary-Strategie: B (Apt im Dockerfile) — keine init-container / externen Binaries.

    '
