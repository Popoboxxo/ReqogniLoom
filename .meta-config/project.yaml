systems-engineering:
  enabled: true
project:
  name: ReqFlow
  prefix: rf
  short: reqflow
gitignore:
  local: true
  generated: true
  settings: true
variables:
  PROJECT_NAME: ReqFlow
  PROJECT_DESCRIPTION: AI-natives Requirements-Management-Tool mit Testmanagement-Unterstützung
  PROJECT_GOAL: Anforderungen und Tests in Artefakten verwalten, von einfach bis Systems
    Engineering
  PLATFORM: Django + React + Docker Compose
  RUNTIME: Python 3.x (Django) + Node.js (React)
  PROJECT_LANGUAGES: Python, TypeScript
  LANGUAGE: Python, TypeScript
  COMMUNICATION_LANGUAGE: Deutsch
  USER_INPUT_LANGUAGE: Deutsch
  DOCS_LANGUAGE: Englisch
  INTERNAL_DOCS_LANGUAGE: Deutsch
  CODE_LANGUAGE: Englisch
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/owner/repo
  GIT_MAIN_BRANCH: main
  BUILD_COMMAND: docker-compose build
  TEST_COMMAND: pytest (Backend) + npm test (Frontend)
  DEV_COMMANDS: 'docker-compose build

    docker-compose up

    '
  TEST_COMMANDS: 'docker-compose exec backend pytest

    docker-compose exec frontend npm test

    '
  BUILD_COMMANDS: docker-compose build
  DEV_STACK_START: docker-compose up
  DEV_STACK_RELOAD: docker-compose restart (oder Hot Reload je nach Service)
  PROJECT_CONTEXT: 'ReqFlow ist ein AI-natives Requirements-Management-Tool mit Testmanagement-Unterstützung.
    Tech-Stack: Django (Backend) + React (Frontend) + Docker Compose. Schnittstellen:
    REST API + nativer MCP Server. Fähigkeiten: Einfaches Requirements Management
    bis komplexe Systems-Engineering-Strukturen mit Artefakt-basierter Zerlegung von
    Requirements und Tests.'
  ARCHITECTURE: "backend/\n  manage.py          # Django Entry-Point\n  reqflow/ \
    \          # Django Project\n  requirements_app/  # Requirements Management App\n\
    frontend/\n  src/               # React Source\n  package.json\ndocker-compose.yml\
    \   # Orchestrierung\n"
  PROJECT_STRUCTURE: 'backend/             # Django REST API

    frontend/            # React UI

    docker-compose.yml   # Container Orchestrierung

    '
  ENTRY_POINT_PATTERN: 'backend/manage.py — Django Management

    frontend/src/index.tsx — React Entry-Point

    '
  KEY_PATTERNS: '- Django REST Framework für API-Endpoints

    - MCP Server für AI-Tool-Integration

    - Artefakt-basierte Zerlegung von Requirements

    '
  CODE_CONVENTIONS: '- PEP 8 für Python (Django Backend)

    - TypeScript best practices für React Frontend

    - Django-spezifisch: Models, Views, Serializers Trennung

    - React-spezifisch: Functional Components, Hooks

    '
  EXTRA_DONTS: ''
  CODE_QUALITY_RULES: ''
  REQ_CATEGORIES: ''
  REQ_CATEGORIES_LIST: ''
  TESTER_SNIPPETS_PATH: ''
  DEVELOPER_SNIPPETS_PATH: ''
  AGENT_META_REPO: Popoboxxo/agent-meta
  SYSTEM_DEPENDENCIES: ''
  SYSTEM_URLS: ''
  SERVICE_NAME: ''
  CONTAINER_NAME: ''
  PRIMARY_PORT: ''
  EXTRA_PORTS: ''
  BUILD_OUTPUT: ''
  ARTIFACT_ZIP_CMD: ''
  ARTIFACT_TAR_CMD: ''
  GH_ASSETS: ''
  BUILD_SYSTEM_NOTES: ''
  VERSION_DIST_BEHAVIOUR: ''
  SE_MIN_DEPTH: 1
  SE_MAX_DEPTH: 4
  SE_MAX_CRITIC_ITERATIONS: 1
  SE_MAX_PARALLEL_CELLS: 3
orchestrator:
  enabled: true
  strict: true
  handoff:
    protocol: a2a-v1
    token-budget: {}
    protocol_routing: dynamic
    validate-before-delegate: true
viz:
  enabled: false
  server: {}
  mcp: {}
  report: {}
admin-ui:
  enabled: true
  auto-sync-on-save: true
rules-preset: ''
speech-mode: short
