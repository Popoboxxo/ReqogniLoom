# Optional TLS overlay for the full stack (issue #1744).
#
# Usage (from the repo root):
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.tls.example.yml \
#                  --project-directory . up -d
#
# Caddy terminates TLS, obtains a certificate via ACME, and forwards
# X-Forwarded-Proto to the backend. Set in .env:
#   SECURE_SSL_REDIRECT=true
#   AUTH_COOKIE_SECURE=true
#   SESSION_COOKIE_SECURE=true
#   CSRF_COOKIE_SECURE=true
#   CSRF_TRUSTED_ORIGINS=https://<your-domain>
# and copy deploy/Caddyfile.example, replacing the domain placeholder.
#
# This file is an OVERLAY: it adds only the proxy and does not duplicate the
# application services, so it carries no REQOGNILOOM_VERSION tag and is not a
# release-version carrier.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      REQOGNILOOM_DOMAIN: ${REQOGNILOOM_DOMAIN:-reqogniloom.example.com}
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
