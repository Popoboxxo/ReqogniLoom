# Template: deliver ReqogniLoom document projections as a pull request.
#
# Copy into `.github/workflows/` of the consuming repository and set the two
# values below. The job NEVER pushes to main: it opens a branch and a PR.
#
#   REQOGNILOOM_URL       -> https://<host>/mcp/
#   REQOGNILOOM_WORKSPACE -> workspace UUID
#
# Secret: REQOGNILOOM_API_KEY — a READ key is enough for projection; adoption
# stays a human action in the Loom UI/MCP.

name: Document projection drift

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  project:
    runs-on: ubuntu-latest
    env:
      REQOGNILOOM_URL: ${{ vars.REQOGNILOOM_URL }}
      REQOGNILOOM_WORKSPACE: ${{ vars.REQOGNILOOM_WORKSPACE }}
      REQOGNILOOM_API_KEY: ${{ secrets.REQOGNILOOM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the projection CLI
        run: |
          mkdir -p scripts/clients
          curl -fsSL "${{ vars.REQOGNILOOM_CLI_URL }}" -o scripts/clients/project_documents.py
      - name: Check for drift
        id: check
        continue-on-error: true
        run: |
          python scripts/clients/project_documents.py \
            --url "$REQOGNILOOM_URL" \
            --workspace "$REQOGNILOOM_WORKSPACE" \
            --repo . --check
      - name: Open a pull request with the changed projections
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="docs/loom-projection-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          python scripts/clients/project_documents.py \
            --url "$REQOGNILOOM_URL" \
            --workspace "$REQOGNILOOM_WORKSPACE" \
            --repo . --write
          git add -A docs
          if git diff --cached --quiet; then
            echo "no writable projection (file_changed/conflict) — nothing to PR"
            exit 0
          fi
          git -c user.name="reqogniloom-bot" \
              -c user.email="reqogniloom-bot@users.noreply.github.com" \
              commit -m "docs: re-project ReqogniLoom documents"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs: re-project ReqogniLoom documents" \
            --body "Generated by the document projection job. Review before merging — a hand-edited file is reported as file_changed and is never overwritten."
