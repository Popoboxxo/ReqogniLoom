# Case files are owned by plan D (backend/application/prompt_testing/cases.py).
slot: quality_adr
scenarios:
  - name: postgres-stays-decision
    data:
      artifact_title: "PostgreSQL bleibt der einzige Datastore"
      artifact_description: "Kein zweiter Datastore wird eingefuehrt."
      artifact_fields_json: '{"status": "accepted", "affected_reqs": ["REQ-L2-X-001"]}'
    assert:
      - {type: contains, value: "PostgreSQL bleibt der einzige Datastore"}
      - {type: contains, value: "consequences"}
      - {type: contains, value: "score"}
      - {type: contains, value: "alternatives"}
      - {type: not-contains, value: "{memory_context}"}
