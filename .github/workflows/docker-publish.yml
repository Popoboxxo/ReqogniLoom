name: Docker Publish (GHCR)

# Builds and pushes the 2 ReqogniLoom images (backend, frontend) to GitHub
# Container Registry on version tags. Celery/celery-beat reuse the backend
# image with a different `command:` override (see deploy/docker-compose.yml) — there
# is no separate Celery image, since celery/celery-beat/migrate all import
# the same Django app code as the web process; splitting it out would only
# duplicate the build/dependency layers without any runtime isolation gain.
#
# Tagging: every push of a `vX.Y.Z` tag publishes that exact version tag
# (always) and additionally moves the `latest` tag to it (skipped for
# pre-release tags like `v1.1.0-rc1`), so operators can pin a version or
# track `latest`.
#
# Supply-chain hardening (SEC-08 / AUD-2026-09-137, -149, -225):
#   * CI gate        — `needs: ci` on the full CI Pipeline (reusable `ci.yml`),
#                      so a release cannot publish unless tests pass.
#   * staging gate   — `staging` environment with required reviewers between CI
#                      and the publish job (`staging-gate`).
#   * scan == push   — one local build is scanned by Trivy, then the *same*
#                      image is pushed with `docker push` (no rebuild between
#                      scan and push).
#   * SBOM           — SPDX SBOM per image via anchore/sbom-action.
#   * provenance     — SLSA build provenance via GitHub artifact attestations.
#   * signing         — keyless cosign signature + immediate verification.
#   * pinning        — every action pinned to an immutable commit SHA; the
#                      trailing `# vX` comment keeps upgrades mechanical.
#
# Action SHAs below were resolved with `git ls-remote refs/tags/<tag>^{}`
# (peeled commit for annotated tags) on 2026-10-03.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# One release at a time and never cancel an in-flight publish: a cancelled
# job between `docker push` and signing would leave a partially released image.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # H2: upload-sarif needs security-events:write
  security-events: write

jobs:
  # SEC-08 / AUD-2026-09-137: publish may not start before CI succeeds. Calling
  # the full CI pipeline as a reusable workflow makes "CI green" a hard
  # precondition of this very run; `secrets: inherit` forwards the optional
  # FIELD_ENCRYPTION_KEY the backend tests read.
  ci:
    name: "CI gate"
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # SEC-08 / AUD-2026-09-149: approval gate between CI and the production
  # publish. This job must be protected by a `staging` environment with required
  # reviewers (Repository Settings -> Environments -> staging). Until reviewers
  # are configured GitHub auto-approves, so the gate is a no-op; the environment
  # reference and the required-reviewer configuration together are the gate.
  staging-gate:
    name: "Staging approval gate"
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: staging
    steps:
      - name: Staging gate approved
        run: echo "Staging gate approved — proceeding to release build and publish."

  build-and-push:
    needs: [ci, staging-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # SEC-08: keyless cosign and GitHub build-provenance attestations use the
    # workflow OIDC token; pushing attestations to the registry needs
    # attestations:write. Scoped to this job only (least privilege).
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write

    strategy:
      # Both images must be independently verifiable. With the default
      # (fail-fast: true) a backend failure cancels the frontend leg mid-run —
      # possibly between `docker push` and `cosign sign`, leaving a partially
      # released image — and hides the second image's real result. fail-fast:
      # false lets each image run to completion and report its own green/red,
      # which is exactly what a full supply-chain audit needs. Not a security
      # gate; no gate is weakened by this.
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            target: ''
          - image: frontend
            context: ./frontend
            target: production

    steps:
      # fetch-depth 0 + fetch-tags guarantee the pushed tag ref exists locally,
      # so `git rev-parse <tag>^{commit}` in the next step resolves the tag's
      # real commit instead of relying on the (possibly stale) GITHUB_SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Issue #1145: single source of truth for the commit the release TAG
      # actually points to. Every downstream stamp, label and gate reads this
      # output, so a published image can never carry a different commit than
      # the tag under which it is published. Fails closed when the SHA cannot
      # be resolved (push: the tag must exist and peel to a commit).
      - name: Resolve tag commit SHA (single source of truth)
        id: sha
        env:
          # Ref is passed through env (never interpolated into the shell body),
          # matching the other steps, so a crafted tag name cannot inject shell
          # commands into this script.
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG_SHA="$(git rev-parse "${REF_NAME}^{commit}")"
          else
            TAG_SHA="${GITHUB_SHA}"
          fi
          if [[ -z "$TAG_SHA" || "$TAG_SHA" == "unknown" ]]; then echo "ERROR: tag SHA unresolved" >&2; exit 1; fi
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          echo "[resolve-sha] TAG_SHA=${TAG_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR/OCI repository names MUST be lowercase. `github.repository_owner` is
      # canonical-case (e.g. `Popoboxxo`), but Syft/sbom-action, cosign and the
      # attestation tooling use go-containerregistry, which rejects uppercase
      # names with "could not parse reference". docker/metadata-action lowercases
      # internally, so this derived lowercase prefix is the single source of
      # truth for every hand-built image reference below.
      - name: Derive lowercase image prefix
        id: img
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.img.outputs.prefix }}/reqogniloom-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=manual-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Resolve build metadata (backend version stamp)
        id: build_meta
        run: |
          # Extract app_version from version tag (e.g., v1.0.1 → 1.0.1)
          # For workflow_dispatch: extract from VERSION file instead
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # workflow_dispatch: read from VERSION file at the current commit
            VERSION=$(git show HEAD:VERSION | tr -d '[:space:]')
          fi

          # Commit SHA is the TAG's commit (single source of truth, issue #1145),
          # NOT GITHUB_SHA — the latter may be stale relative to the tag and
          # previously let a stale commit be stamped/published under a tag.
          GIT_COMMIT_SHA="${{ steps.sha.outputs.sha }}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Validate that we have non-empty values (not "unknown")
          if [[ -z "$VERSION" || "$VERSION" == "unknown" ]]; then
            echo "ERROR: app_version is empty or unknown" >&2
            exit 1
          fi
          if [[ -z "$GIT_COMMIT_SHA" || "$GIT_COMMIT_SHA" == "unknown" ]]; then
            echo "ERROR: git_commit_sha is empty or unknown" >&2
            exit 1
          fi

          {
            echo "app_version=$VERSION"
            echo "git_commit_sha=$GIT_COMMIT_SHA"
            echo "build_time=$BUILD_TIME"
          } >> "$GITHUB_OUTPUT"

          echo "[build-meta] app_version=$VERSION"
          echo "[build-meta] git_commit_sha=$GIT_COMMIT_SHA"
          echo "[build-meta] build_time=$BUILD_TIME"

      # SEC-08 / AUD-2026-09-137: exactly one build per image. It is loaded into
      # the local daemon, scanned by Trivy below, and only then pushed — so the
      # scanned artifact and the published artifact are byte-identical.
      - name: Build image locally for scanning (backend)
        if: matrix.image == 'backend'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          # docker/metadata-action stamps org.opencontainers.image.revision with
          # github.sha, which can be stale relative to the tag (issue #1145).
          # The explicit revision below is emitted last, so it overrides and the
          # image carries the tag's commit — exactly what the gate verifies.
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
          build-args: |
            APP_VERSION=${{ steps.build_meta.outputs.app_version }}
            GIT_COMMIT_SHA=${{ steps.build_meta.outputs.git_commit_sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Build image locally for scanning (frontend)
        if: matrix.image == 'frontend'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          # metadata-action stamps org.opencontainers.image.revision with
          # github.sha, which can be stale relative to the tag (issue #1145).
          # Same override as the backend: the explicit revision below is emitted
          # last, so it overrides and the image carries the tag's commit — the
          # gate below verifies this on the frontend image too.
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # H4: Extract first tag from multi-line output (steps.meta.outputs.tags may contain
      # multiple tags separated by newlines, e.g., "vX.Y.Z" and "latest"). Trivy expects
      # a single image reference.
      # SEC-08 / AUD-2026-09-230: the tag list is passed through `env`, never
      # interpolated into the shell command, so a crafted git tag cannot inject
      # shell commands into this job.
      - name: Extract first image tag (H4)
        id: first_tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "tag=$(head -n1 <<< "$TAGS")" >> "$GITHUB_OUTPUT"

      # Issue #1145: mandatory CI gate — the BUILT image's OCI revision label
      # must equal the tag's commit. Runs after the local build (image is loaded)
      # and BEFORE Trivy/push, so a stale image is refused before it can ever be
      # scanned, signed or published. Applies to BOTH images: the frontend image
      # does receive a metadata-action revision label, but (like the backend's)
      # it comes from github.sha and may be stale — the frontend build step above
      # overrides it with the tag commit, so this gate is authoritative for both.
      - name: Verify image SHA label matches tag SHA
        env:
          TAG_SHA: ${{ steps.sha.outputs.sha }}
          IMAGE_TAG: ${{ steps.first_tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "$IMAGE_TAG" ]]; then
            echo "ERROR: no image tag resolved — cannot verify image revision" >&2
            exit 1
          fi
          # Primary and ONLY gating path: the OCI revision label baked into the
          # image. This is the non-vacuous proof that the image was built from
          # the tag commit. The ENV GIT_COMMIT_SHA must NOT be used as a
          # fallback: it is populated from steps.build_meta.outputs.git_commit_sha,
          # which IS steps.sha.outputs.sha by construction, so it can never
          # disagree with the tag and a stale image would pass vacuously.
          IMAGE_SHA="$(docker image inspect "$IMAGE_TAG" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          if [[ -z "$IMAGE_SHA" ]]; then
            echo "ERROR: refusing to publish: image carries no OCI revision label (org.opencontainers.image.revision)" >&2
            exit 1
          fi
          if [[ "$IMAGE_SHA" != "$TAG_SHA" ]]; then
            echo "ERROR: image revision ($IMAGE_SHA) != tag commit ($TAG_SHA) — refusing to publish a stale image" >&2
            exit 1
          fi
          # Informational only (never gates): the ENV build-arg stamp; expectedly
          # unset for the frontend image only.
          ENV_SHA="$(docker image inspect "$IMAGE_TAG" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^GIT_COMMIT_SHA=//p' | head -n1)"
          echo "[gate] image OCI revision == tag-SHA ($TAG_SHA); ENV GIT_COMMIT_SHA=${ENV_SHA:-<unset>}"

      # H4: Security scan for container image vulnerabilities using Trivy.
      # Scans the locally-loaded image BEFORE pushing to GHCR. Fails if CRITICAL or HIGH
      # vulnerabilities are found (prevents known-vulnerable images from reaching prod).
      # Uses the first tag from steps.first_tag.outputs.tag (extracted above).
      # v0.28.0 was retired by upstream: it referenced aquasecurity/setup-trivy@v0.2.1,
      # a sub-action tag that no longer resolves (deleted upstream), breaking every
      # docker-publish run with "Unable to resolve action ... unable to find version
      # v0.2.1" before any build step could run. Bumped to the latest stable release.
      - name: Run Trivy vulnerability scan (SA-44)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # H3: Use v-prefixed tag (v0.28.0 instead of 0.28.0)
          # H4: Use extracted single tag (not multi-line raw output)
          image-ref: ${{ steps.first_tag.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # H4: Exit with failure code if vulnerabilities found (not just SARIF upload)
          exit-code: '1'
          # Ignore vulnerabilities with no fix available (focus on actionable issues)
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security (SA-44)
        # H3: v2 is retired; use v3
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        # N2: Only upload if trivy-results.sarif exists (prevents failure if Trivy didn't run)
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-${{ matrix.image }}'

      # SEC-08 / AUD-2026-09-137: push the exact image that was just scanned.
      # Using `docker push` (instead of a second build-push-action) guarantees
      # "scan artifact == publish artifact"; the registry digest is captured for
      # the SBOM, provenance attestation and signature steps.
      - name: Push scanned image to GHCR
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first_digest=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Pushing $tag"
            docker push "$tag"
            if [ -z "$first_digest" ]; then
              first_digest="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
            fi
          done <<< "$TAGS"
          if [ -z "$first_digest" ]; then
            echo "ERROR: could not resolve the pushed image digest" >&2
            exit 1
          fi
          echo "digest=$first_digest" >> "$GITHUB_OUTPUT"
          echo "[push] digest=$first_digest"

      # SEC-08: SPDX SBOM of the pushed image, retained as a workflow artifact.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.img.outputs.prefix }}/reqogniloom-${{ matrix.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          artifact-name: sbom-${{ matrix.image }}
          # Least-privilege: retain the SBOM as a workflow artifact only (the
          # `artifact-name` input above drives the upload). anchore/sbom-action
          # defaults `upload-release-assets` to true, which additionally attaches
          # the SBOM to the GitHub release and therefore requires
          # `contents: write`; this job intentionally has only `contents: read`,
          # so the default fails with "Resource not accessible by integration"
          # (403). Keep `contents: read` — the workflow artifact is the intended
          # retention mechanism here.
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      # SEC-08: SLSA build provenance for the pushed digest (GitHub-native
      # attestation, also stored in the registry so consumers can verify it).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.prefix }}/reqogniloom-${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # SEC-08: keyless (OIDC/Fulcio) signature; no long-lived signing key.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.img.outputs.prefix }}/reqogniloom-${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify image signature (keyless)
        env:
          IMAGE: ${{ steps.img.outputs.prefix }}/reqogniloom-${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/docker-publish.yml
        run: |
          cosign verify \
            --certificate-identity-regexp "${WORKFLOW_IDENTITY}@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
