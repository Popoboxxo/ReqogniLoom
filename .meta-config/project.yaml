- Claude
- Opencode
- Gemini
#dod-preset: strict
platforms: []
roles:
- orchestrator
- developer
- senior-developer
- code-reviewer
- api-specialist
- requirements
- validator
- documenter
- git
- release
- meta-feedback
- ideation
- agent-meta-manager
- feature
- agent-meta-scout
- se-requirements
- se-architect
- se-interface-mgr
- se-critic
- se-validator
- se-verifier
- se-integration-and-test-manager
- se-termination
- bug-feature-analyzer
- concept-reviewer
- se-test-engineer
- se-testreviewer
- ui-ux-designer
- log-analyzer
- feedback
- docker
