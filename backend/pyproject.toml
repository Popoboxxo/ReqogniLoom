[tool.pytest.ini_options]
# REQ-037: isolate the test suite from production config (cache/celery/llm).
# pytest-django reads the uppercase DJANGO_SETTINGS_MODULE ini option.
DJANGO_SETTINGS_MODULE = "reqflow.settings_test"
python_files = ["tests.py", "test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -v"
markers = [
    "slow: Performance-Tests, dauern > 1s",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "reqflow/wsgi.py",
    "reqflow/asgi.py",
]
