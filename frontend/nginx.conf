# nginx Configuration for ReqogniLoom React SPA
# REQ-031: SPA History-API Fallback with Gzip and Cache Headers

server {
    listen 8080;
    server_name _;

    # Root directory for React build output
    root /usr/share/nginx/html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json
               application/wasm image/svg+xml;
    gzip_comp_level 6;

    # Security headers (fixes #155)
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-no-referrer" always;
    add_header Permissions-Policy "microphone=(), camera=(), geolocation=(), magnetometer=(), payment=()" always;
    # Content-Security-Policy: src/self for JS/CSS/images; no external script execution
    # (matches VITE build output structure and MCP/API proxying)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;" always;

    # Lightweight healthcheck endpoint (fixes #155)
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type "text/plain";
    }

    # Reverse-proxy API requests to Django backend (REQ-225)
    #
    # The upstream is resolved per request through Docker's embedded DNS
    # (127.0.0.11) instead of at startup, for the same reason as the
    # bluepencil block below (#1054): with a literal
    # `proxy_pass http://backend:8000;` nginx resolves "backend" once, when the
    # worker starts, and keeps that IP for the worker's whole lifetime. Every
    # deployment that recreates the backend container — which is every `up -d`,
    # every image update, every changed .env — hands the container a NEW IP,
    # and the frontend proxy then answers 502 for /api/ and /mcp/ until the
    # FRONTEND is restarted too. The symptom is deceptive: the SPA itself is
    # served from this same nginx and stays reachable, so the UI loads and only
    # the login POST fails, which reads as "wrong password" to the user and is
    # invisible in every application health check.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        # Issue #617: nginx's $host variable always drops the port, even when
        # the client's Host header included one (a well-known nginx gotcha —
        # $host is normalized, $http_host is the raw header). On any
        # deployment reachable on a non-default port (every port this stack
        # publishes: 5173, 8001, ...) that made Django see e.g. Host:
        # <backend-host> while the browser's real Origin was
        # http://<backend-host>:5173 — the two can never self-match, so
        # Django's CSRF origin check falls through to CSRF_TRUSTED_ORIGINS
        # and 403s unless that exact origin happens to be listed there.
        # $http_host preserves host:port exactly as the browser sent it, so
        # the self-origin match succeeds without depending on an exhaustive
        # CSRF_TRUSTED_ORIGINS entry per deployment host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        client_max_body_size 100M;
        # Issue #342: workspace-wide LLM tools may legitimately run up to
        # LLM_LONG_RUNNING_TIMEOUT (default 180s). nginx's 60s default
        # proxy_read_timeout would cut those requests off with a 504 before the
        # backend can answer, so keep this above the backend-side timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Reverse-proxy MCP server requests to Django backend (REQ-225)
    #
    # Same per-request resolution as the /api/ block above (#1054) — the MCP
    # transport has the identical 502-on-backend-recreate failure mode, and it
    # is the block most likely to be reached by a long-lived SSE stream while a
    # deployment is rolling, which is exactly when the stale IP hurts most.
    location /mcp/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $backend_mcp_upstream http://backend:8000;
        proxy_pass $backend_mcp_upstream;
        # Issue #617 — see the /api/ block above for why $http_host (not $host).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        client_max_body_size 100M;
        # Issue #342 — see the /api/ block above. The MCP surface hosts all
        # three workspace-wide LLM tools, plus long-lived SSE streams.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Reverse-proxy the bluepencil review-layer sidecar (issue #980). The
    # layer is same-origin by design (loader.ts probes `/bluepencil/api/health`
    # and posts to `/bluepencil/api`), so the SPA's own nginx must forward that
    # path to the sidecar; without this it fell through to the SPA fallback and
    # answered index.html.
    #
    # The upstream is resolved per request through Docker's embedded DNS
    # (127.0.0.11) instead of at startup: the sidecar is an opt-in Compose
    # profile, and a literal `proxy_pass http://bluepencil:8787;` would make
    # nginx fail to start ("host not found in upstream") on every deployment
    # that does not run it.
    location /bluepencil/api/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $bluepencil_upstream http://bluepencil:8787;
        proxy_pass $bluepencil_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    # SPA History-API fallback: all non-file requests → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache policy for index.html: always revalidate
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache policy for static assets (JS, CSS, images, fonts)
    # Long-term caching since build includes hash in filenames
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Deny access to hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
