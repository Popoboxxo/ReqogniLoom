# Gitleaks configuration for ReqogniLoom (SECTRACK-03).
#
# TWO gates share this file:
#
#   1. `reqlo-api-key` — the deterministic incident rule, run by both the
#      `dir` and the full-history `git` step in .github/workflows/ci.yml.
#   2. `env-secret-assignment` — added by plan D / D2.6 (QR-S03). It runs as a
#      THIRD, blocking step over the pull-request diff only, so historical test
#      values and the repository's own placeholder docs never turn it red.
#      Scope: literal assignments of a secret-shaped env var to a value of 12+
#      non-whitespace characters.
#
# Why the diff and not the tree: the rule must catch the failure mode that
# motivated it — a `.env.bak*` file (or a pasted line) entering a commit,
# while `secret-scan` stayed green because it only knew `reqlo_`. Scanning the
# whole history would additionally fire on pre-existing fixtures and docs,
# which is not this gate's job.
#
# Known placeholder shapes that are NOT allowlisted here on purpose:
# `<strong-password>` / `my_secure_password` in README prose. If a PR touches
# such a line, the sanctioned remedy is a PR-scoped allowlist entry (path or
# stopword) reviewed by `security-auditor` — never disabling the rule and
# never widening it to a whole directory.
#
# Pinned scanner: gitleaks 8.30.1. gitleaks 8.30.1 only knows the `git` and
# `dir` subcommands; the older `detect`/`protect` commands no longer exist.
# See .pre-commit-config.yaml (rev v8.30.1) and the CI backstop steps in
# .github/workflows/ci.yml and .woodpecker.yml (release archive pinned by
# sha256).
#
# The default ruleset is declared (useDefault = true) so a full-coverage scan
# is available on demand. The ENFORCED (blocking) gate scopes execution to the
# deterministic incident rule via `--enable-rule reqlo-api-key`:
# the default heuristics deterministically flag intentional test fixtures
# (e.g. `VALID_API_KEY = "..."`, `DB_PASSWORD=...`) and the documented
# 44-character README example, which must NOT be reported. Backing a hard-0
# gate with the defaults would require a broad allowlist or a large baseline
# (both out of scope for SECTRACK-03); those pre-existing heuristic hits are
# tracked as follow-up triage instead.
#
# The incident rule is boundary-anchored to EXACTLY 40 alphanumeric characters
# after the `reqlo_` prefix:
#   * live incident key  -> reqlo_<40 alnum>  => MATCH
#   * README example      -> reqlo_<44 alnum>  => no match (no \b after char 40)
#   * test fixtures       -> reqlo_<...><40>   => no match (underscores/short)
# No path allowlist is used: the repository history was rewritten (SECTRACK-02)
# and is secret-free for this pattern, so the gate fails hard on any match.
title = "ReqogniLoom gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "reqlo-api-key"
description = "ReqogniLoom API key (reqlo_ prefix + 40 alphanumeric characters)"
regex = '''reqlo_[A-Za-z0-9]{40}\b'''
keywords = ["reqlo_"]

# Plan D / D2.6 (QR-S03): literal env-secret assignment, e.g.
#   SECRET_KEY=<32 bytes of real material>
#   HONCHO_API_KEY=...
#   DB_PASSWORD=...
# Runs as a blocking step over the PR diff only (see the header).
[[rules]]
id = "env-secret-assignment"
description = "Literal assignment of a secret-shaped environment variable to a non-placeholder value"
regex = '''(?m)^(SECRET_KEY|AUTH_JWT_SECRET|FIELD_ENCRYPTION_KEY|[A-Z_]*API_KEY|[A-Z_]*PASSWORD)=\S{12,}'''
keywords = ["SECRET_KEY", "AUTH_JWT_SECRET", "FIELD_ENCRYPTION_KEY", "API_KEY", "PASSWORD"]

  # Fixtures and docs legitimately contain assignment-shaped sample values.
  # `CHANGE-ME…` is the documented placeholder of .env.example and the
  # `…-IN-PRODUCTION…` suffix it uses.
  [rules.allowlist]
  paths = [
    '''\.example$''',
    '''(^|/)tests?/''',
    '''(^|/)test_[^/]*\.py$''',
    '''^e2e/''',
  ]
  stopwords = [
    "CHANGE-ME",
    "change-me",
  ]

