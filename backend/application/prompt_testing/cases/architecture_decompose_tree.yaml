# Prompt-regression scenarios for the `architecture_decompose_tree` slot.
# Case files are owned by plan D (backend/application/prompt_testing/cases.py).
slot: architecture_decompose_tree
scenarios:
  - name: subsystem-without-memory
    data:
      element_title: "PaymentSystem"
      memory_context: ""
    config:
      max_breadth: 3
      max_depth: 2
    assert:
      - {type: contains, value: "PaymentSystem"}
      - {type: contains, value: "at most 3"}
      - {type: contains, value: "at most 2 levels"}
  - name: subsystem-with-memory
    data:
      element_title: "PaymentSystem"
      memory_context: "Memory: payments are processed by an external PSP."
    assert:
      - {type: contains, value: "payments are processed by an external PSP"}
