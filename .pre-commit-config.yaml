# Pre-commit hook configuration for ReqogniLoom (SECTRACK-03).
#
# Reproducible secret-scan gate for the incident pattern `reqlo_<40 alnum>`.
# The scanner is pinned to gitleaks v8.30.1 (the same sha256-pinned binary is
# installed by the CI backstop steps in .github/workflows/ci.yml and
# .woodpecker.yml).
#
# Local, non-global install of the pinned binary (no system-wide changes):
#   Windows: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip
#   Linux:   https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
#   sha256:  windows = d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e
#            linux   = 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
# Unzip/untar `gitleaks` (8.30.1) onto PATH, then run `pre-commit install` once.
#
# The hook scans the STAGED index only (`gitleaks git --staged`) and is scoped
# to the deterministic incident rule via `--enable-rule reqlo-api-key`; see
# .gitleaks.toml for why the default heuristics are not part of the blocking
# gate. Any match blocks the commit (hard 0 tolerance).
#
# Note: the upstream `gitleaks-system` hook entry uses `--pre-commit`, which
# diffs the working tree against the index. Because pre-commit stashes unstaged
# changes first, that diff is empty and staged secrets are missed. `--staged`
# is therefore used explicitly.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (reqlo_ API key, hard 0)
        description: Block commits that introduce a reqlo_<40 alnum> API key.
        entry: gitleaks git --staged --redact --config .gitleaks.toml --enable-rule reqlo-api-key
        language: system
        pass_filenames: false
