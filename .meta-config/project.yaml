  enabled: false
  mode: 'off'
  event_log: .meta-viz/events.jsonl
  server:
    port: 8765
    timeout_sec: 300
  mcp:
    port: 9090
  report:
    retention_days: 7
    session_timeout_min: 5
admin-ui:
  enabled: true
  port: 7420
  auto-sync-on-save: true
  watch-config: false
rules-preset: ''
speech-mode: caveman
dod-preset: spec-driven
tier-preset: Normal
se-focus: false
memory:
  enabled: true
  default_scope: ''
lifecycle-triggers:
  on-merge:
  - agent: code-reviewer
    task: 'Post-Merge Blast-Radius-Analyse: Prüfe betroffene Code-Pfade auf Clean-Code-Verletzungen.'
  - agent: validator
    task: 'DoD-Checkliste nach Merge: REQ-Traceability, Tests, Commit-Konventionen.'
  on-release:
  - agent: documenter
    task: Update CODEBASE_OVERVIEW.md and ARCHITECTURE.md for this release.
  - agent: release
    task: Tag, Changelog-Highlight und Release-Build via scripts/build.sh (bzw. make
      build) für die Release-Version — kein nacktes docker-compose build (sonst bleiben
      APP_VERSION/GIT_COMMIT_SHA/BUILD_TIME auf "unknown").
hooks:
  lifecycle-check:
    enabled: true
agent-prompts:
  default: modern
  modes:
    orchestrator: modern
    developer: modern
provider-options:
  Claude: {}
  Continue: {}
  Copilot: {}
  Gemini: {}
  Opencode: {}
model-overrides:
  Claude:
    developer: claude-sonnet-5
dod:
  req-traceability: false
  tests-required: false
provider-tier-overrides:
  Claude:
    powerful: claude-opus-5
    max: claude-opus-5
knowledge-engine:
  okf:
    enforce-frontmatter: true
    allowed-types:
    - Concept
    - Architecture
    - API Reference
    - Guide
    - Session Conclusion
    auto-index: true
    auto-log: true
  operations:
    ingest:
      auto-cross-reference: true
      auto-index-update: true
      batch-mode: true
    query:
      file-back-results: true
    lint:
      schedule: post-ingest
      checks:
      - broken-links
      - missing-frontmatter
      - stale-index
      - orphaned-pages
      - duplicate-concepts
  migration:
    auto-detect-sources: true
    clean-duplicates: false
    preserve-originals: true
  search:
    engine: index-only
    mcp-server: ''
  domain: internal-docs
  bundle-path: knowledge
  sources-dir: sources
  wiki-dir: wiki
  schema-language: auto
  enabled: true
