when:
  - event: push
    branch: main

# CI/CD Pipeline Phases:
# 1. Lint — code style and quality checks
# 2. Test — unit and integration tests
# 3. Build — compile and containerize
# 4. Security Scan — image and dependency scanning
# 5. Deploy — push to registry
# 6. Verify — health checks and smoke tests

steps:
  # ─────────────────────────────────────────────────────────
  # Lint Phase — Backend Code Quality
  # ─────────────────────────────────────────────────────────
  lint-backend:
    image: python:3.12-slim
    commands:
      - pip install -q flake8 black isort
      - echo "Checking Python formatting with black..."
      - black --check backend/ --exclude=migrations,__pycache__
      - echo "Checking import order with isort..."
      - isort --check-only backend/ --skip=migrations
      - echo "Running flake8 linting..."
      - flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=migrations,__pycache__

  # ─────────────────────────────────────────────────────────
  # Lint Phase — Frontend Code Quality
  # ─────────────────────────────────────────────────────────
  lint-frontend:
    image: node:22.17.0-slim
    commands:
      - cd frontend && npm ci --silent
      - echo "Running ESLint..."
      - npm run lint

  # ─────────────────────────────────────────────────────────
  # Test Phase — Backend Unit Tests
  # ─────────────────────────────────────────────────────────
  test-backend:
    image: python:3.12-slim
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: reqogniloom.settings
      SECRET_KEY: test-only-secret-key
      AUTH_JWT_SECRET: test-only-jwt-key
      FIELD_ENCRYPTION_KEY: test-only-encryption-key
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_NAME: test_reqflow
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_PASSWORD: ""
    commands:
      - cd backend && pip install -q -r requirements.txt
      - echo "Running Django system checks..."
      - python manage.py check

  # ─────────────────────────────────────────────────────────
  # Test Phase — Frontend Type Check & Build Verification
  # ─────────────────────────────────────────────────────────
  test-frontend:
    image: node:22.17.0-slim
    commands:
      - cd frontend && npm ci --silent
      - echo "Running TypeScript type check..."
      - npm run build -- --emptyOutDir

  # ─────────────────────────────────────────────────────────
  # Security Scan Phase — Dependency Scanning
  # ─────────────────────────────────────────────────────────
  security-scan-backend:
    image: python:3.12-slim
    commands:
      - pip install -q safety
      - echo "Scanning backend dependencies for known vulnerabilities..."
      - cd backend && safety check --json

  # ─────────────────────────────────────────────────────────
  # Build & Deploy Phase — Backend Container Image (Docker buildx)
  # ─────────────────────────────────────────────────────────
  # Builds multi-platform image (linux/amd64) and pushes to Codeberg registry.
  # Uses buildx plugin for efficient caching and cross-platform support.
  #
  # Build context: ./backend/ (contains Dockerfile, requirements.txt, app code)
  # Dockerfile path: Dockerfile (relative to context, i.e., ./backend/Dockerfile)
  #
  # CRITICAL FIX: Dockerfile path is relative to the build context, not project root.
  # Previously was "dockerfile: backend/Dockerfile" with "context: backend" which
  # would resolve to ./backend/backend/Dockerfile (non-existent).
  #
  # Authentication:
  # - username: dduchrow (Codeberg username)
  # - password: stored in Woodpecker secret 'cb_registry_token' (Codeberg PAT)
  build-and-push-backend:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: codeberg.org
      repo: codeberg.org/dduchrow/reqflow-backend
      # #149: also push an immutable commit-SHA tag alongside "latest" so a bad
      # deploy can be rolled back to a known-good image instead of being stuck
      # on a mutable tag. CI_COMMIT_SHA is a documented Woodpecker built-in.
      #
      # ESCALATED (not applied here): the issue also asks to stamp
      # APP_VERSION/GIT_COMMIT_SHA/BUILD_TIME build-args (consumed by
      # backend/Dockerfile:40-45, exposed via GET /api/v1/version/). Skipped
      # in this pass because the exact `plugin-docker-buildx` settings syntax
      # for `build_args` (map vs. "KEY=VALUE" list) and for reading the root
      # VERSION file / an ISO build timestamp into a step (no verified
      # CI_PIPELINE_CREATED-equivalent) couldn't be confirmed without a live
      # pipeline run — a bad guess here silently breaks every image push.
      # Needs a docs check against the pinned plugin version + one test run.
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      platforms: linux/amd64
      dockerfile: Dockerfile
      context: backend
      # Disable Provenance/SBOM attestations to ensure simple v2 manifests
      # for broader compatibility with older Docker engines (e.g., Unraid).
      # Attestation pushes OCI Manifest Index which some runtimes can't resolve.
      provenance: false
      sbom: false
      username: dduchrow
      password:
        from_secret: cb_registry_token

  # ─────────────────────────────────────────────────────────
  # Build & Deploy Phase — Frontend Container Image (Docker buildx)
  # ─────────────────────────────────────────────────────────
  # Builds multi-stage React frontend image:
  # - base stage: installs npm dependencies
  # - builder stage: builds TypeScript + Vite SPA bundle
  # - production stage: serves via nginx (non-root user, port 8080)
  #
  # Target: production (nginx-based final image)
  #
  # CRITICAL FIX: Same as backend — dockerfile path relative to context.
  build-and-push-frontend:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: codeberg.org
      repo: codeberg.org/dduchrow/reqflow-frontend
      # #149: immutable commit-SHA tag alongside "latest" for rollback capability.
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      platforms: linux/amd64
      dockerfile: Dockerfile
      context: frontend
      target: production
      provenance: false
      sbom: false
      username: dduchrow
      password:
        from_secret: cb_registry_token

  # ─────────────────────────────────────────────────────────
  # Verification Phase — Image Validation
  # ─────────────────────────────────────────────────────────
  verify-images:
    image: alpine:latest
    commands:
      - echo "✓ Docker images built and pushed successfully"
      - echo "✓ Backend image: codeberg.org/dduchrow/reqflow-backend:latest"
      - echo "✓ Frontend image: codeberg.org/dduchrow/reqflow-frontend:latest"
      - echo "✓ Pipeline complete. Ready for deployment."
