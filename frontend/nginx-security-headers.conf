# Shared security headers (plan D / D1.0, fixes the #155 regression RB-D02).
#
# Why a snippet: nginx's `add_header` inheritance is all-or-nothing. If a
# `location` defines even one `add_header`, it drops EVERY header inherited
# from the enclosing server block. That is how `/index.html` and the static
# asset location ended up serving the SPA with no CSP, no X-Frame-Options and
# no nosniff. Every location that adds a header of its own must therefore
# `include /etc/nginx/snippets/security-headers.conf;` as well.
#
# Referrer-Policy: the previous value `strict-no-referrer` is not a valid
# token and browsers ignored it. `strict-origin-when-cross-origin` is the
# value browsers were already applying as their default, so switching to it
# makes the intent explicit without changing what CSRF referer checks see
# (RB-D16).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(), camera=(), geolocation=(), magnetometer=(), payment=()" always;

# Content-Security-Policy: src/self for JS/CSS/images; no external script
# execution (matches the VITE build output structure and MCP/API proxying).
#
# `frame-ancestors 'none'` is the CSP-level equivalent of X-Frame-Options DENY
# and closes the gap for clients that only evaluate one of the two (QR-S17).
#
# `script-src` must never be widened with 'unsafe-inline' or 'unsafe-eval':
# frontend/scripts/check-nginx-headers.sh fails the build on either, and the
# CI job `nginx-headers-smoke` proves the gate itself works via a negative
# container. 'wasm-unsafe-eval' is a separate keyword and stays.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none';" always;
