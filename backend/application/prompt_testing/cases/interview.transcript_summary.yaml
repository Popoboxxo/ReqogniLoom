# Prompt-regression scenarios for the `interview.transcript_summary` slot.
# Deliberately memory-free: this slot compacts an already-supplied transcript
# and must not introduce outside facts into that digest (see prompt_slots.py).
# Case files are owned by plan D (backend/application/prompt_testing/cases.py).
slot: interview.transcript_summary
scenarios:
  - name: first-compression
    data:
      previous_summary: ""
      overflow_json: '[{"role": "user", "text": "Der Login muss JWT nutzen.", "timestamp": "2026-10-21T10:00:00Z"}]'
    assert:
      - {type: contains, value: "Der Login muss JWT nutzen"}
      - {type: not-contains, value: "{memory_context}"}
  - name: second-compression
    data:
      previous_summary: "The user asked for a login."
      overflow_json: '[{"role": "user", "text": "Tokens laufen nach 15 Minuten ab.", "timestamp": "2026-10-21T10:05:00Z"}]'
    assert:
      - {type: contains, value: "The user asked for a login"}
      - {type: contains, value: "Tokens laufen nach 15 Minuten ab"}
