name: reqogniloom
version: 1.0.0
# Host-minimum per ADR-017: this artifact keeps its own SemVer, independent of the
# server's VERSION file. minServerVersion is the lowest ReqogniLoom server version
# this plugin was actually verified against — 1.8.0-beta.21, where the tool
# catalogue (248 tools), `tools/list`, the `workspace_id`-carrying tools and the
# multi-server flows were exercised live. It is a statement, not a gate: the tool
# list is read at runtime, so an older server works with however many tools it
# publishes.
minServerVersion: "1.8.0-beta.21"
description: "ReqogniLoom in Hermes: interviews via /reqogniloom, listen mode, and a dashboard tab with multi-server management, the full MCP tool surface (read, compute and write, each behind a confirmation gate) and an explicit human-approval path."
author: "ReqogniLoom"
# Declarative only — registration happens in register(ctx), guarded so the slash
# command still loads on a host whose context has no register_hook. pre_llm_call
# observes the user's own messages in listen mode; it returns None and never
# injects context into the turn.
hooks: [pre_llm_call]
